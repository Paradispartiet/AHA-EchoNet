name: Bootstrap Nature Fagverk runtime activation

on:
  push:
    branches: [activation/natur-fagverk-v1-runtime]
    paths:
      - ".github/workflows/bootstrap-nature-fagverk-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: activation/natur-fagverk-v1-runtime
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Nature runtime source changes
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {text.count(old)}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          registry_path = Path("data/integrations/runtime/history-go-fagverk-runtime-registry.v1.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          registry["version"] = "1.1.0"
          subjects = dict(registry["active_subjects"])
          subjects["natur"] = {
              "subject_id": "natur",
              "approval_path": "data/integrations/approvals/history-go-fagverk-natur.approved.v1.json",
              "candidate_corpus_path": "data/integrations/candidates/history-go-fagverk-natur.candidate.v1.json",
              "review_policy_path": "data/integrations/review/history-go-fagverk-natur.term-policy.v1.json",
              "runtime_corpus_path": "data/integrations/runtime/history-go-fagverk-natur.corpus.v1.json",
              "runtime_policy_path": "data/integrations/runtime/history-go-fagverk-natur.policy.v1.json",
              "scoring_mode": "subject_policy_v1",
              "minimum_score": 7,
              "minimum_terms": 2,
              "ambiguity_margin": 3
          }
          registry["active_subjects"] = {key: subjects[key] for key in sorted(subjects)}
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          replace_once(
              "scripts/build-history-go-fagverk-runtime-activation.mjs",
              '  if (reviewPolicy.activation_allowed !== false) throw new Error(`${config.subject_id}: review policy must remain non-runtime before materialization.`);',
              '  const reviewRuntimeAllowed = reviewPolicy.runtime_activation_allowed ?? reviewPolicy.activation_allowed;\n  if (reviewRuntimeAllowed !== false) throw new Error(`${config.subject_id}: review policy must remain non-runtime before materialization.`);'
          )
          replace_once(
              "scripts/build-history-go-fagverk-runtime-activation.mjs",
              '    ...(reviewPolicy.temporal_gate ? { temporal_gate: reviewPolicy.temporal_gate } : {}),\n    chapter_rules: reviewPolicy.chapter_rules,',
              '    ...(reviewPolicy.temporal_gate ? { temporal_gate: reviewPolicy.temporal_gate } : {}),\n    ...(reviewPolicy.domain_gate ? { domain_gate: reviewPolicy.domain_gate } : {}),\n    chapter_rules: reviewPolicy.chapter_rules,'
          )

          replace_once(
              "backend/aha_engine/app/engine/fagverk_grounding.py",
              '    temporal_gate = policy.get("temporal_gate") or {}\n',
              '    domain_gate = policy.get("domain_gate") or {}\n    domain_required = domain_gate.get("required") is True\n    domain_terms = [_normalize(term) for term in domain_gate.get("terms", []) if _normalize(term)]\n    domain_eligible = not domain_required or any(\n        _policy_term_present(message, tokens, term) for term in domain_terms\n    )\n\n    temporal_gate = policy.get("temporal_gate") or {}\n'
          )
          replace_once(
              "backend/aha_engine/app/engine/fagverk_grounding.py",
              '    eligible = temporal_eligible and anchor_eligible\n',
              '    eligible = domain_eligible and temporal_eligible and anchor_eligible\n'
          )

          replace_once(
              "tests/aha-fagverk-runtime-activation.test.cjs",
              "const subjectIds = Object.keys(registry.active_subjects);",
              "const subjectIds = Object.keys(registry.active_subjects).sort();"
          )
          replace_once(
              "tests/aha-fagverk-runtime-activation.test.cjs",
              "assert.deepEqual(subjectIds, ['historie', 'politikk']);",
              "assert.deepEqual(subjectIds, ['historie', 'natur', 'politikk']);"
          )
          replace_once(
              "tests/aha-fagverk-runtime-activation.test.cjs",
              "  politikk: {\n    sourceRef: 'c16a187453d16a40f9cab4ca694c32e96014f31b',",
              "  natur: {\n    sourceRef: 'c16a187453d16a40f9cab4ca694c32e96014f31b',\n    corpusSha: 'd29f05a0b08fd5673e4bc0d320e896e4f75ec67ff217284188d0e77bed14b00e',\n    chapterCount: 11,\n    thresholds: { minimum_score: 7, minimum_terms: 2, ambiguity_margin: 3 },\n  },\n  politikk: {\n    sourceRef: 'c16a187453d16a40f9cab4ca694c32e96014f31b',"
          )
          replace_once(
              "tests/aha-fagverk-runtime-activation.test.cjs",
              "  if (subjectId === 'historie') {\n    assert.equal(policy.temporal_gate.required, true);\n    assert.equal(Array.isArray(policy.temporal_gate.terms), true);\n    assert.equal(policy.temporal_gate.terms.includes('over tid'), true);\n    assert.equal(Object.keys(policy.chapter_rules).length, 23);\n  } else {\n    assert.equal(policy.temporal_gate, undefined);\n    assert.equal(policy.chapter_rules.parlamentarisme.required_anchor_terms.includes('mistillit'), true);\n  }",
              "  if (subjectId === 'historie') {\n    assert.equal(policy.temporal_gate.required, true);\n    assert.equal(Array.isArray(policy.temporal_gate.terms), true);\n    assert.equal(policy.temporal_gate.terms.includes('over tid'), true);\n    assert.equal(policy.domain_gate, undefined);\n    assert.equal(Object.keys(policy.chapter_rules).length, 23);\n  } else if (subjectId === 'natur') {\n    assert.equal(policy.temporal_gate, undefined);\n    assert.equal(policy.domain_gate.required, true);\n    assert.equal(policy.domain_gate.terms.includes('artsbestemmelse'), true);\n    assert.equal(policy.domain_gate.terms.includes('hydrologi'), true);\n    assert.equal(Object.keys(policy.chapter_rules).length, 11);\n  } else {\n    assert.equal(policy.temporal_gate, undefined);\n    assert.equal(policy.domain_gate, undefined);\n    assert.equal(policy.chapter_rules.parlamentarisme.required_anchor_terms.includes('mistillit'), true);\n  }"
          )
          replace_once(
              "tests/aha-fagverk-runtime-activation.test.cjs",
              "assert.equal(active.effective_entry_count, 37);",
              "assert.equal(active.effective_entry_count, 47);"
          )
          replace_once(
              "tests/aha-fagverk-runtime-activation.test.cjs",
              "assert.equal(runtimeCode.includes('temporal_gate'), true);",
              "assert.equal(runtimeCode.includes('temporal_gate'), true);\nassert.equal(runtimeCode.includes('domain_gate'), true);"
          )

          replace_once(
              ".github/workflows/aha-fagverk-runtime-activation.yml",
              '      - "backend/aha_engine/tests/test_history_fagverk_runtime.py"\n',
              '      - "backend/aha_engine/tests/test_history_fagverk_runtime.py"\n      - "backend/aha_engine/tests/test_nature_fagverk_runtime.py"\n'
          )

          replace_once(
              "backend/aha_engine/tests/test_fagverk_grounding.py",
              'POLITICS_CORRECTIONS_PATH = ROOT / "data" / "evaluation" / "aha-politics-fixture-corrections.v1.json"\n',
              'POLITICS_CORRECTIONS_PATH = ROOT / "data" / "evaluation" / "aha-politics-fixture-corrections.v1.json"\nNATURE_MATRIX_PATH = ROOT / "data" / "evaluation" / "aha-nature-fagverk-evaluation-matrix.v1.json"\nNATURE_CORRECTIONS_PATH = ROOT / "data" / "evaluation" / "aha-nature-fixture-corrections.v1.json"\n'
          )
          replace_once(
              "backend/aha_engine/tests/test_fagverk_grounding.py",
              '    assert len(corpus["entries"]) == 37\n',
              '    assert len(corpus["entries"]) == 47\n'
          )
          replace_once(
              "backend/aha_engine/tests/test_fagverk_grounding.py",
              '    politics_entries = [entry for entry in corpus["entries"] if entry["subject_id"] == "politikk"]\n',
              '    nature_entries = [entry for entry in corpus["entries"] if entry["subject_id"] == "natur"]\n    assert len(nature_entries) == 11\n    assert len({entry["chapter_id"] for entry in nature_entries}) == 11\n    politics_entries = [entry for entry in corpus["entries"] if entry["subject_id"] == "politikk"]\n'
          )
          replace_once(
              "backend/aha_engine/tests/test_fagverk_grounding.py",
              '    assert set(corpus["subject_policies"]) == {"historie", "politikk"}\n',
              '    assert set(corpus["subject_policies"]) == {"historie", "natur", "politikk"}\n'
          )
          replace_once(
              "backend/aha_engine/tests/test_fagverk_grounding.py",
              '    assert manifest["effective_entry_count"] == 37\n    assert set(manifest["active_subjects"]) == {"historie", "politikk"}\n',
              '    assert manifest["effective_entry_count"] == 47\n    assert set(manifest["active_subjects"]) == {"historie", "natur", "politikk"}\n'
          )
          replace_once(
              "backend/aha_engine/tests/test_fagverk_grounding.py",
              '    politics = manifest["active_subjects"]["politikk"]\n',
              '    nature = manifest["active_subjects"]["natur"]\n    assert nature["chapter_count"] == 11\n    assert nature["source_commit"] == "c16a187453d16a40f9cab4ca694c32e96014f31b"\n    assert nature["corpus_path"].startswith("data/integrations/runtime/")\n    assert nature["policy_path"].startswith("data/integrations/runtime/")\n    assert "/review/" not in nature["corpus_path"]\n    assert "/review/" not in nature["policy_path"]\n    politics = manifest["active_subjects"]["politikk"]\n'
          )

          Path("backend/aha_engine/tests/test_nature_fagverk_runtime.py").write_text('''from __future__ import annotations

import json
from pathlib import Path

from app.engine.fagverk_grounding import ground_message, load_fagverk_corpus

ROOT = Path(__file__).resolve().parents[3]
MATRIX_PATH = ROOT / "data" / "evaluation" / "aha-nature-fagverk-evaluation-matrix.v1.json"
CORRECTIONS_PATH = ROOT / "data" / "evaluation" / "aha-nature-fixture-corrections.v1.json"


def _nature_only_corpus() -> dict:
    corpus = load_fagverk_corpus()
    return {
        "schema": corpus["schema"],
        "version": corpus["version"],
        "source_repo": corpus["source_repo"],
        "source_ref": corpus["source_ref"],
        "entries": [entry for entry in corpus["entries"] if entry["subject_id"] == "natur"],
        "subject_policies": {"natur": corpus["subject_policies"]["natur"]},
    }


def test_nature_runtime_policy_preserves_review_domain_gate() -> None:
    corpus = _nature_only_corpus()
    policy = corpus["subject_policies"]["natur"]
    assert policy["thresholds"] == {"minimum_score": 7, "minimum_terms": 2, "ambiguity_margin": 3}
    assert policy["domain_gate"]["required"] is True
    assert "artsbestemmelse" in policy["domain_gate"]["terms"]
    assert "hydrologi" in policy["domain_gate"]["terms"]
    assert "temporal_gate" not in policy

    generic = ground_message(
        "Forvaltning, ressurser, tiltak og langsiktig utvikling må vurderes samlet.",
        corpus,
    )
    assert generic["status"] == "unsupported"

    ecological = ground_message(
        "Habitatkvalitet, næringsnett og økosystemtjenester viser økologisk funksjon i området.",
        corpus,
    )
    assert ecological["status"] == "grounded"
    assert ecological["match"]["chapter_id"] == "okosystem_mangfold_habitat"


def test_all_reviewed_nature_matrix_cases_pass_in_python_runtime() -> None:
    matrix = json.loads(MATRIX_PATH.read_text(encoding="utf-8"))
    corpus = _nature_only_corpus()
    assert len(matrix["positive_cases"]) == 11
    assert len(matrix["confusion_cases"]) == 11
    assert len(matrix["ambiguity_cases"]) == 12

    for case in [*matrix["positive_cases"], *matrix["confusion_cases"]]:
        result = ground_message(case["text"], corpus)
        assert result["status"] == case["expected_status"], (case["id"], result)
        assert result["match"]["subject_id"] == "natur", (case["id"], result)
        assert result["match"]["chapter_id"] == case["expected_chapter_id"], (case["id"], result)
        assert result["match"]["scoring_mode"] == "subject_policy_v1"
        assert result["match"]["chapter_id"] not in case.get("forbidden_chapter_ids", [])

    for case in matrix["ambiguity_cases"]:
        result = ground_message(case["text"], corpus)
        assert result["status"] in case["allowed_statuses"], (case["id"], result)


def test_all_reviewed_nature_fixture_corrections_pass_in_python_runtime() -> None:
    corrections = json.loads(CORRECTIONS_PATH.read_text(encoding="utf-8"))
    corpus = _nature_only_corpus()
    assert len(corrections["cases"]) == 16

    for correction in corrections["cases"]:
        fixture = json.loads((ROOT / correction["fixture_path"]).read_text(encoding="utf-8"))
        result = ground_message(fixture["inputText"], corpus)
        assert result["status"] == correction["expected_nature_status"], (correction["id"], result)
        assert result.get("match", {}).get("chapter_id") == correction["expected_chapter_id"]


def test_nature_positive_cases_win_in_composed_runtime() -> None:
    matrix = json.loads(MATRIX_PATH.read_text(encoding="utf-8"))
    for case in matrix["positive_cases"]:
        result = ground_message(case["text"])
        assert result["status"] == "grounded", (case["id"], result)
        assert result["match"]["subject_id"] == "natur", (case["id"], result)
        assert result["match"]["chapter_id"] == case["expected_chapter_id"], (case["id"], result)


def test_nature_abstentions_do_not_override_other_subjects() -> None:
    corrections = json.loads(CORRECTIONS_PATH.read_text(encoding="utf-8"))
    for correction in corrections["cases"]:
        fixture = json.loads((ROOT / correction["fixture_path"]).read_text(encoding="utf-8"))
        result = ground_message(fixture["inputText"])
        assert not (
            result["status"] == "grounded" and result["match"]["subject_id"] == "natur"
        ), (correction["id"], result)
''', encoding="utf-8")

          Path("docs/AHA_NATURE_FAGVERK_RUNTIME_V1.md").write_text('''# AHA Nature Fagverk runtime v1

Natur er materialisert som et aktivt, separat fag i AHA-runtime fra History Go-kildecommit `c16a187453d16a40f9cab4ca694c32e96014f31b`.

Aktiveringen erstatter legacy-seedkapittelet for Natur med 11 godkjente kapitler. Historie og Politikk beholdes uendret som aktive fag. Den sammensatte runtimekorpusen består dermed av 47 effektive kapitler.

Natur-policyen krever både et globalt Natur-domeneanker og et kapittelspesifikt anker. Generiske ord som «natur», «miljø», «vann», «energi», «ressurser» og «forvaltning» er ikke tilstrekkelige alene.

Runtime leser kun materialiserte filer under `data/integrations/runtime/`. Review- og approvalfiler brukes bare av byggeren og er ikke direkte runtimeinput.
''', encoding="utf-8")
          PY

      - name: Materialize Nature runtime artifacts
        run: node scripts/build-history-go-fagverk-runtime-activation.mjs

      - name: Validate Node runtime contract
        run: |
          node tests/aha-fagverk-runtime-activation.test.cjs
          node tests/aha-fagverk-subject-approvals.test.cjs

      - name: Install Python dependencies
        working-directory: backend/aha_engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Python runtime and cross-subject behavior
        working-directory: backend/aha_engine
        run: python -m pytest tests/test_fagverk_grounding.py tests/test_history_fagverk_runtime.py tests/test_nature_fagverk_runtime.py

      - name: Verify exact activation scope
        env:
          ALLOWED_JSON: '[".github/workflows/aha-fagverk-runtime-activation.yml",".github/workflows/bootstrap-nature-fagverk-runtime.yml","backend/aha_engine/app/engine/fagverk_grounding.py","backend/aha_engine/tests/test_fagverk_grounding.py","backend/aha_engine/tests/test_nature_fagverk_runtime.py","data/integrations/history-go-fagverk-release.approved.json","data/integrations/history-go-fagverk-release.runtime-active.json","data/integrations/runtime/history-go-fagverk-natur.corpus.v1.json","data/integrations/runtime/history-go-fagverk-natur.policy.v1.json","data/integrations/runtime/history-go-fagverk-runtime-registry.v1.json","docs/AHA_NATURE_FAGVERK_RUNTIME_V1.md","scripts/build-history-go-fagverk-runtime-activation.mjs","tests/aha-fagverk-runtime-activation.test.cjs"]'
        run: |
          rm .github/workflows/bootstrap-nature-fagverk-runtime.yml
          node - <<'NODE'
          const { execFileSync } = require("child_process");
          const allowed = new Set(JSON.parse(process.env.ALLOWED_JSON));
          const status = execFileSync("git", ["status", "--porcelain"], { encoding: "utf8" });
          const actual = status.trimEnd().split(/\n/).filter(Boolean).map((line) => line.slice(3));
          const unexpected = actual.filter((file) => !allowed.has(file));
          const missing = [...allowed].filter((file) => !actual.includes(file));
          if (unexpected.length || missing.length) {
            console.error({ unexpected, missing, actual });
            process.exit(1);
          }
          console.log(`Nature runtime activation scope verified: ${actual.length} files.`);
          NODE

      - name: Commit Nature runtime activation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Activate complete Nature Fagverk runtime"
          git push origin HEAD:activation/natur-fagverk-v1-runtime
