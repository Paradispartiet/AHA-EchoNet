name: Bootstrap Subculture Fagverk runtime activation

on:
  push:
    branches:
      - activation/subkultur-fagverk-v1-runtime

permissions:
  contents: write

jobs:
  materialize-subculture-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: activation/subkultur-fagverk-v1-runtime
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fix reviewed-to-active transition in bootstrap source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/bootstrap-subculture-runtime-activation.py')
          text = p.read_text(encoding='utf-8')
          old = '''replace(approval_test,
                  "assert.equal(runtimeActive.active_subjects.subkultur, undefined);",
                  "assert.equal(runtimeActive.active_subjects.subkultur.subject_id, 'subkultur');\\nassert.equal(runtimeActive.active_subjects.subkultur.chapter_count, 8);\\nassert.equal(runtimeActive.active_subjects.subkultur.activation_status, 'runtime_subject_active');")'''
          new = '''replace(approval_test,
                  "assert.equal(runtimeActive.active_subjects.natur.activation_status, 'runtime_subject_active');",
                  "assert.equal(runtimeActive.active_subjects.natur.activation_status, 'runtime_subject_active');\\nassert.equal(runtimeActive.active_subjects.subkultur.subject_id, 'subkultur');\\nassert.equal(runtimeActive.active_subjects.subkultur.chapter_count, 8);\\nassert.equal(runtimeActive.active_subjects.subkultur.activation_status, 'runtime_subject_active');")'''
          if old not in text:
              raise SystemExit('stale Subculture transition block not found')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Materialize Subculture runtime
        run: python scripts/bootstrap-subculture-runtime-activation.py
      - name: Install Python engine test dependencies
        working-directory: backend/aha_engine
        run: pip install -r requirements.txt
      - name: Run Python Fagverk runtime tests
        working-directory: backend/aha_engine
        run: pytest -q tests/test_fagverk_grounding.py
      - name: Run full Node suite
        run: npm test
      - name: Remove bootstrap source
        run: rm scripts/bootstrap-subculture-runtime-activation.py
      - name: Commit materialized activation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!.github/workflows/aha-subculture-fagverk-review.yml'
          git commit -m "Materialize Subculture Fagverk runtime activation"
          git push origin HEAD:activation/subkultur-fagverk-v1-runtime
