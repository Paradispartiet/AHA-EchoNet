name: Bootstrap Politics runtime parity fix

on:
  push:
    branches:
      - activation/politics-fagverk-v2-runtime

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: activation/politics-fagverk-v2-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Preserve high-confidence canonical analyses
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/aha_engine/app/engine/fagverk_grounding.py')
          text = path.read_text(encoding='utf-8')
          old = '    should_replace_generic = data.get("domain") == "generic_academic" or domain_confidence < 0.6\n\n    if should_replace_generic:\n'
          new = '    should_replace_generic = domain_confidence < 0.6\n    if not should_replace_generic:\n        return base\n\n    if should_replace_generic:\n'
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new not in text:
              raise SystemExit('Expected grounding replacement block was not found.')
          PY
          python -m py_compile backend/aha_engine/app/engine/fagverk_grounding.py
      - name: Commit parity fix
        run: |
          if git diff --quiet; then
            echo "Parity fix is already applied."
            exit 0
          fi
          if [[ "$(git diff --name-only)" != "backend/aha_engine/app/engine/fagverk_grounding.py" ]]; then
            git diff --name-only
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/aha_engine/app/engine/fagverk_grounding.py
          git commit -m "Preserve high-confidence canonical analyses"
          git push origin HEAD:activation/politics-fagverk-v2-runtime
