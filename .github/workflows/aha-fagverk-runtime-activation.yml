name: AHA canonical Fagverk bridge

on:
  pull_request:
    branches: [main]
    paths:
      - "data/integrations/history-go-fagverk-bridge.v2.json"
      - "data/integrations/runtime/history-go-fagverk-canonical-index.v2.json"
      - "data/subjects/**"
      - "docs/HISTORY_GO_FAGVERK_BRIDGE_V2.md"
      - "scripts/build-history-go-fagverk-canonical-index-v2.mjs"
      - "scripts/ensure-python-fagverk-canonical-v2.mjs"
      - "scripts/materialize-history-go-fagverk-subjects.mjs"
      - "scripts/audit-local-subject-knowledge.mjs"
      - "js/ahaSubjectEngine.js"
      - "js/emnerLoader.js"
      - "tests/aha-history-go-fagverk-canonical-bridge-v2.test.cjs"
      - "tests/aha-history-go-fagverk-subject-bridge.integration.test.cjs"
      - "tests/aha-local-subject-knowledge-audit.test.cjs"
      - "tests/aha-production-analysis-pipeline-audit.test.cjs"
      - "tests/aha-production-analysis-quality-matrix.test.cjs"
      - "backend/aha_engine/app/engine/fagverk_canonical.py"
      - "backend/aha_engine/app/engine/fagverk_grounding.py"
      - "backend/aha_engine/tests/test_fagverk_grounding.py"
      - ".github/workflows/aha-fagverk-runtime-activation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-canonical-bridge:
    name: Validate canonical History-Go Fagverk bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build pinned canonical deployment index
        run: node scripts/build-history-go-fagverk-canonical-index-v2.mjs --write

      - name: Route Python production grounding to canonical index
        run: node scripts/ensure-python-fagverk-canonical-v2.mjs --write

      - name: Persist deterministic canonical artifacts on same-repo PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          CHANGED="$(git status --porcelain -- data/integrations/runtime/history-go-fagverk-canonical-index.v2.json backend/aha_engine/app/engine/fagverk_grounding.py)"
          if [ -z "$CHANGED" ]; then
            echo "Canonical deployment artifacts already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/integrations/runtime/history-go-fagverk-canonical-index.v2.json backend/aha_engine/app/engine/fagverk_grounding.py
          git commit -m "chore(fagverk): refresh canonical deployment consumers"
          git push origin "HEAD:${HEAD_REF}"

      - name: Verify exact canonical parity
        run: |
          node scripts/build-history-go-fagverk-canonical-index-v2.mjs --check
          node scripts/ensure-python-fagverk-canonical-v2.mjs --check

      - name: Verify bridge authority and Subject Engine integration
        run: |
          node scripts/materialize-history-go-fagverk-subjects.mjs --check
          node tests/aha-history-go-fagverk-canonical-bridge-v2.test.cjs
          node tests/aha-history-go-fagverk-subject-bridge.integration.test.cjs

      - name: Verify production analysis provenance and subject routing
        run: |
          node tests/aha-production-analysis-pipeline-audit.test.cjs
          node tests/aha-production-analysis-quality-matrix.test.cjs

      - name: Verify governed AHA overlays
        run: |
          node scripts/audit-local-subject-knowledge.mjs --check
          node tests/aha-local-subject-knowledge-audit.test.cjs

      - name: Install Python dependencies
        working-directory: backend/aha_engine
        run: python -m pip install -r requirements.txt

      - name: Verify Python canonical Fagverk consumer and calibration regressions
        working-directory: backend/aha_engine
        run: python -m pytest tests/test_fagverk_grounding.py

      - name: Upload canonical deployment index
        uses: actions/upload-artifact@v4
        with:
          name: aha-history-go-fagverk-canonical-index-v2
          path: data/integrations/runtime/history-go-fagverk-canonical-index.v2.json
          if-no-files-found: error
          retention-days: 14
