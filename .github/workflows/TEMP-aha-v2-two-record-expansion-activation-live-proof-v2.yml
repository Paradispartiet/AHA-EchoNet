name: TEMP AHA V2 two-record expansion activation live proof v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pages: read

jobs:
  proof:
    if: github.head_ref == 'probe/v2-two-record-expansion-activation-live-proof-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_MAIN_SHA: b42917de4ec4fa30fbab8c68b2dc3e25c663743d
      AHA_FRONTEND_ORIGIN: https://paradispartiet.github.io/AHA-EchoNet
      AHA_AGENT_ENDPOINT: https://aha-agent-7a3y.onrender.com/api/aha-agent/semantic-document
      PROOF_OUTPUT: probe-evidence/two-record-expansion-activation-live-proof-v2.json
      PARITY_PATH: probe-evidence/pages-activation-parity-v2.json
      DEPLOYED_ASSET_DIR: probe-evidence/deployed-assets
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Commit exact TEMP housekeeping-boundary correction
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/TEMP-aha-v2-two-record-expansion-activation-live-proof-v2.cjs")
          text = path.read_text()
          replacements = [
              (
                  '  assert.equal(same(chamberSnapshot(storage), chamberBeforeActivation), true, "final Chamber must equal exact pre-activation state");\n',
                  '  const finalChamber = chamberSnapshot(storage);\n'
                  '  const finalBusinessState = clone(finalChamber);\n'
                  '  const preActivationBusinessState = clone(chamberBeforeActivation);\n'
                  '  delete finalBusinessState._local_updated_at;\n'
                  '  delete preActivationBusinessState._local_updated_at;\n'
                  '  const expectedFinalTopLevelKeys = [...new Set([...Object.keys(chamberBeforeActivation), "_local_updated_at"])].sort();\n'
                  '  const finalTopLevelKeys = Object.keys(finalChamber).sort();\n'
                  '  assert.equal(same(finalBusinessState, preActivationBusinessState), true, "final Chamber business state must equal exact pre-activation state");\n'
                  '  assert.deepEqual(finalTopLevelKeys, expectedFinalTopLevelKeys, "_local_updated_at must be the only allowed top-level housekeeping delta");\n'
                  '  assert.equal(typeof finalChamber._local_updated_at, "string", "final Chamber must expose _local_updated_at housekeeping timestamp");\n'
              ),
              (
                  '    final_chamber_exact_pre_activation_state: same(chamberSnapshot(storage), chamberBeforeActivation),\n',
                  '    final_chamber_exact_pre_activation_business_state: same(finalBusinessState, preActivationBusinessState),\n'
                  '    final_chamber_only_local_updated_at_housekeeping_delta: same(finalTopLevelKeys, expectedFinalTopLevelKeys) && typeof finalChamber._local_updated_at === "string",\n'
              ),
              (
                  '      final_chamber_exact_pre_activation_state: activation.final_chamber_exact_pre_activation_state,\n',
                  '      final_chamber_exact_pre_activation_business_state: activation.final_chamber_exact_pre_activation_business_state,\n'
                  '      final_chamber_only_local_updated_at_housekeeping_delta: activation.final_chamber_only_local_updated_at_housekeeping_delta,\n'
              ),
              (
                  '  assert.equal(proof.activation.final_chamber_exact_pre_activation_state, true);\n',
                  '  assert.equal(proof.activation.final_chamber_exact_pre_activation_business_state, true);\n'
                  '  assert.equal(proof.activation.final_chamber_only_local_updated_at_housekeeping_delta, true);\n'
              ),
              (
                  '    final_chamber_exact_pre_activation_state: proof.activation.final_chamber_exact_pre_activation_state,\n',
                  '    final_chamber_exact_pre_activation_business_state: proof.activation.final_chamber_exact_pre_activation_business_state,\n'
                  '    final_chamber_only_local_updated_at_housekeeping_delta: proof.activation.final_chamber_only_local_updated_at_housekeeping_delta,\n'
              ),
          ]

          changed = False
          for old, new in replacements:
              count = text.count(old)
              if count == 1:
                  text = text.replace(old, new, 1)
                  changed = True
              elif count == 0 and new in text:
                  continue
              else:
                  raise SystemExit(f"unexpected replacement count {count}: {old[:80]!r}")

          if changed:
              path.write_text(text)
          PY

          if git diff --quiet -- scripts/TEMP-aha-v2-two-record-expansion-activation-live-proof-v2.cjs; then
            echo "TEMP proof correction already committed."
            exit 0
          fi

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/TEMP-aha-v2-two-record-expansion-activation-live-proof-v2.cjs
          git commit -m "TEMP: treat Chamber local timestamp as housekeeping"
          git push origin "HEAD:${HEAD_BRANCH}"
          echo "Committed exact TEMP correction; stopping stale workflow run so the next run proves the committed head."
          exit 1

      - name: Prove TEMP branch isolation
        run: |
          set -euo pipefail
          mkdir -p probe-evidence/deployed-assets
          merge_base="$(git merge-base "$EXPECTED_MAIN_SHA" HEAD)"
          [[ "$merge_base" == "$EXPECTED_MAIN_SHA" ]]
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN_SHA"...HEAD | sort)
          expected=(
            ".github/workflows/TEMP-aha-v2-two-record-expansion-activation-live-proof-v2.yml"
            "scripts/TEMP-aha-v2-two-record-expansion-activation-live-proof-v2.cjs"
          )
          [[ ${#changed[@]} -eq ${#expected[@]} ]]
          for i in "${!expected[@]}"; do
            [[ "${changed[$i]}" == "${expected[$i]}" ]]
          done
          printf '{\n  "schema":"aha_v2_two_record_expansion_activation_temp_isolation_v2",\n  "expected_main":"%s",\n  "probe_head":"%s",\n  "merge_base":"%s",\n  "product_diff_count":0,\n  "temp_files":["%s","%s"]\n}\n' \
            "$EXPECTED_MAIN_SHA" "$(git rev-parse HEAD)" "$merge_base" "${expected[0]}" "${expected[1]}" \
            > probe-evidence/temp-activation-isolation-v2.json

      - name: Capture exact deployed Pages bytes and prove activation parity
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          latest_json=''
          pages_commit=''
          pages_status=''
          matched_attempt=0
          for attempt in $(seq 1 18); do
            latest_json="$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/pages/builds/latest")"
            pages_commit="$(printf '%s' "$latest_json" | jq -r '.commit // empty')"
            pages_status="$(printf '%s' "$latest_json" | jq -r '.status // empty')"
            echo "Pages attempt ${attempt}: commit=${pages_commit:-missing} status=${pages_status:-missing}"
            if [[ "$pages_commit" == "$EXPECTED_MAIN_SHA" && "$pages_status" == "built" ]]; then
              matched_attempt="$attempt"
              break
            fi
            sleep 10
          done
          printf '%s\n' "$latest_json" > probe-evidence/pages-build-latest-activation-v2.json
          [[ "$pages_commit" == "$EXPECTED_MAIN_SHA" ]]
          [[ "$pages_status" == "built" ]]
          [[ "$matched_attempt" -gt 0 ]]

          assets=(
            "insight-expansion-v2.html"
            "chat.html"
            "js/ahaInsightExpansionOperatorV2.js"
            "js/ahaSemanticInsightQualityGate.js"
            "js/ahaSemanticEvaluationRuntime.js"
            "js/ahaSemanticEvaluationBootstrap.js"
            "js/ahaInsightQualityGateV2.js"
            "js/ahaInsightSynthesisRuntimeV2.js"
            "js/ahaInsightSynthesisBootstrapV2.js"
            "js/ahaInsightActivationV2.js"
            "js/ahaV2ControlledWriteExpansionGate.js"
            "js/ahaV2ControlledWriteExpansionActivation.js"
            "js/insightsChamber.js"
            "js/ahaChamberSync.js"
            "ops/evidence/aha-v2-controlled-write-expansion-gate-current-v1.json"
            "ops/evidence/aha-v2-two-record-expansion-live-proof-v1.json"
            "ops/evidence/aha-v2-controlled-write-pilot-live-proof-v1.json"
            "ops/contracts/aha-v2-controlled-write-expansion-scope-two-record-v1.json"
            "tests/fixtures/semantic-live-reviewed-v2/post-stability-two-round-v1/provenance.json"
            "tests/fixtures/semantic-live-reviewed-v2/post-stability-two-round-v1/summary.json"
          )
          printf '{\n  "schema":"aha_v2_two_record_expansion_activation_pages_parity_v2",\n  "expected_main":"%s",\n  "pages_commit":"%s",\n  "pages_status":"%s",\n  "matched_attempt":%s,\n  "execution_source":"captured_hash_verified_deployed_bytes",\n  "assets":[\n' \
            "$EXPECTED_MAIN_SHA" "$pages_commit" "$pages_status" "$matched_attempt" > "$PARITY_PATH"
          first=1
          for asset in "${assets[@]}"; do
            expected_sha="$(git show "$EXPECTED_MAIN_SHA:$asset" | sha256sum | awk '{print $1}')"
            captured="$DEPLOYED_ASSET_DIR/${asset//\//__}"
            curl -fsSL \
              -H "Cache-Control: no-cache" \
              "${AHA_FRONTEND_ORIGIN}/${asset}?aha_v2_expansion_activation_v2=${GITHUB_RUN_ID}" \
              > "$captured"
            actual_sha="$(sha256sum "$captured" | awk '{print $1}')"
            echo "$asset expected=$expected_sha captured_deployed=$actual_sha"
            [[ "$expected_sha" == "$actual_sha" ]]
            if [[ $first -eq 0 ]]; then printf ',\n' >> "$PARITY_PATH"; fi
            first=0
            printf '    {"path":"%s","sha256":"%s","match":true,"captured_file":"%s"}' \
              "$asset" "$actual_sha" "$captured" >> "$PARITY_PATH"
          done
          printf '\n  ],\n  "all_assets_match":true\n}\n' >> "$PARITY_PATH"

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run corrected two-record activation production proof
        run: node scripts/TEMP-aha-v2-two-record-expansion-activation-live-proof-v2.cjs

      - name: Upload redacted corrected activation proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aha-v2-two-record-expansion-activation-live-proof-v2-${{ github.run_id }}
          path: probe-evidence/
          if-no-files-found: warn
          retention-days: 30
