name: AHA Azure billing ticket final

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/aha-azure-billing-ticket-final-g183505786.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  create-billing-ticket:
    name: Final Azure billing ticket G183505786
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: aha-canonical-production-infra

    steps:
      - name: Azure OIDC login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install current Azure Support CLI extension
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name support --upgrade --only-show-errors

      - name: Create or recover billing support ticket
        shell: bash
        run: |
          set -euo pipefail

          ticket_name="aha-billing-g183505786-final"
          problem_classification="/providers/Microsoft.Support/services/517f2da6-78fd-0498-4e22-ad26996b1dfc/problemClassifications/d0f16bf7-e011-3f3b-1c26-3147f84e0896"
          title="Unexpected Azure invoice G183505786 - AHA production pilot"
          description="Invoice G183505786 is NOK 920.44 including VAT for August 17-31, 2026. NOK 681.31 before VAT is Azure database usage, with smaller Compute, Networking and Security charges. The cost came from an AHA/EchoNet development and bounded production-pilot environment. On September 12, 2026 we stopped PostgreSQL Flexible Server aha-prod-pg-yqhhtc76pwgxo, scaled Container App aha-canonical-api-production to zero, downgraded ACR ahaprodacryqhhtc76pwgxo from Standard to Basic, and installed a recurring cost hold. The invoice is unpaid because payment attempts were declined. Please review invoice G183505786 and the underlying usage, confirm remaining cost exposure, and consider a one-time goodwill credit, waiver, or refund for this first unexpected pilot invoice. Please also advise whether remaining stopped resources should be deleted to prevent material future charges."

          if az support no-subscription tickets show --ticket-name "$ticket_name" --only-show-errors -o json > "$RUNNER_TEMP/existing.json" 2>/dev/null; then
            ticket_id="$(jq -r '.properties.supportTicketId // empty' "$RUNNER_TEMP/existing.json")"
            status="$(jq -r '.properties.status // empty' "$RUNNER_TEMP/existing.json")"
            if [[ -n "$ticket_id" ]]; then
              echo "Azure billing support ticket already exists: $ticket_id ($status)"
              {
                echo "### Azure billing support ticket"
                echo ""
                echo "- Invoice: **G183505786**"
                echo "- Ticket: **$ticket_id**"
                echo "- Status: **$status**"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          response="$RUNNER_TEMP/support-ticket.json"
          az support no-subscription tickets create \
            --ticket-name "$ticket_name" \
            --title "$title" \
            --contact-country "NOR" \
            --contact-email "paradispartiet@gmail.com" \
            --contact-first-name "Mats" \
            --contact-last-name "Gran" \
            --contact-language "en-us" \
            --contact-method "email" \
            --contact-timezone "W. Europe Standard Time" \
            --description "$description" \
            --advanced-diagnostic-consent "No" \
            --problem-classification "$problem_classification" \
            --severity "minimal" \
            --acquire-policy-token true \
            --only-show-errors -o json > "$response"

          ticket_id="$(jq -r '.properties.supportTicketId // empty' "$response")"
          status="$(jq -r '.properties.status // empty' "$response")"

          if [[ -z "$ticket_id" ]]; then
            echo "Azure Support CLI completed without a supportTicketId." >&2
            jq '{name, id, properties: {title: .properties.title, status: .properties.status, supportPlanType: .properties.supportPlanType}}' "$response" >&2 || true
            exit 1
          fi

          echo "Azure billing support ticket: $ticket_id ($status)"
          {
            echo "### Azure billing support ticket"
            echo ""
            echo "- Invoice: **G183505786**"
            echo "- Amount: **NOK 920.44**"
            echo "- Ticket: **$ticket_id**"
            echo "- Status: **$status**"
          } >> "$GITHUB_STEP_SUMMARY"
