name: Bootstrap History Fagverk runtime activation

on:
  push:
    branches:
      - activate/history-fagverk-v1

permissions:
  contents: write

jobs:
  activate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: activate/history-fagverk-v1
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch History runtime activation sources
        run: |
          cat > /tmp/patch_history_runtime.py <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          ROOT = Path.cwd()

          def replace_once(relative: str, old: str, new: str) -> None:
              path = ROOT / relative
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{relative}: expected one replacement, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          registry_path = ROOT / "data/integrations/runtime/history-go-fagverk-runtime-registry.v1.json"
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          if list(registry["active_subjects"]) != ["politikk"]:
              raise SystemExit("Runtime registry no longer has the expected Politics-only baseline")
          registry["active_subjects"] = {
              "historie": {
                  "subject_id": "historie",
                  "approval_path": "data/integrations/approvals/history-go-fagverk-historie.approved.v1.json",
                  "candidate_corpus_path": "data/integrations/candidates/history-go-fagverk-historie.candidate.v1.json",
                  "review_policy_path": "data/integrations/review/history-go-fagverk-historie.term-policy.v1.json",
                  "runtime_corpus_path": "data/integrations/runtime/history-go-fagverk-historie.corpus.v1.json",
                  "runtime_policy_path": "data/integrations/runtime/history-go-fagverk-historie.policy.v1.json",
                  "scoring_mode": "subject_policy_v1",
                  "minimum_score": 7,
                  "minimum_terms": 2,
                  "ambiguity_margin": 3
              },
              "politikk": registry["active_subjects"]["politikk"]
          }
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          replace_once(
              "scripts/build-history-go-fagverk-runtime-activation.mjs",
              "    global_non_scoring_terms: reviewPolicy.global_non_scoring_terms,\n    chapter_rules: reviewPolicy.chapter_rules,",
              "    global_non_scoring_terms: reviewPolicy.global_non_scoring_terms,\n    ...(reviewPolicy.temporal_gate ? { temporal_gate: reviewPolicy.temporal_gate } : {}),\n    chapter_rules: reviewPolicy.chapter_rules,"
          )

          replace_once(
              "backend/aha_engine/app/engine/fagverk_grounding.py",
              "    required_anchors = [_normalize(term) for term in rule.get(\"required_anchor_terms\", []) if _normalize(term)]\n    matched_anchors = [term for term in required_anchors if _policy_term_present(message, tokens, term)]\n    eligible = not required_anchors or bool(matched_anchors)\n    contributions.sort(key=lambda item: (-item[1], item[0]))\n    return round(score, 3), tuple(term for term, _ in contributions), eligible\n",
              "    temporal_gate = policy.get(\"temporal_gate\") or {}\n    temporal_required = temporal_gate.get(\"required\") is True\n    temporal_terms = [_normalize(term) for term in temporal_gate.get(\"terms\", []) if _normalize(term)]\n    temporal_term_matched = any(_policy_term_present(message, tokens, term) for term in temporal_terms)\n    year_pattern = str(temporal_gate.get(\"year_pattern\") or r\"\\b(?:1[0-9]{3}|20[0-9]{2})\\b\")\n    try:\n        temporal_year_matched = bool(re.search(year_pattern, message))\n    except re.error as exc:\n        raise ValueError(f\"Invalid runtime Fagverk temporal year pattern: {year_pattern}\") from exc\n    temporal_eligible = not temporal_required or temporal_term_matched or temporal_year_matched\n\n    required_anchors = [_normalize(term) for term in rule.get(\"required_anchor_terms\", []) if _normalize(term)]\n    matched_anchors = [term for term in required_anchors if _policy_term_present(message, tokens, term)]\n    anchor_eligible = not required_anchors or bool(matched_anchors)\n    eligible = temporal_eligible and anchor_eligible\n    contributions.sort(key=lambda item: (-item[1], item[0]))\n    return round(score, 3), tuple(term for term, _ in contributions), eligible\n"
          )

          node_test = r'''const assert = require('assert');
          const crypto = require('crypto');
          const fs = require('fs');
          const os = require('os');
          const path = require('path');
          const { spawnSync } = require('child_process');

          const registryPath = 'data/integrations/runtime/history-go-fagverk-runtime-registry.v1.json';
          const legacyCorpusPath = 'data/integrations/history-go-fagverk-corpus.v1.json';
          const approvedPath = 'data/integrations/history-go-fagverk-release.approved.json';
          const activePath = 'data/integrations/history-go-fagverk-release.runtime-active.json';

          function stableValue(value) {
            if (Array.isArray(value)) return value.map(stableValue);
            if (value && typeof value === 'object') {
              return Object.fromEntries(Object.keys(value).sort().map((key) => [key, stableValue(value[key])]));
            }
            return value;
          }

          function digestArtifact(value) {
            const { artifact_sha256: ignored, ...payload } = value;
            return crypto.createHash('sha256').update(JSON.stringify(stableValue(payload))).digest('hex');
          }

          const registry = JSON.parse(fs.readFileSync(registryPath, 'utf8'));
          const legacy = JSON.parse(fs.readFileSync(legacyCorpusPath, 'utf8'));
          const approved = JSON.parse(fs.readFileSync(approvedPath, 'utf8'));
          const active = JSON.parse(fs.readFileSync(activePath, 'utf8'));
          const subjectIds = Object.keys(registry.active_subjects);

          assert.equal(registry.schema, 'aha_history_go_fagverk_runtime_registry_v1');
          assert.deepEqual(subjectIds, ['historie', 'politikk']);
          assert.equal(legacy.entries.length, 3, 'legacy seed must remain byte-stable and separate');
          assert.deepEqual(Object.keys(approved.approved_subjects), subjectIds);
          assert.deepEqual(Object.keys(active.active_subjects), subjectIds);

          const expected = {
            historie: {
              sourceRef: 'c16a187453d16a40f9cab4ca694c32e96014f31b',
              corpusSha: 'e5123cb96d9b89c83aad56efc327c1089bfe5f887f29322d39a4a936c9f19444',
              chapterCount: 23,
              thresholds: { minimum_score: 7, minimum_terms: 2, ambiguity_margin: 3 },
            },
            politikk: {
              sourceRef: 'c16a187453d16a40f9cab4ca694c32e96014f31b',
              corpusSha: '981ab3ad25f972bd13c70a0247f26b8796e43b8cd3cde7282b7d073bfcc79dec',
              chapterCount: 13,
              thresholds: { minimum_score: 6, minimum_terms: 2, ambiguity_margin: 3 },
            },
          };

          const checkedPaths = [approvedPath, activePath];
          for (const subjectId of subjectIds) {
            const config = registry.active_subjects[subjectId];
            const corpus = JSON.parse(fs.readFileSync(config.runtime_corpus_path, 'utf8'));
            const policy = JSON.parse(fs.readFileSync(config.runtime_policy_path, 'utf8'));
            const item = expected[subjectId];

            assert.equal(corpus.schema, 'aha_history_go_fagverk_runtime_subject_corpus_v1');
            assert.equal(corpus.status, 'runtime_subject_corpus_active');
            assert.equal(corpus.subject_id, subjectId);
            assert.equal(corpus.source_ref, item.sourceRef);
            assert.equal(corpus.corpus_sha256, item.corpusSha);
            assert.equal(corpus.chapter_count, item.chapterCount);
            assert.equal(corpus.entries.length, item.chapterCount);
            assert.equal(new Set(corpus.entries.map((entry) => entry.chapter_id)).size, item.chapterCount);
            assert.equal(corpus.artifact_sha256, digestArtifact(corpus));

            assert.equal(policy.schema, 'aha_history_go_fagverk_runtime_subject_policy_v1');
            assert.equal(policy.status, 'runtime_subject_policy_active');
            assert.equal(policy.subject_id, subjectId);
            assert.equal(policy.source_ref, corpus.source_ref);
            assert.equal(policy.corpus_sha256, corpus.corpus_sha256);
            assert.deepEqual(policy.thresholds, item.thresholds);
            assert.equal(policy.artifact_sha256, digestArtifact(policy));

            if (subjectId === 'historie') {
              assert.equal(policy.temporal_gate.required, true);
              assert.equal(Array.isArray(policy.temporal_gate.terms), true);
              assert.equal(policy.temporal_gate.terms.includes('over tid'), true);
              assert.equal(Object.keys(policy.chapter_rules).length, 23);
            } else {
              assert.equal(policy.temporal_gate, undefined);
              assert.equal(policy.chapter_rules.parlamentarisme.required_anchor_terms.includes('mistillit'), true);
            }

            assert.equal(approved.approved_subjects[subjectId].source_commit, corpus.source_ref);
            assert.equal(approved.approved_subjects[subjectId].corpus_path, config.runtime_corpus_path);
            assert.equal(approved.approved_subjects[subjectId].policy_path, config.runtime_policy_path);
            assert.equal(active.active_subjects[subjectId].source_commit, corpus.source_ref);
            assert.equal(active.active_subjects[subjectId].corpus_path, config.runtime_corpus_path);
            assert.equal(active.active_subjects[subjectId].policy_path, config.runtime_policy_path);
            checkedPaths.push(config.runtime_corpus_path, config.runtime_policy_path);
          }

          assert.equal(approved.schema, 'aha_history_go_fagverk_approved_runtime_v2');
          assert.equal(approved.status, 'partial_subject_runtime_approved');
          assert.equal(approved.approved_source_commit, legacy.source_ref);
          assert.equal(approved.full_release_approved, false);
          assert.equal(approved.artifact_sha256, digestArtifact(approved));

          assert.equal(active.schema, 'aha_history_go_fagverk_runtime_active_v2');
          assert.equal(active.status, 'partial_subject_runtime_active');
          assert.equal(active.active_source_commit, legacy.source_ref);
          assert.equal(active.effective_entry_count, 37);
          assert.equal(active.full_release_active, false);
          assert.equal(active.artifact_sha256, digestArtifact(active));

          const runtimeCode = fs.readFileSync('backend/aha_engine/app/engine/fagverk_grounding.py', 'utf8');
          assert.equal(runtimeCode.includes('data/integrations/review'), false);
          assert.equal(runtimeCode.includes('data/integrations/approvals'), false);
          assert.equal(runtimeCode.includes('history-go-fagverk-release.runtime-active.json'), true);
          assert.equal(runtimeCode.includes('subject_policies'), true);
          assert.equal(runtimeCode.includes('temporal_gate'), true);

          const outputRoot = fs.mkdtempSync(path.join(os.tmpdir(), 'aha-fagverk-runtime-'));
          const result = spawnSync(process.execPath, [
            'scripts/build-history-go-fagverk-runtime-activation.mjs',
            '--output-root', outputRoot,
          ], { encoding: 'utf8' });
          assert.equal(result.status, 0, result.stderr || result.stdout);
          for (const checkedPath of checkedPaths) {
            const generatedPath = path.join(outputRoot, path.basename(checkedPath));
            assert.equal(fs.existsSync(generatedPath), true, `missing generated artifact: ${generatedPath}`);
            assert.equal(fs.readFileSync(generatedPath).equals(fs.readFileSync(checkedPath)), true, `stale runtime artifact: ${checkedPath}`);
          }
          fs.rmSync(outputRoot, { recursive: true, force: true });

          console.log('aha-fagverk-runtime-activation tests passed');
          '''
          (ROOT / "tests/aha-fagverk-runtime-activation.test.cjs").write_text(node_test.replace("          ", ""), encoding="utf-8")

          replace_once(
              "backend/aha_engine/tests/test_fagverk_grounding.py",
              "    assert len(corpus[\"entries\"]) == 15\n",
              "    assert len(corpus[\"entries\"]) == 37\n"
          )
          replace_once(
              "backend/aha_engine/tests/test_fagverk_grounding.py",
              "    assert len({entry[\"chapter_id\"] for entry in politics_entries}) == 13\n    assert \"politikk\" in corpus[\"subject_policies\"]\n",
              "    assert len({entry[\"chapter_id\"] for entry in politics_entries}) == 13\n    history_entries = [entry for entry in corpus[\"entries\"] if entry[\"subject_id\"] == \"historie\"]\n    assert len(history_entries) == 23\n    assert len({entry[\"chapter_id\"] for entry in history_entries}) == 23\n    assert set(corpus[\"subject_policies\"]) == {\"historie\", \"politikk\"}\n"
          )
          replace_once(
              "backend/aha_engine/tests/test_fagverk_grounding.py",
              "    assert manifest[\"effective_entry_count\"] == 15\n    politics = manifest[\"active_subjects\"][\"politikk\"]\n",
              "    assert manifest[\"effective_entry_count\"] == 37\n    assert set(manifest[\"active_subjects\"]) == {\"historie\", \"politikk\"}\n    history = manifest[\"active_subjects\"][\"historie\"]\n    assert history[\"chapter_count\"] == 23\n    assert history[\"source_commit\"] == \"c16a187453d16a40f9cab4ca694c32e96014f31b\"\n    assert history[\"corpus_path\"].startswith(\"data/integrations/runtime/\")\n    assert history[\"policy_path\"].startswith(\"data/integrations/runtime/\")\n    politics = manifest[\"active_subjects\"][\"politikk\"]\n"
          )

          history_runtime_test = r'''from __future__ import annotations

          import json
          from pathlib import Path

          from app.engine.fagverk_grounding import ground_message, load_fagverk_corpus

          ROOT = Path(__file__).resolve().parents[3]
          MATRIX_PATH = ROOT / "data" / "evaluation" / "aha-history-fagverk-evaluation-matrix.v1.json"
          CORRECTIONS_PATH = ROOT / "data" / "evaluation" / "aha-history-fixture-corrections.v1.json"


          def _history_only_corpus() -> dict:
              corpus = load_fagverk_corpus()
              return {
                  "schema": corpus["schema"],
                  "version": corpus["version"],
                  "source_repo": corpus["source_repo"],
                  "source_ref": corpus["source_ref"],
                  "entries": [entry for entry in corpus["entries"] if entry["subject_id"] == "historie"],
                  "subject_policies": {"historie": corpus["subject_policies"]["historie"]},
              }


          def test_history_runtime_policy_preserves_review_temporal_gate() -> None:
              corpus = _history_only_corpus()
              policy = corpus["subject_policies"]["historie"]
              assert policy["thresholds"] == {"minimum_score": 7, "minimum_terms": 2, "ambiguity_margin": 3}
              assert policy["temporal_gate"]["required"] is True
              without_time = ground_message(
                  "Byfornyelse, gentrifisering og urban morfologi endrer eierskap og bruk av kvartalet.",
                  corpus,
              )
              assert without_time["status"] == "unsupported"
              with_time = ground_message(
                  "Over tid endret byfornyelse og gentrifisering både eierskap og bruk; urban morfologi viser stedsendringen.",
                  corpus,
              )
              assert with_time["status"] == "grounded"
              assert with_time["match"]["chapter_id"] == "byhistorie_stedsendring"


          def test_all_reviewed_history_matrix_cases_pass_in_python_runtime() -> None:
              matrix = json.loads(MATRIX_PATH.read_text(encoding="utf-8"))
              corpus = _history_only_corpus()
              positive = matrix["positive_cases"]
              confusion = matrix["confusion_cases"]
              ambiguity = matrix["ambiguity_cases"]
              assert len(positive) == 23
              assert len(confusion) == 23
              assert len(ambiguity) == 12
              for case in [*positive, *confusion]:
                  result = ground_message(case["text"], corpus)
                  assert result["status"] == case["expected_status"], (case["id"], result)
                  assert result["match"]["subject_id"] == "historie", (case["id"], result)
                  assert result["match"]["chapter_id"] == case["expected_chapter_id"], (case["id"], result)
                  assert result["match"]["scoring_mode"] == "subject_policy_v1"
                  assert result["match"]["chapter_id"] not in case.get("forbidden_chapter_ids", [])
              for case in ambiguity:
                  result = ground_message(case["text"], corpus)
                  assert result["status"] in case["allowed_statuses"], (case["id"], result)


          def test_all_reviewed_history_fixture_corrections_pass_in_python_runtime() -> None:
              corrections = json.loads(CORRECTIONS_PATH.read_text(encoding="utf-8"))
              corpus = _history_only_corpus()
              assert len(corrections["cases"]) == 16
              for correction in corrections["cases"]:
                  fixture = json.loads((ROOT / correction["fixture_path"]).read_text(encoding="utf-8"))
                  result = ground_message(fixture["inputText"], corpus)
                  assert result["status"] == correction["expected_history_status"], (correction["id"], result)
                  if result["status"] == "grounded":
                      assert result["match"]["subject_id"] == "historie", (correction["id"], result)
                      assert result["match"]["chapter_id"] == correction["expected_chapter_id"], (correction["id"], result)


          def test_grounded_history_fixtures_win_in_composed_runtime() -> None:
              corrections = json.loads(CORRECTIONS_PATH.read_text(encoding="utf-8"))
              for correction in corrections["cases"]:
                  if correction["expected_history_status"] != "grounded":
                      continue
                  fixture = json.loads((ROOT / correction["fixture_path"]).read_text(encoding="utf-8"))
                  result = ground_message(fixture["inputText"])
                  assert result["status"] == "grounded", (correction["id"], result)
                  assert result["match"]["subject_id"] == "historie", (correction["id"], result)
                  assert result["match"]["chapter_id"] == correction["expected_chapter_id"], (correction["id"], result)
          '''
          (ROOT / "backend/aha_engine/tests/test_history_fagverk_runtime.py").write_text(history_runtime_test.replace("          ", ""), encoding="utf-8")

          replace_once(
              ".github/workflows/aha-fagverk-runtime-activation.yml",
              "      - \"data/integrations/candidates/history-go-fagverk-politikk.candidate.v1.json\"\n      - \"data/integrations/review/history-go-fagverk-politikk.term-policy.v1.json\"",
              "      - \"data/integrations/candidates/history-go-fagverk-*.candidate.v1.json\"\n      - \"data/integrations/review/history-go-fagverk-*.term-policy.v1.json\"\n      - \"data/evaluation/aha-*-fagverk-evaluation-matrix.v1.json\"\n      - \"data/evaluation/aha-*-fixture-corrections.v1.json\""
          )

          docs = """# AHA History Fagverk runtime activation v1\n\nHistorie er aktivert som et fagvis runtime-subject fra den reviewgodkjente History Go-releasen `c16a187453d16a40f9cab4ca694c32e96014f31b`.\n\n## Aktiv pakke\n\n- 23 Historie-kapitler\n- 69 registrerte modulfiler i kildepakken\n- egen materialisert runtime-corpus og runtime-policy\n- terskler: minimumscore 7, minst 2 bevis og tvetydighetsmargin 3\n- obligatorisk tidsport: årstall eller eksplisitt historisk tidsuttrykk\n\n## Avgrensning\n\nAktiveringen overstyrer bare det ene gamle Historie-seedkapitlet. Politikk forblir aktivt med sin eksisterende 13-kapitlers policy, Natur-seedet beholdes, og ingen andre kandidater blir runtimeinput. Full release er fortsatt deaktivert.\n\nRuntime leser bare materialiserte filer under `data/integrations/runtime/` og den eksplisitte runtimepekeren. Review- og approvalfiler leses ikke av motoren.\n"""
          (ROOT / "docs/AHA_HISTORY_FAGVERK_RUNTIME_ACTIVATION_V1.md").write_text(docs, encoding="utf-8")
          PY
          python /tmp/patch_history_runtime.py

      - name: Materialize History runtime package
        run: node scripts/build-history-go-fagverk-runtime-activation.mjs

      - name: Verify deterministic Node activation contract
        run: |
          node tests/aha-fagverk-runtime-activation.test.cjs
          node tests/aha-history-fagverk-review.test.cjs

      - name: Install Python engine dependencies
        working-directory: backend/aha_engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Python runtime parity
        working-directory: backend/aha_engine
        run: python -m pytest tests/test_fagverk_grounding.py tests/test_history_fagverk_runtime.py

      - name: Verify exact activation scope
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/aha-fagverk-runtime-activation.yml',
              'backend/aha_engine/app/engine/fagverk_grounding.py',
              'backend/aha_engine/tests/test_fagverk_grounding.py',
              'backend/aha_engine/tests/test_history_fagverk_runtime.py',
              'data/integrations/history-go-fagverk-release.approved.json',
              'data/integrations/history-go-fagverk-release.runtime-active.json',
              'data/integrations/runtime/history-go-fagverk-historie.corpus.v1.json',
              'data/integrations/runtime/history-go-fagverk-historie.policy.v1.json',
              'data/integrations/runtime/history-go-fagverk-runtime-registry.v1.json',
              'docs/AHA_HISTORY_FAGVERK_RUNTIME_ACTIVATION_V1.md',
              'scripts/build-history-go-fagverk-runtime-activation.mjs',
              'tests/aha-fagverk-runtime-activation.test.cjs',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'Unexpected activation scope. Missing={sorted(expected-actual)} Extra={sorted(actual-expected)}')
          PY

      - name: Commit materialized activation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/aha-fagverk-runtime-activation.yml \
            backend/aha_engine/app/engine/fagverk_grounding.py \
            backend/aha_engine/tests/test_fagverk_grounding.py \
            backend/aha_engine/tests/test_history_fagverk_runtime.py \
            data/integrations/history-go-fagverk-release.approved.json \
            data/integrations/history-go-fagverk-release.runtime-active.json \
            data/integrations/runtime/history-go-fagverk-historie.corpus.v1.json \
            data/integrations/runtime/history-go-fagverk-historie.policy.v1.json \
            data/integrations/runtime/history-go-fagverk-runtime-registry.v1.json \
            docs/AHA_HISTORY_FAGVERK_RUNTIME_ACTIVATION_V1.md \
            scripts/build-history-go-fagverk-runtime-activation.mjs \
            tests/aha-fagverk-runtime-activation.test.cjs
          git commit -m "Activate History Fagverk runtime"
          git push origin HEAD:activate/history-fagverk-v1
