name: AHA PostgreSQL staging rehearsal

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/aha_postgresql_staging_rehearsal_v1.sql"
      - "scripts/aha-postgresql-staging-rehearsal.sh"
      - "scripts/aha-social-media-atomic-purge-rehearsal.sh"
      - "tests/aha-postgresql-staging-rehearsal.test.cjs"
      - "docs/AHA_POSTGRESQL_STAGING_REHEARSAL_V1.md"
      - ".github/workflows/aha-postgresql-staging-rehearsal.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/aha_postgresql_staging_rehearsal_v1.sql"
      - "scripts/aha-postgresql-staging-rehearsal.sh"
      - "scripts/aha-social-media-atomic-purge-rehearsal.sh"
      - "tests/aha-postgresql-staging-rehearsal.test.cjs"
      - "docs/AHA_POSTGRESQL_STAGING_REHEARSAL_V1.md"
      - ".github/workflows/aha-postgresql-staging-rehearsal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-postgresql-rehearsal:
    name: PostgreSQL 16 canonical import rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aha_rehearsal
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aha_rehearsal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: aha_rehearsal
      PGUSER: postgres
      PGPASSWORD: postgres
      AHA_RUNTIME_PASSWORD: rehearsal-runtime-password-not-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run clean canonical PostgreSQL rehearsal
        run: bash scripts/aha-postgresql-staging-rehearsal.sh

      # This remains entirely local to the ephemeral GitHub runner.
      - name: Set up Node 22 for real-HTTP social rehearsal
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/api/package-lock.json

      - name: Verify atomic staging media purge on PostgreSQL 16
        run: bash scripts/aha-social-media-atomic-purge-rehearsal.sh

      - name: Build real NestJS server for ephemeral PostgreSQL
        working-directory: backend/api
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Generate three short-lived, signed rehearsal JWTs
        env:
          AHA_SOCIAL_EPHEMERAL_ACK: RUN_AHA_SOCIAL_EPHEMERAL_CI
        run: |
          node scripts/aha-social-ephemeral-auth.cjs \
            "$RUNNER_TEMP/aha-social-jwks" "$GITHUB_ENV"

      - name: Start only loopback JWKS and NestJS
        env:
          NODE_ENV: test
          PORT: "3100"
          AHA_SOCIAL_STAGING_ENABLED: "true"
          AHA_DATABASE_ENABLED: "true"
          AHA_DATABASE_SSL_MODE: disable
          AHA_DATABASE_POOL_MAX: "3"
          AHA_DATABASE_URL: postgresql://aha_runtime_rehearsal:rehearsal-runtime-password-not-production@127.0.0.1:5432/aha_rehearsal
          AHA_AUTH_PROVIDER: supabase
          AHA_ALLOWED_ORIGINS: http://127.0.0.1:4177
          AHA_AUDIT_HASH_SALT: ephemeral-social-ci-salt-not-for-deployment
          AHA_CANONICAL_SYNC_ENABLED: "false"
          AHA_LOCAL_IMPORT_ENABLED: "false"
        shell: bash
        run: |
          set -euo pipefail
          node scripts/aha-canonical-sync-hosted-staging-auth-fixture.cjs \
            serve "$AHA_STAGING_JWKS_FILE" > "$RUNNER_TEMP/aha-social-jwks.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/aha-social-jwks.pid"
          node backend/api/dist/main.js > "$RUNNER_TEMP/aha-social-api.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/aha-social-api.pid"

      - name: Verify real HTTP plus PostgreSQL with three independent profiles
        env:
          NODE_ENV: test
          PGDATABASE: aha_rehearsal
          AHA_SOCIAL_STAGING_ENABLED: "true"
          AHA_SOCIAL_EPHEMERAL_ACK: RUN_AHA_SOCIAL_EPHEMERAL_CI
          AHA_SOCIAL_E2E_API_ORIGIN: http://127.0.0.1:3100
        run: node scripts/aha-social-ephemeral-http-e2e.cjs

      - name: Stop ephemeral HTTP services
        if: always()
        shell: bash
        run: |
          for file in "$RUNNER_TEMP/aha-social-api.pid" "$RUNNER_TEMP/aha-social-jwks.pid"; do
            if [[ -f "$file" ]]; then
              pid="$(cat "$file")"
              if [[ "$pid" =~ ^[0-9]+$ ]]; then kill "$pid" 2>/dev/null || true; fi
            fi
          done

