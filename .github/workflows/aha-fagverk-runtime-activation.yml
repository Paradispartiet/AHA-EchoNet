name: AHA Fagverk runtime activation

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/build-history-go-fagverk-runtime-activation.mjs"
      - "scripts/materialize-history-go-fagverk-subjects.mjs"
      - "scripts/audit-local-subject-knowledge.mjs"
      - "js/ahaSubjectEngine.js"
      - "tests/aha-fagverk-runtime-activation.test.cjs"
      - "tests/aha-fagverk-subject-approvals.test.cjs"
      - "tests/aha-history-go-fagverk-subject-bridge.integration.test.cjs"
      - "tests/aha-local-subject-knowledge-audit.test.cjs"
      - "reports/subject-bridge/local-subject-knowledge-audit.v1.json"
      - ".github/workflows/aha-fagverk-runtime-activation.yml"
      - "backend/aha_engine/app/engine/fagverk_grounding.py"
      - "backend/aha_engine/app/schemas.py"
      - "backend/aha_engine/tests/test_fagverk_grounding.py"
      - "backend/aha_engine/tests/test_history_fagverk_runtime.py"
      - "backend/aha_engine/tests/test_nature_fagverk_runtime.py"
      - "data/subjects/**"
      - "data/integrations/runtime/**"
      - "data/integrations/history-go-fagverk-corpus.v1.json"
      - "data/integrations/history-go-fagverk-release.approved.json"
      - "data/integrations/history-go-fagverk-release.runtime-active.json"
      - "data/integrations/approvals/**"
      - "data/integrations/candidates/history-go-fagverk-*.candidate.v1.json"
      - "data/integrations/review/history-go-fagverk-*.term-policy.v1.json"
      - "data/integrations/review/history-go-fagverk-*.review-config.v1.json"
      - "data/integrations/review/history-go-fagverk-*.review-attestation.v1.json"
      - "data/evaluation/aha-fagverk-grounding-cases.v1.json"
      - "data/evaluation/aha-*-fagverk-evaluation-matrix.v1.json"
      - "data/evaluation/aha-*-fixture-corrections.v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-runtime-activation:
    name: Rebuild active Fagverk runtime package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild runtime activation artifacts
        run: node scripts/build-history-go-fagverk-runtime-activation.mjs --output-root artifacts/runtime-activation

      - name: Verify activation contract and checked-in parity
        run: |
          node tests/aha-fagverk-runtime-activation.test.cjs
          node tests/aha-fagverk-subject-approvals.test.cjs

      - name: Verify Subject Engine bridge to active Fagverk
        run: |
          node scripts/materialize-history-go-fagverk-subjects.mjs --check
          node tests/aha-history-go-fagverk-subject-bridge.integration.test.cjs

      - name: Verify governed local Subject Engine knowledge
        run: |
          node scripts/audit-local-subject-knowledge.mjs --check
          node tests/aha-local-subject-knowledge-audit.test.cjs

      - name: Install Python dependencies
        working-directory: backend/aha_engine
        run: python -m pip install -r requirements.txt

      - name: Verify composed runtime behavior
        working-directory: backend/aha_engine
        run: python -m pytest tests/test_fagverk_grounding.py tests/test_history_fagverk_runtime.py tests/test_nature_fagverk_runtime.py

      - name: Upload runtime activation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aha-fagverk-runtime-activation
          path: artifacts/runtime-activation/*.json
          if-no-files-found: error
          retention-days: 14
