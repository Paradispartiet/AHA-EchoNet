name: Materialize academic routing quality fix

on:
  pull_request:
    branches:
      - fix/academic-domain-fagverk-routing-20260812

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'trigger/materialize-academic-routing-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/academic-domain-fagverk-routing-20260812
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply patch
        run: python3 .github/scripts/materialize_academic_routing_fix.py
      - name: Verify materialized patch
        run: |
          node --check js/ahaChat.js
          node --check js/ahaChatSignals.js
          node --check js/ahaCalibrationIndex.js
          node --check js/ahaSubjectEngine.js
          node --check tests/aha-evaluation-public-admin-routing.test.cjs
          npm test
      - name: Commit verified code and remove helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/aha-materialize-academic-routing-fix.yml .github/scripts/materialize_academic_routing_fix.py
          git add js/ahaChat.js js/ahaChatSignals.js js/ahaCalibrationIndex.js js/ahaSubjectEngine.js tests/aha-evaluation-public-admin-routing.test.cjs
          git commit -m "fix: tighten academic domain and Fagverk routing"
          git push origin HEAD:fix/academic-domain-fagverk-routing-20260812
