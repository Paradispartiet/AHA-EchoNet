name: AHA Politics cross-domain fixture candidate

on:
  pull_request:
    branches: [main]
    paths:
      - "data/evaluation/aha-politics-fixture-corrections.v1.json"
      - "scripts/build-politics-fagverk-term-policy.mjs"
      - "scripts/evaluate-politics-fagverk-policy.mjs"
      - "scripts/compare-politics-fixture-corrections.mjs"
      - "scripts/lib/politics-fagverk-scoring.mjs"
      - ".github/workflows/aha-politics-cross-domain-fixture-candidate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-full-fixture-report:
    name: Materialize 34-of-34 and 16-of-16 Politics candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build policy and both review reports
        run: |
          node scripts/build-politics-fagverk-term-policy.mjs
          node scripts/evaluate-politics-fagverk-policy.mjs
          node scripts/compare-politics-fixture-corrections.mjs
      - name: Verify full candidate
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const policy = JSON.parse(fs.readFileSync('data/integrations/review/history-go-fagverk-politikk.term-policy.v1.json', 'utf8'));
          const matrix = JSON.parse(fs.readFileSync('data/evaluation/aha-politics-fagverk-evaluation-report.v1.json', 'utf8'));
          const corrections = JSON.parse(fs.readFileSync('data/evaluation/aha-politics-fixture-corrections.v1.json', 'utf8'));
          const report = JSON.parse(fs.readFileSync('data/evaluation/aha-politics-fixture-correction-report.v1.json', 'utf8'));
          if (policy.version !== '1.2.0' || policy.activation_allowed !== false) throw new Error('Policy 1.2 boundary failed.');
          if (!policy.chapter_rules?.['konflikt-makt-sivilsamfunn']?.required_anchor_terms?.includes('protest')) throw new Error('Political conflict anchor rule missing.');
          if (matrix.summary?.passed !== 34 || matrix.summary?.failed !== 0 || matrix.runtime_activation_allowed !== false) throw new Error('34-case matrix failed.');
          if (corrections.cases.length !== 16 || new Set(corrections.cases.map((item) => item.fixture_path)).size !== 16) throw new Error('Expected 16 unique fixture corrections.');
          if (report.summary?.total !== 16 || report.summary?.passed !== 16 || report.summary?.failed !== 0) throw new Error(`Expected 16/16 corrections, got ${report.summary?.passed}/${report.summary?.total}.`);
          if (report.summary?.validation_errors !== 0 || report.validation_errors?.length) throw new Error('Correction set has validation errors.');
          if (report.runtime_activation_allowed !== false) throw new Error('Runtime boundary must remain blocked.');
          console.log('Candidate verified: 34/34 synthetic and 16/16 full fixture corrections.');
          NODE
      - name: Materialize candidate files on PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/integrations/review/history-go-fagverk-politikk.term-policy.v1.json \
            data/evaluation/aha-politics-fagverk-evaluation-report.v1.json \
            data/evaluation/aha-politics-fixture-correction-report.v1.json
          if git diff --cached --quiet; then
            echo "Full Politics candidate already matches."
            exit 0
          fi
          git commit -m "Materialize full Politics cross-domain correction candidate"
          git push origin "HEAD:${HEAD_BRANCH}"
