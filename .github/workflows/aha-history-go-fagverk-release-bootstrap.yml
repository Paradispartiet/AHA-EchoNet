name: AHA History Go Fagverk release bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/sync-history-go-fagverk-release.mjs'
      - 'tests/aha-history-go-fagverk-release-sync.test.mjs'
      - '.github/workflows/aha-history-go-fagverk-release-bootstrap.yml'
      - '.github/workflows/aha-history-go-fagverk-release-sync.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    name: Materialize initial observed release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: Paradispartiet/History-Go
          ref: main
          path: history-go
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify scripts and producer release
        run: |
          node --check scripts/sync-history-go-fagverk-release.mjs
          node --test tests/aha-history-go-fagverk-release-sync.test.mjs
          cd history-go
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Observe release
        run: node scripts/sync-history-go-fagverk-release.mjs --history-go-root history-go
      - name: Build all changed subject candidates
        run: |
          CHANGED=$(node -p "require('./artifacts/history-go-fagverk-release-status.json').changed_subjects.join(',')")
          mkdir -p data/integrations/candidates
          IFS=',' read -ra SUBJECTS <<< "$CHANGED"
          for subject in "${SUBJECTS[@]}"; do
            [ -n "$subject" ] || continue
            node scripts/build-history-go-fagverk-corpus.mjs \
              --history-go-root history-go \
              --subject "$subject" \
              --output "data/integrations/candidates/history-go-fagverk-${subject}.candidate.v1.json" \
              --audit-output "data/integrations/candidates/history-go-fagverk-${subject}.candidate-audit.v1.json"
          done
      - name: Verify initial candidate contract
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const observed = JSON.parse(fs.readFileSync('data/integrations/history-go-fagverk-release.observed.json', 'utf8'));
          const report = JSON.parse(fs.readFileSync('data/integrations/review/history-go-fagverk-release-update.v1.json', 'utf8'));
          if (report.summary.changed_subject_count !== observed.summary.subject_count) throw new Error('Initial observation must include every producer subject.');
          for (const subjectId of report.changed_subjects) {
            const corpus = JSON.parse(fs.readFileSync(`data/integrations/candidates/history-go-fagverk-${subjectId}.candidate.v1.json`, 'utf8'));
            const audit = JSON.parse(fs.readFileSync(`data/integrations/candidates/history-go-fagverk-${subjectId}.candidate-audit.v1.json`, 'utf8'));
            if (corpus.source_ref !== observed.source_commit) throw new Error(`${subjectId}: source ref mismatch.`);
            if (corpus.entries.length !== observed.subjects[subjectId].chapter_count) throw new Error(`${subjectId}: chapter mismatch.`);
            if (!audit.gate?.passed) throw new Error(`${subjectId}: audit failed.`);
            const modules = audit.chapters.reduce((sum, chapter) => sum + chapter.module_file_count, 0);
            if (modules !== observed.subjects[subjectId].module_file_count) throw new Error(`${subjectId}: module mismatch.`);
          }
          if (observed.runtime_activation_allowed !== false || report.runtime_activation_allowed !== false) throw new Error('Runtime boundary failed.');
          console.log(`Initial Fagverk observation: ${observed.summary.subject_count} subjects, ${observed.summary.chapter_count} chapters, ${observed.summary.module_file_count} modules.`);
          NODE
      - name: Materialize initial observation on PR branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/integrations/history-go-fagverk-release.observed.json \
            data/integrations/review/history-go-fagverk-release-update.v1.json \
            data/integrations/candidates
          if git diff --cached --quiet; then
            echo 'Initial observation already matches.'
            exit 0
          fi
          git commit -m 'Materialize initial History Go Fagverk observation'
          git push origin "HEAD:${HEAD_BRANCH}"
