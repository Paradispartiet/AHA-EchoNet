name: Bootstrap History policy correction

on:
  push:
    branches:
      - review/history-fagverk-v1

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: review/history-fagverk-v1
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Apply reviewed policy and matrix corrections
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          policy_path = Path('scripts/build-history-fagverk-term-policy.mjs')
          text = policy_path.read_text(encoding='utf-8')

          replacements = [
              (
                  '"institusjon", "institusjoner", "kan"',
                  '"institusjon", "institusjoner", "institusjonene", "kan"'
              ),
              (
                  '"slik", "skill", "skille", "skiller", "sted", "stedet"',
                  '"slik", "skill", "skille", "skiller", "staten", "sted", "stedet"'
              ),
              (
                  'const CHAPTER_RULES = Object.freeze({',
                  '''const REVIEWED_COLLISION_OVERRIDES = new Map([\n  ["hushold", { category: "reviewed_chapter_scoped_evidence", action: "down_weight", multiplier: 0.3 }],\n  ["historiebruk", { category: "reviewed_chapter_scoped_evidence", action: "down_weight", multiplier: 0.3 }],\n  ["diaspora", { category: "reviewed_chapter_scoped_evidence", action: "down_weight", multiplier: 0.3 }]\n]);\nconst CHAPTER_RULES = Object.freeze({'''
              ),
              (
                  'function classifyCollision(collision) {\n  const term = normalize(collision.term);\n  if (GENERIC_LANGUAGE_TERMS.has(term))',
                  'function classifyCollision(collision) {\n  const term = normalize(collision.term);\n  if (REVIEWED_COLLISION_OVERRIDES.has(term)) return REVIEWED_COLLISION_OVERRIDES.get(term);\n  if (GENERIC_LANGUAGE_TERMS.has(term))'
              ),
              (
                  '"industrialisering",\n      "arbeiderbevegelse",\n      "fabrikk",\n      "arbeidsdeling",\n      "klasse",\n      "fagforening"',
                  '"industrialisering",\n      "industrialiseringen",\n      "arbeiderbevegelse",\n      "arbeiderbevegelsen",\n      "fabrikk",\n      "fabrikkarbeid",\n      "arbeidsdeling",\n      "klasse",\n      "klasseforhold",\n      "fagforening",\n      "fagforeninger"'
              ),
              (
                  '"middelalder", "forhistorie", "fortiden", "kronologi"',
                  '"middelalder", "forhistorie", "forhistorien", "fortiden", "kronologi"'
              ),
              (
                  '"etterkrigstiden", "mellomkrigstiden", "middelalder"',
                  '"etterkrigstiden", "mellomkrigstiden", "dekolonisering", "over generasjoner", "over flere generasjoner", "gjennom livsløpet", "middelalder"'
              ),
              (
                  '''      {\n        "term": "redaksjonell profil",\n        "weight": 4\n      },\n      {\n        "term": "medielandskapet",''',
                  '''      {\n        "term": "redaksjonell profil",\n        "weight": 4\n      },\n      {\n        "term": "redaksjonelle profil",\n        "weight": 4\n      },\n      {\n        "term": "medieinstitusjoner",\n        "weight": 4\n      },\n      {\n        "term": "dannelsesoffentlighet",\n        "weight": 4\n      },\n      {\n        "term": "medielandskapet",'''
              )
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected policy fragment not found: {old[:80]}')
              text = text.replace(old, new, 1)
          policy_path.write_text(text, encoding='utf-8')

          matrix_path = Path('data/evaluation/aha-history-fagverk-evaluation-matrix.v1.json')
          matrix = json.loads(matrix_path.read_text(encoding='utf-8'))
          cases = {
              item['id']: item
              for group in ('positive_cases', 'confusion_cases', 'ambiguity_cases')
              for item in matrix[group]
          }
          memory = cases['history-confusion-memory-not-public']
          memory['text'] = 'Monumentet ble over tid omstridt gjennom kollektivt minne, historiebruk og minnepolitikk; offentlig debatt er arenaen, ikke hovedemnet.'
          environment = cases['history-negative-environment']
          environment['text'] = 'Klima og natur påvirker landskapet, men teksten beskriver bare dagens forhold uten tidsrom, kilder eller dokumentert endring.'
          environment['non_scoring_evidence'] = ['teksten', 'tidsrom', 'kilder', 'endring']
          matrix_path.write_text(json.dumps(matrix, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Verify full History review gate
        run: |
          node --check scripts/build-history-fagverk-term-policy.mjs
          node scripts/build-history-fagverk-term-policy.mjs
          node scripts/build-history-fagverk-expansion-review.mjs
          node scripts/evaluate-history-fagverk-policy.mjs
          node scripts/compare-history-fixture-corrections.mjs
          node scripts/build-history-go-fagverk-subject-approvals.mjs --subject historie
          node tests/aha-history-fagverk-review.test.cjs

      - name: Commit reviewed source corrections only
        run: |
          git add \
            scripts/build-history-fagverk-term-policy.mjs \
            data/evaluation/aha-history-fagverk-evaluation-matrix.v1.json
          if git diff --cached --quiet; then
            echo 'History policy source corrections are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Correct History review anchors and media evidence'
          git push origin HEAD:review/history-fagverk-v1
