name: Kunstrommet V2 checks

on:
  pull_request:
    paths:
      - 'kunstrommet-v2.html'
      - 'kunstrommet.html'
      - 'js/ahaKunstrommetV2.js'
      - 'js/ahaKunstrommetBridge.js'
      - 'tests/fixtures/kunstrommet-v1.html'
      - 'css/aha-kunstrommet-v2.css'
      - 'tests/aha-kunstrommet-v2-contract.test.cjs'
      - 'tests/browser/aha-kunstrommet-v2.spec.cjs'
      - '.github/workflows/kunstrommet-v2.yml'
  workflow_dispatch:

jobs:
  node-contract:
    name: Local-only editor contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: node --check js/ahaKunstrommetV2.js
      - run: node tests/aha-kunstrommet-v2-contract.test.cjs
      - run: node tests/aha-kunstrommet-contract.test.cjs
      - run: node tests/aha-kunstrommet-gallery-reuse.test.cjs
      - run: node tests/aha-kunstrommet-references.test.cjs
      - run: node tests/aha-kunstrommet-interaction.test.cjs

  browser:
    name: V2 browser – ${{ matrix.project }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-corpus, ipad-webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/browser/aha-kunstrommet-v2.spec.cjs tests/browser/aha-kunstrommet.spec.cjs --config=playwright.config.cjs --project="${{ matrix.project }}"
      - name: Test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kunstrommet-v2-playwright-${{ matrix.project }}
          path: test-results/
          retention-days: 7

  browser-10-focused:
    name: 10.0a–f, 10.1a–b and contextual visibility release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify all eight feature tests and contextual visibility in both browser projects
        run: |
          set -euo pipefail
          npx playwright test tests/browser/aha-kunstrommet-v2.spec.cjs --config=playwright.config.cjs --grep '10\.(0[a-f]|1[ab])|8\.1 contextual tool settings' --list | tee /tmp/kr10-tests.txt
          grep -Fx 'Total: 18 tests in 1 file' /tmp/kr10-tests.txt
          npx playwright test tests/browser/aha-kunstrommet-v2.spec.cjs --config=playwright.config.cjs --grep '10\.(0[a-f]|1[ab])|8\.1 contextual tool settings'
      - name: Compact studio screenshots (synthetic artwork)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kunstrommet-10-1b-studio-screenshots
          path: test-results/**/studio-*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Focused artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kunstrommet-10-focused
          path: test-results/
          retention-days: 7
