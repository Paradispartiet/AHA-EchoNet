name: Fix Business activation observation contract

on:
  push:
    branches:
      - activation/naeringsliv-fagverk-v1-runtime

permissions:
  contents: write

jobs:
  fix-observation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: activation/naeringsliv-fagverk-v1-runtime
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Update stale runtime observation expectations
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'tests/aha-history-go-fagverk-release-observation.test.cjs';
          let text = fs.readFileSync(path, 'utf8');
          function replaceOnce(oldText, newText, label) {
            const count = text.split(oldText).length - 1;
            if (count !== 1) throw new Error(`${label}: expected one occurrence, found ${count}`);
            text = text.replace(oldText, newText);
          }
          replaceOnce(
            "assert.deepEqual(approved.legacy_seed.overridden_subject_ids, ['historie', 'natur', 'politikk']);",
            "assert.deepEqual(approved.legacy_seed.overridden_subject_ids, ['historie', 'naeringsliv', 'natur', 'politikk']);",
            'approved overrides'
          );
          replaceOnce(
            "assert.deepEqual(Object.keys(approved.approved_subjects), ['historie', 'natur', 'politikk']);",
            "assert.deepEqual(Object.keys(approved.approved_subjects), ['historie', 'naeringsliv', 'natur', 'politikk']);",
            'approved subjects'
          );
          replaceOnce(
            "  const approvedNature = approved.approved_subjects.natur;",
            "  const approvedBusiness = approved.approved_subjects.naeringsliv;\n  assert.equal(approvedBusiness.source_commit, observed.source_commit);\n  assert.equal(approvedBusiness.corpus_path.startsWith('data/integrations/runtime/'), true);\n  assert.equal(approvedBusiness.policy_path.startsWith('data/integrations/runtime/'), true);\n  assert.equal(approvedBusiness.chapter_count, 12);\n  assert.equal(approvedBusiness.scoring_mode, 'subject_policy_v1');\n\n  const approvedNature = approved.approved_subjects.natur;",
            'approved Business assertions'
          );
          replaceOnce(
            "assert.deepEqual(runtimeActive.legacy_seed.overridden_subject_ids, ['historie', 'natur', 'politikk']);",
            "assert.deepEqual(runtimeActive.legacy_seed.overridden_subject_ids, ['historie', 'naeringsliv', 'natur', 'politikk']);",
            'active overrides'
          );
          replaceOnce(
            "assert.deepEqual(Object.keys(runtimeActive.active_subjects), ['historie', 'natur', 'politikk']);",
            "assert.deepEqual(Object.keys(runtimeActive.active_subjects), ['historie', 'naeringsliv', 'natur', 'politikk']);",
            'active subjects'
          );
          replaceOnce(
            "  const activeNature = runtimeActive.active_subjects.natur;",
            "  const activeBusiness = runtimeActive.active_subjects.naeringsliv;\n  assert.equal(activeBusiness.source_commit, observed.source_commit);\n  assert.equal(activeBusiness.corpus_path, approvedBusiness.corpus_path);\n  assert.equal(activeBusiness.policy_path, approvedBusiness.policy_path);\n  assert.equal(activeBusiness.chapter_count, 12);\n  assert.equal(activeBusiness.scoring_mode, 'subject_policy_v1');\n\n  const activeNature = runtimeActive.active_subjects.natur;",
            'active Business assertions'
          );
          replaceOnce(
            '  assert.equal(runtimeActive.effective_entry_count, 47);',
            '  assert.equal(runtimeActive.effective_entry_count, 59);',
            'runtime total'
          );
          fs.writeFileSync(path, text, 'utf8');
          NODE
          node tests/aha-history-go-fagverk-release-observation.test.cjs
          npm test
      - name: Commit observation contract fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/aha-history-go-fagverk-release-observation.test.cjs
          git commit -m "Update Fagverk observation contract for Business runtime"
          git push origin HEAD:activation/naeringsliv-fagverk-v1-runtime
