name: AHA Politics Fagverk corpus audit

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/build-history-go-fagverk-corpus.mjs"
      - "tests/aha-politics-fagverk-corpus-builder.test.cjs"
      - ".github/workflows/aha-politics-fagverk-corpus-audit.yml"
      - "docs/AHA_POLITICS_FAGVERK_AUDIT_V1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-politics-corpus:
    name: Build and audit 13 Politics chapters
    runs-on: ubuntu-latest

    steps:
      - name: Checkout AHA-EchoNet
        uses: actions/checkout@v5
        with:
          path: aha

      - name: Checkout locked History Go source
        uses: actions/checkout@v5
        with:
          repository: Paradispartiet/History-Go
          ref: 9e9644e83998ff715005bf80c96cde6193107c13
          path: history-go
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build Politics corpus and collision audit
        working-directory: aha
        run: |
          node scripts/build-history-go-fagverk-corpus.mjs \
            --history-go-root ../history-go \
            --subject politikk \
            --expected-count 13 \
            --output artifacts/history-go-fagverk-politikk.audit.v1.json \
            --audit-output artifacts/history-go-fagverk-politikk.audit-report.v1.json

      - name: Verify artifact contract
        working-directory: aha
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const corpus = JSON.parse(fs.readFileSync('artifacts/history-go-fagverk-politikk.audit.v1.json', 'utf8'));
          const audit = JSON.parse(fs.readFileSync('artifacts/history-go-fagverk-politikk.audit-report.v1.json', 'utf8'));
          if (corpus.source_ref !== '9e9644e83998ff715005bf80c96cde6193107c13') throw new Error(`Unexpected History Go source_ref: ${corpus.source_ref}`);
          if (corpus.subject_filter !== 'politikk') throw new Error('Corpus is not Politics-scoped.');
          if (corpus.entries.length !== 13) throw new Error(`Expected 13 entries, got ${corpus.entries.length}.`);
          if (corpus.entries.some((entry) => entry.subject_id !== 'politikk')) throw new Error('Non-Politics entry leaked into corpus.');
          if (!audit.gate?.passed) throw new Error(`Coverage gate failed: ${(audit.gate?.errors || []).join(' ')}`);
          if (audit.coverage?.registered !== 13 || audit.coverage?.materialized !== 13) throw new Error('Politics registry coverage is not 13/13.');
          if (audit.activation_recommendation !== 'review_required_before_runtime_activation') throw new Error('Audit must remain review-gated before runtime activation.');
          console.log(`Verified Politics corpus: ${corpus.entries.length}/13 chapters; ${audit.term_collision_summary.high_risk} high-risk terms require review.`);
          NODE

      - name: Upload Politics audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aha-politics-fagverk-audit
          path: |
            aha/artifacts/history-go-fagverk-politikk.audit.v1.json
            aha/artifacts/history-go-fagverk-politikk.audit-report.v1.json
          if-no-files-found: error
          retention-days: 14
