name: One-shot AHA semantic analysis quality v1

on:
  push:
    branches:
      - agent/analysis-semantic-quality-v1

permissions:
  contents: write

jobs:
  transform:
    if: ${{ !contains(github.event.head_commit.message, '[analysis-transform]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/analysis-semantic-quality-v1
          fetch-depth: 0

      - name: Apply semantic analysis transform
        run: node scripts/one-shot-analysis-semantic-quality-v1.cjs

      - name: Commit transformed sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/ahaChatSignals.js js/ahaChatAutoAnalysis.js js/ahaChatCanonicalAnalysis.js js/ahaAnalysisQualityEvaluator.js tests/aha-analysis-semantic-regression-v1.test.cjs
          if git diff --cached --quiet; then
            echo "No transform changes to commit"
            exit 0
          fi
          git commit -m "[analysis-transform] Improve semantic analysis quality"
          git push origin HEAD:agent/analysis-semantic-quality-v1
