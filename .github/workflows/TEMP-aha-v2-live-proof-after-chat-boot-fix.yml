name: TEMP AHA V2 live proof after Chat boot fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: read

jobs:
  proof:
    if: github.head_ref == 'probe/v2-live-proof-after-chat-boot-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_MAIN: 497fa06eee5c910fce146281c2703a4c76fb0081
      PAGES_ORIGIN: https://paradispartiet.github.io/AHA-EchoNet
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prove deployed GitHub Pages commit and runtime hashes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p probe-evidence
          latest_json=''
          pages_commit=''
          pages_status=''
          for attempt in $(seq 1 18); do
            latest_json="$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/pages/builds/latest")"
            pages_commit="$(printf '%s' "$latest_json" | jq -r '.commit // empty')"
            pages_status="$(printf '%s' "$latest_json" | jq -r '.status // empty')"
            echo "Pages attempt ${attempt}: commit=${pages_commit:-missing} status=${pages_status:-missing}"
            if [[ "$pages_commit" == "$EXPECTED_MAIN" && "$pages_status" == "built" ]]; then break; fi
            sleep 10
          done
          printf '%s\n' "$latest_json" > probe-evidence/pages-build-latest.json
          [[ "$pages_commit" == "$EXPECTED_MAIN" ]]
          [[ "$pages_status" == "built" ]]

          assets=(
            "chat.html"
            "js/ahaChatProviderLoader.js"
            "js/ahaChatMemoryRuntime.js"
            "js/ahaChatAgentRuntime.js"
            "js/ahaV2ProductIntegrationGate.js"
            "js/ahaV2ChatReadOnlyContext.js"
            "js/ahaV2ProductionWriteGate.js"
            "js/ahaV2BackfillStagingStore.js"
            "js/ahaV2ProductionMigrationRehearsal.js"
            "v2-production-migration-rehearsal.html"
            "js/ahaV2ControlledWritePilotRollback.js"
          )
          printf '{\n  "schema":"aha_v2_live_pages_parity_v2",\n  "expected_main":"%s",\n  "pages_commit":"%s",\n  "pages_status":"%s",\n  "assets":[\n' "$EXPECTED_MAIN" "$pages_commit" "$pages_status" > probe-evidence/pages-parity.json
          first=1
          for asset in "${assets[@]}"; do
            expected_sha="$(sha256sum "$asset" | awk '{print $1}')"
            tmp="$(mktemp)"
            curl -fsSL -H "Cache-Control: no-cache" "${PAGES_ORIGIN}/${asset}?aha_v2_live_fix=${GITHUB_RUN_ID}" > "$tmp"
            actual_sha="$(sha256sum "$tmp" | awk '{print $1}')"
            rm -f "$tmp"
            echo "$asset expected=$expected_sha deployed=$actual_sha"
            [[ "$expected_sha" == "$actual_sha" ]]
            if [[ $first -eq 0 ]]; then printf ',\n' >> probe-evidence/pages-parity.json; fi
            first=0
            printf '    {"path":"%s","sha256":"%s","match":true}' "$asset" "$actual_sha" >> probe-evidence/pages-parity.json
          done
          printf '\n  ],\n  "all_assets_match":true\n}\n' >> probe-evidence/pages-parity.json

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run live migration rehearsal and read-only Chat canaries
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node scripts/TEMP-aha-v2-live-proof-after-chat-boot-fix.mjs

      - name: Upload live proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aha-v2-live-proof-after-chat-boot-fix-${{ github.run_id }}
          path: probe-evidence/
          if-no-files-found: warn
