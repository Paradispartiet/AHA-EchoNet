name: AHA Business Fagverk review

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/business-review-trigger.txt"
      - "scripts/bootstrap-business-fagverk-review.py"
      - "scripts/lib/business-fagverk-scoring.mjs"
      - "scripts/build-business-fagverk-term-policy.mjs"
      - "scripts/build-business-fagverk-expansion-review.mjs"
      - ".github/workflows/aha-business-fagverk-review.yml"
  issue_comment:
    types: [created]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-review:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && github.head_ref == 'review/naeringsliv-fagverk-v1') ||
      (github.event_name == 'issue_comment' && github.event.issue.number == 595 && github.event.comment.body == '/materialize-business-review')
    name: Materialize complete Business review package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: review/naeringsliv-fagverk-v1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Detect bootstrap mode
        id: mode
        shell: bash
        run: |
          if [[ -f scripts/bootstrap-business-fagverk-review.py ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate review sources and matrices
        if: steps.mode.outputs.run == 'true'
        run: python scripts/bootstrap-business-fagverk-review.py

      - name: Build complete review package
        if: steps.mode.outputs.run == 'true'
        run: |
          node scripts/build-business-fagverk-term-policy.mjs
          node scripts/build-business-fagverk-expansion-review.mjs
          node scripts/evaluate-business-fagverk-policy.mjs
          node scripts/compare-business-fixture-corrections.mjs
          node scripts/build-history-go-fagverk-subject-approvals.mjs --subject naeringsliv

      - name: Verify Business and shared approval contracts
        if: steps.mode.outputs.run == 'true'
        run: |
          node tests/aha-business-fagverk-review.test.cjs
          node tests/aha-fagverk-subject-approvals.test.cjs

      - name: Remove bootstrap and trigger files
        if: steps.mode.outputs.run == 'true'
        run: |
          rm scripts/bootstrap-business-fagverk-review.py
          rm scripts/business-review-trigger.txt

      - name: Verify exact review scope
        if: steps.mode.outputs.run == 'true'
        env:
          ALLOWED_JSON: '["data/evaluation/aha-business-fagverk-evaluation-matrix.v1.json","data/evaluation/aha-business-fagverk-evaluation-report.v1.json","data/evaluation/aha-business-fixture-corrections.v1.json","data/evaluation/aha-business-fixture-correction-report.v1.json","data/integrations/approvals/history-go-fagverk-naeringsliv.approved.v1.json","data/integrations/review/history-go-fagverk-naeringsliv.expansion-review.v1.json","data/integrations/review/history-go-fagverk-naeringsliv.term-policy.v1.json","data/integrations/review/history-go-fagverk-subject-approval-registry.v1.json","docs/AHA_BUSINESS_FAGVERK_REVIEW_V1.md","scripts/bootstrap-business-fagverk-review.py","scripts/business-review-trigger.txt","scripts/compare-business-fixture-corrections.mjs","scripts/evaluate-business-fagverk-policy.mjs","tests/aha-business-fagverk-review.test.cjs","tests/aha-fagverk-subject-approvals.test.cjs"]'
        run: |
          node - <<'NODE'
          const { execFileSync } = require('child_process');
          const allowed = new Set(JSON.parse(process.env.ALLOWED_JSON));
          const status = execFileSync('git', ['status', '--porcelain'], { encoding: 'utf8' });
          const actual = status.trimEnd().split(/\n/).filter(Boolean).map((line) => line.slice(3));
          const unexpected = actual.filter((file) => !allowed.has(file));
          const missing = [...allowed].filter((file) => !actual.includes(file));
          if (unexpected.length || missing.length) {
            console.error({ unexpected, missing, actual });
            process.exit(1);
          }
          console.log(`Business review scope verified: ${actual.length} files.`);
          NODE

      - name: Commit materialized review package
        if: steps.mode.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize complete Business Fagverk review"
          git push origin HEAD:review/naeringsliv-fagverk-v1
