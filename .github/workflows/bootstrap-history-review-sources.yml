name: Bootstrap History Fagverk review sources

on:
  push:
    branches:
      - review/history-fagverk-v1

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: review/history-fagverk-v1
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Restore reviewed source package
        run: |
          printf '%s' '' > /tmp/history-review-sources.b64
          printf '%s' '' >> /tmp/history-review-sources.b64
          base64 -d /tmp/history-review-sources.b64 > /tmp/history-review-sources.tar.gz
          echo '02cf9c115f1210cebf7bcbb248eb502fb5dffc9dfbea42a3d8ff953ec44c8122  /tmp/history-review-sources.tar.gz' | sha256sum -c -
          tar -xzf /tmp/history-review-sources.tar.gz -C .

      - name: Materialize and validate History review evidence
        run: |
          node --check scripts/lib/history-fagverk-scoring.mjs
          node --check scripts/build-history-fagverk-term-policy.mjs
          node --check scripts/build-history-fagverk-expansion-review.mjs
          node --check scripts/evaluate-history-fagverk-policy.mjs
          node --check scripts/compare-history-fixture-corrections.mjs
          node scripts/build-history-fagverk-term-policy.mjs
          node scripts/build-history-fagverk-expansion-review.mjs
          node scripts/evaluate-history-fagverk-policy.mjs
          node scripts/compare-history-fixture-corrections.mjs
          node scripts/build-history-go-fagverk-subject-approvals.mjs --subject historie
          node tests/aha-history-fagverk-review.test.cjs

      - name: Commit complete History review package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/lib/history-fagverk-scoring.mjs \
            scripts/build-history-fagverk-term-policy.mjs \
            scripts/build-history-fagverk-expansion-review.mjs \
            scripts/evaluate-history-fagverk-policy.mjs \
            scripts/compare-history-fixture-corrections.mjs \
            data/evaluation/aha-history-fagverk-evaluation-matrix.v1.json \
            data/evaluation/aha-history-fagverk-evaluation-report.v1.json \
            data/evaluation/aha-history-fixture-corrections.v1.json \
            data/evaluation/aha-history-fixture-correction-report.v1.json \
            data/integrations/review/history-go-fagverk-historie.term-policy.v1.json \
            data/integrations/review/history-go-fagverk-historie.expansion-review.v1.json \
            data/integrations/review/history-go-fagverk-subject-approval-registry.v1.json \
            data/integrations/approvals/history-go-fagverk-historie.approved.v1.json \
            tests/aha-history-fagverk-review.test.cjs \
            .github/workflows/aha-history-fagverk-review.yml \
            docs/AHA_HISTORY_FAGVERK_REVIEW_V1.md
          git commit -m 'Add complete History Fagverk review package'
          git push origin HEAD:review/history-fagverk-v1
