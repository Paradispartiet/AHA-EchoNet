name: AHA canonical sync production pilot expansion activation

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Skriv RUN_AHA_CANONICAL_PRODUCTION_PILOT_EXPANSION_ACTIVATION for å legge til nøyaktig én allerede verifisert pilotprofil"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: aha-canonical-production-pilot-control
  cancel-in-progress: false

jobs:
  activate-one-expanded-pilot:
    name: Activate exactly one same-SHA verified pilot profile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: aha-canonical-production-infra

    env:
      GH_TOKEN: ${{ github.token }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AHA_PRODUCTION_PILOT_EXPANSION_PROFILE_ID: ${{ secrets.AHA_PRODUCTION_PILOT_EXPANSION_PROFILE_ID }}
      AHA_AZURE_LOCATION: ${{ vars.AHA_PRODUCTION_AZURE_LOCATION || 'westeurope' }}
      AHA_PRODUCTION_RESOURCE_GROUP: ${{ vars.AHA_PRODUCTION_RESOURCE_GROUP || 'rg-aha-canonical-prod' }}
      AHA_PRODUCTION_CONTAINER_APP: aha-canonical-api-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Require main, exact activation confirmation and one protected candidate
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo "Production pilot expansion activation only runs from main." >&2
            exit 1
          fi
          if [[ "$CONFIRMATION" != 'RUN_AHA_CANONICAL_PRODUCTION_PILOT_EXPANSION_ACTIVATION' ]]; then
            echo "Exact production pilot expansion activation confirmation is required." >&2
            exit 1
          fi
          if [[ ! "$AHA_PRODUCTION_PILOT_EXPANSION_PROFILE_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ ]]; then
            echo "AHA_PRODUCTION_PILOT_EXPANSION_PROFILE_ID must be one protected UUID." >&2
            exit 1
          fi
          printf '::add-mask::%s\n' "$AHA_PRODUCTION_PILOT_EXPANSION_PROFILE_ID"
          candidate_lower="${AHA_PRODUCTION_PILOT_EXPANSION_PROFILE_ID,,}"
          candidate_fingerprint="$(printf '%s' "$candidate_lower" | sha256sum | awk '{print $1}')"
          {
            printf 'AHA_EXPANSION_CANDIDATE_LOWER=%s\n' "$candidate_lower"
            printf 'AHA_EXPANSION_CANDIDATE_FINGERPRINT=%s\n' "$candidate_fingerprint"
          } >> "$GITHUB_ENV"

      - name: Require successful same-SHA gate for this exact protected candidate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t gate_runs < <(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow aha-canonical-sync-production-pilot-expansion-gate.yml \
            --branch main \
            --event workflow_dispatch \
            --status success \
            --limit 50 \
            --json databaseId,headSha,conclusion \
            --jq ".[] | select(.headSha == \"${GITHUB_SHA}\" and .conclusion == \"success\") | .databaseId")

          selected=''
          for gate_run in "${gate_runs[@]}"; do
            evidence_dir="$RUNNER_TEMP/gate-${gate_run}"
            rm -rf "$evidence_dir"
            mkdir -p "$evidence_dir"
            if ! gh run download "$gate_run" \
              --repo "$GITHUB_REPOSITORY" \
              --name "aha-production-pilot-expansion-gate-${gate_run}" \
              --dir "$evidence_dir" >/dev/null 2>&1; then
              continue
            fi
            evidence="$evidence_dir/pilot-expansion-gate.json"
            [[ -f "$evidence" ]] || continue
            if jq -e \
              --arg sha "$GITHUB_SHA" \
              --arg fingerprint "$AHA_EXPANSION_CANDIDATE_FINGERPRINT" '
                .version == "aha_canonical_production_pilot_expansion_gate_v1" and
                .status == "pass" and
                .gateGitSha == $sha and
                .candidateFingerprintSha256 == $fingerprint and
                .verificationReadOnly == true and
                .productionCanonicalDataMutated == false and
                .profileAdded == false and
                .allowlistChanged == false and
                .apiDeploymentChanged == false
              ' "$evidence" >/dev/null; then
              selected="$gate_run"
              break
            fi
          done

          if [[ -z "$selected" ]]; then
            echo "Expansion activation requires a successful gate on this exact main SHA for this exact protected candidate." >&2
            exit 1
          fi
          printf 'AHA_EXPANSION_GATE_RUN=%s\n' "$selected" >> "$GITHUB_ENV"
          echo "Verified candidate-bound same-SHA expansion gate run: ${selected}"

      - name: Azure OIDC login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare Container Apps tooling
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --only-show-errors
          printf 'AHA_EXPANSION_AZURE_READY=1\n' >> "$GITHUB_ENV"

      - name: Resolve the exact active production allowlist and immutable runtime
        shell: bash
        run: |
          set -euo pipefail
          app_json="$RUNNER_TEMP/expansion-activation-live-app.json"
          az containerapp show \
            --resource-group "$AHA_PRODUCTION_RESOURCE_GROUP" \
            --name "$AHA_PRODUCTION_CONTAINER_APP" \
            -o json --only-show-errors > "$app_json"

          fqdn="$(jq -r '.properties.configuration.ingress.fqdn // empty' "$app_json")"
          current_sync="$(jq -r '[.properties.template.containers[0].env[] | select(.name=="AHA_CANONICAL_SYNC_ENABLED") | .value][0] // "false"' "$app_json")"
          current_runtime="$(jq -r '[.properties.template.containers[0].env[] | select(.name=="AHA_RUNTIME_ACTIVATED") | .value][0] // "false"' "$app_json")"
          current_revision="$(jq -r '[.properties.template.containers[0].env[] | select(.name=="AHA_API_VERSION") | .value][0] // empty' "$app_json")"
          current_image="$(jq -r '.properties.template.containers[0].image // empty' "$app_json")"
          cae_id="$(jq -r '.properties.environmentId // empty' "$app_json")"
          runtime_identity_id="$(jq -r '.identity.userAssignedIdentities | keys[0] // empty' "$app_json")"
          appinsights="$(jq -r '[.properties.template.containers[0].env[] | select(.name=="APPLICATIONINSIGHTS_CONNECTION_STRING") | .value][0] // empty' "$app_json")"
          database_uri="$(jq -r '[.properties.configuration.secrets[] | select(.name=="database-url") | .keyVaultUrl][0] // empty' "$app_json")"
          database_ca_uri="$(jq -r '[.properties.configuration.secrets[] | select(.name=="database-ca") | .keyVaultUrl][0] // empty' "$app_json")"
          audit_salt_uri="$(jq -r '[.properties.configuration.secrets[] | select(.name=="audit-salt") | .keyVaultUrl][0] // empty' "$app_json")"
          legacy_pilot_uri="$(jq -r '[.properties.configuration.secrets[] | select(.name=="pilot-profile-id") | .keyVaultUrl][0] // empty' "$app_json")"
          previous_allowlist_uri="$(jq -r '[.properties.configuration.secrets[] | select(.name=="pilot-profile-ids-json") | .keyVaultUrl][0] // empty' "$app_json")"

          [[ -n "$fqdn" && -n "$current_image" && -n "$cae_id" && -n "$runtime_identity_id" && -n "$appinsights" ]] || {
            echo "Could not resolve the complete active production runtime shape." >&2
            exit 1
          }
          [[ -n "$database_uri" && -n "$database_ca_uri" && -n "$audit_salt_uri" && -n "$legacy_pilot_uri" ]] || {
            echo "Expansion activation requires all protected production runtime secret references." >&2
            exit 1
          }
          [[ "$current_sync" == 'true' && "$current_runtime" == 'true' ]] || {
            echo "Expansion activation requires an already active manual production pilot." >&2
            exit 1
          }
          [[ "$current_revision" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Active production pilot is not an immutable Git revision." >&2
            exit 1
          }

          runtime_vault="$(AHA_VAULT_URL="$database_uri" python3 -c 'import os; from urllib.parse import urlparse; host=urlparse(os.environ["AHA_VAULT_URL"]).hostname or ""; assert host.endswith(".vault.azure.net"); print(host.split(".")[0], end="")')"
          runtime_vault_uri="$(az keyvault show --name "$runtime_vault" --query properties.vaultUri -o tsv --only-show-errors)"
          anchor="$(az keyvault secret show --id "$legacy_pilot_uri" --query value -o tsv --only-show-errors)"
          [[ "$anchor" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "Protected legacy pilot anchor is unavailable." >&2; exit 1; }
          anchor_lower="${anchor,,}"
          printf '::add-mask::%s\n' "$anchor"
          if [[ "$anchor_lower" == "$AHA_EXPANSION_CANDIDATE_LOWER" ]]; then
            echo "Expansion candidate cannot be the protected legacy pilot anchor." >&2
            exit 1
          fi

          if [[ -n "$previous_allowlist_uri" ]]; then
            current_allowlist="$(az keyvault secret show --id "$previous_allowlist_uri" --query value -o tsv --only-show-errors)"
          else
            current_allowlist="$(jq -cn --arg id "$anchor_lower" '[$id]')"
          fi
          current_allowlist="$(jq -c 'map(ascii_downcase)' <<<"$current_allowlist")"
          jq -e --arg anchor "$anchor_lower" '
            type == "array" and
            length >= 1 and length < 10 and
            all(.[]; type == "string" and test("^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$")) and
            length == (unique | length) and
            index($anchor) != null
          ' <<<"$current_allowlist" >/dev/null || {
            echo "Current production allowlist is not a valid bounded protected fleet." >&2
            exit 1
          }
          jq -e --arg candidate "$AHA_EXPANSION_CANDIDATE_LOWER" 'index($candidate) == null' <<<"$current_allowlist" >/dev/null || {
            echo "Expansion candidate is already present in the active API allowlist." >&2
            exit 1
          }
          current_count="$(jq 'length' <<<"$current_allowlist")"

          health="$RUNNER_TEMP/expansion-activation-preflight-health.json"
          curl --fail --silent --show-error --max-time 20 "https://${fqdn}/v1/health" > "$health"
          jq -e --argjson count "$current_count" '
            .status == "ok" and
            .service == "aha-nest-api" and
            .runtimeActivated == true and
            .canonicalSync.enabled == true and
            .canonicalSync.profileLimitMode == "protected_allowlist" and
            .canonicalSync.allowedProfileCount == $count and
            .database.configured == true and
            .database.connected == true and
            .database.safeRuntimeRole == true and
            .database.canonicalSchema == "present" and
            .auth.configured == true
          ' "$health" >/dev/null

          ops_vaults="$(az keyvault list --resource-group "$AHA_PRODUCTION_RESOURCE_GROUP" --query "[?tags.credentialScope=='migration-operations-only']" -o json --only-show-errors)"
          [[ "$(jq 'length' <<<"$ops_vaults")" == '1' ]] || { echo "Expansion activation requires exactly one operations-only Key Vault." >&2; exit 1; }
          ops_vault="$(jq -r '.[0].name' <<<"$ops_vaults")"
          ops_vault_uri="$(jq -r '.[0].properties.vaultUri' <<<"$ops_vaults")"

          migration_identities="$(az identity list --resource-group "$AHA_PRODUCTION_RESOURCE_GROUP" --query "[?ends_with(name, '-migration-id')]" -o json --only-show-errors)"
          [[ "$(jq 'length' <<<"$migration_identities")" == '1' ]] || { echo "Expansion activation requires exactly one migration identity." >&2; exit 1; }
          migration_identity_name="$(jq -r '.[0].name' <<<"$migration_identities")"

          acr_json="$(az acr list --resource-group "$AHA_PRODUCTION_RESOURCE_GROUP" -o json --only-show-errors)"
          [[ "$(jq 'length' <<<"$acr_json")" == '1' ]] || { echo "Expansion activation requires exactly one production ACR." >&2; exit 1; }
          acr_name="$(jq -r '.[0].name' <<<"$acr_json")"
          acr_login="$(jq -r '.[0].loginServer' <<<"$acr_json")"

          printf '::add-mask::%s\n' "$current_allowlist"
          {
            printf 'AHA_EXPANSION_API_FQDN=%s\n' "$fqdn"
            printf 'AHA_EXPANSION_PREVIOUS_REVISION=%s\n' "$current_revision"
            printf 'AHA_EXPANSION_PREVIOUS_IMAGE=%s\n' "$current_image"
            printf 'AHA_EXPANSION_CAE_NAME=%s\n' "${cae_id##*/}"
            printf 'AHA_EXPANSION_RUNTIME_IDENTITY_NAME=%s\n' "${runtime_identity_id##*/}"
            printf 'AHA_EXPANSION_APPINSIGHTS=%s\n' "$appinsights"
            printf 'AHA_EXPANSION_DATABASE_SECRET_URI=%s\n' "$database_uri"
            printf 'AHA_EXPANSION_DATABASE_CA_SECRET_URI=%s\n' "$database_ca_uri"
            printf 'AHA_EXPANSION_AUDIT_SALT_SECRET_URI=%s\n' "$audit_salt_uri"
            printf 'AHA_EXPANSION_LEGACY_PILOT_SECRET_URI=%s\n' "$legacy_pilot_uri"
            printf 'AHA_EXPANSION_PREVIOUS_ALLOWLIST_SECRET_URI=%s\n' "$previous_allowlist_uri"
            printf 'AHA_EXPANSION_CURRENT_ALLOWLIST=%s\n' "$current_allowlist"
            printf 'AHA_EXPANSION_CURRENT_COUNT=%s\n' "$current_count"
            printf 'AHA_EXPANSION_RUNTIME_KEYVAULT=%s\n' "$runtime_vault"
            printf 'AHA_EXPANSION_RUNTIME_KEYVAULT_URI=%s\n' "$runtime_vault_uri"
            printf 'AHA_EXPANSION_OPS_KEYVAULT=%s\n' "$ops_vault"
            printf 'AHA_EXPANSION_OPS_KEYVAULT_URI=%s\n' "$ops_vault_uri"
            printf 'AHA_EXPANSION_MIGRATION_IDENTITY_NAME=%s\n' "$migration_identity_name"
            printf 'AHA_EXPANSION_ACR_NAME=%s\n' "$acr_name"
            printf 'AHA_EXPANSION_ACR_LOGIN=%s\n' "$acr_login"
          } >> "$GITHUB_ENV"

      - name: Build immutable same-SHA API and database-control images
        shell: bash
        run: |
          set -euo pipefail
          az acr build --registry "$AHA_EXPANSION_ACR_NAME" --image "aha-canonical-api:${GITHUB_SHA}" --file backend/api/Dockerfile backend/api --only-show-errors >/dev/null
          az acr build --registry "$AHA_EXPANSION_ACR_NAME" --image "aha-canonical-db-init:${GITHUB_SHA}" --file infra/azure/production/db-init/Dockerfile . --only-show-errors >/dev/null
          {
            printf 'AHA_EXPANSION_API_IMAGE=%s/aha-canonical-api:%s\n' "$AHA_EXPANSION_ACR_LOGIN" "$GITHUB_SHA"
            printf 'AHA_EXPANSION_DB_IMAGE=%s/aha-canonical-db-init:%s\n' "$AHA_EXPANSION_ACR_LOGIN" "$GITHUB_SHA"
          } >> "$GITHUB_ENV"

      - name: Stage only the protected candidate for idempotent database bootstrap
        shell: bash
        run: |
          set -euo pipefail
          candidate_secret="aha-pilot-expansion-activate-${GITHUB_RUN_ID}"
          az keyvault secret set \
            --vault-name "$AHA_EXPANSION_OPS_KEYVAULT" \
            --name "$candidate_secret" \
            --value "$AHA_PRODUCTION_PILOT_EXPANSION_PROFILE_ID" \
            --only-show-errors >/dev/null
          printf 'AHA_EXPANSION_CANDIDATE_SECRET=%s\n' "$candidate_secret" >> "$GITHUB_ENV"

      - name: Deploy one-profile database bootstrap job inside production VNet
        shell: bash
        run: |
          set -euo pipefail
          job_name="aha-exp-act-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if (( ${#job_name} > 32 )); then
            echo "Generated Container Apps Job name exceeds the Azure 32-character limit." >&2
            exit 1
          fi
          az deployment group create \
            --resource-group "$AHA_PRODUCTION_RESOURCE_GROUP" \
            --name "aha-pilot-expand-activate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --template-file infra/azure/production/db-init-job.bicep \
            --parameters \
              location="$AHA_AZURE_LOCATION" \
              jobName="$job_name" \
              containerAppsEnvironmentName="$AHA_EXPANSION_CAE_NAME" \
              managedIdentityName="$AHA_EXPANSION_MIGRATION_IDENTITY_NAME" \
              acrName="$AHA_EXPANSION_ACR_NAME" \
              image="$AHA_EXPANSION_DB_IMAGE" \
              adminDatabaseUrlSecretUri="${AHA_EXPANSION_OPS_KEYVAULT_URI}secrets/aha-production-admin-database-url" \
              databaseCaSecretUri="${AHA_EXPANSION_OPS_KEYVAULT_URI}secrets/aha-production-database-ca" \
              pilotProfileIdSecretUri="${AHA_EXPANSION_OPS_KEYVAULT_URI}secrets/${AHA_EXPANSION_CANDIDATE_SECRET}" \
              mode=add_pilot_profile \
            --only-show-errors >/dev/null
          printf 'AHA_EXPANSION_CONTROL_JOB=%s\n' "$job_name" >> "$GITHUB_ENV"

      - name: Bootstrap exactly one candidate without runtime credential changes
        shell: bash
        run: |
          set -euo pipefail
          execution="$(az containerapp job start --name "$AHA_EXPANSION_CONTROL_JOB" --resource-group "$AHA_PRODUCTION_RESOURCE_GROUP" --query name -o tsv --only-show-errors)"
          [[ -n "$execution" ]] || { echo "Expansion activation did not return a database execution name." >&2; exit 1; }
          for attempt in {1..90}; do
            status="$(az containerapp job execution show --name "$AHA_EXPANSION_CONTROL_JOB" --resource-group "$AHA_PRODUCTION_RESOURCE_GROUP" --job-execution-name "$execution" --query properties.status -o tsv --only-show-errors 2>/dev/null || true)"
            case "$status" in
              Succeeded)
                printf 'AHA_EXPANSION_DB_BOOTSTRAPPED=1\n' >> "$GITHUB_ENV"
                echo "Production pilot expansion database bootstrap: ADDED_OR_ALREADY_PRESENT_ONE_PROFILE"
                exit 0
                ;;
              Failed)
                echo "Production pilot expansion database bootstrap failed." >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for production pilot expansion database bootstrap." >&2
          exit 1

      - name: Create a new immutable allowlist secret version containing the existing fleet plus candidate
        shell: bash
        run: |
          set -euo pipefail
          new_allowlist="$(jq -c --arg candidate "$AHA_EXPANSION_CANDIDATE_LOWER" '. + [$candidate]' <<<"$AHA_EXPANSION_CURRENT_ALLOWLIST")"
          new_count="$(jq 'length' <<<"$new_allowlist")"
          [[ "$new_count" -eq $((AHA_EXPANSION_CURRENT_COUNT + 1)) && "$new_count" -le 10 ]] || {
            echo "Expansion activation did not produce exactly one additional allowlisted profile." >&2
            exit 1
          }
          jq -e 'length == (unique | length)' <<<"$new_allowlist" >/dev/null
          printf '::add-mask::%s\n' "$new_allowlist"

          new_allowlist_uri="$(az keyvault secret set \
            --vault-name "$AHA_EXPANSION_RUNTIME_KEYVAULT" \
            --name aha-production-pilot-profile-ids-json \
            --value "$new_allowlist" \
            --query id -o tsv --only-show-errors)"
          [[ "$new_allowlist_uri" == https://*.vault.azure.net/secrets/aha-production-pilot-profile-ids-json/* ]] || {
            echo "Expansion activation failed to create a version-pinned allowlist secret." >&2
            exit 1
          }
          {
            printf 'AHA_EXPANSION_NEW_ALLOWLIST_SECRET_URI=%s\n' "$new_allowlist_uri"
            printf 'AHA_EXPANSION_NEW_COUNT=%s\n' "$new_count"
          } >> "$GITHUB_ENV"

      - name: Deploy same-SHA API with the version-pinned expanded allowlist
        shell: bash
        run: |
          set -euo pipefail
          printf 'AHA_EXPANSION_API_TOUCHED=1\n' >> "$GITHUB_ENV"
          az deployment group create \
            --resource-group "$AHA_PRODUCTION_RESOURCE_GROUP" \
            --name "aha-production-pilot-expand-api-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --template-file infra/azure/production/app.bicep \
            --parameters \
              location="$AHA_AZURE_LOCATION" \
              containerAppName="$AHA_PRODUCTION_CONTAINER_APP" \
              containerAppsEnvironmentName="$AHA_EXPANSION_CAE_NAME" \
              managedIdentityName="$AHA_EXPANSION_RUNTIME_IDENTITY_NAME" \
              acrName="$AHA_EXPANSION_ACR_NAME" \
              keyVaultName="$AHA_EXPANSION_RUNTIME_KEYVAULT" \
              image="$AHA_EXPANSION_API_IMAGE" \
              deployRevision="$GITHUB_SHA" \
              databaseUrlSecretUri="$AHA_EXPANSION_DATABASE_SECRET_URI" \
              databaseCaSecretUri="$AHA_EXPANSION_DATABASE_CA_SECRET_URI" \
              auditSaltSecretUri="$AHA_EXPANSION_AUDIT_SALT_SECRET_URI" \
              pilotProfileIdSecretUri="$AHA_EXPANSION_LEGACY_PILOT_SECRET_URI" \
              allowedProfileIdsSecretUri="$AHA_EXPANSION_NEW_ALLOWLIST_SECRET_URI" \
              canonicalSyncEnabled=true \
              runtimeActivated=true \
              applicationInsightsConnectionString="$AHA_EXPANSION_APPINSIGHTS" \
            --only-show-errors >/dev/null

      - name: Verify exact same-SHA health and expanded protected count
        shell: bash
        run: |
          set -euo pipefail
          health="$RUNNER_TEMP/expansion-activation-health.json"
          for attempt in {1..60}; do
            if curl --fail --silent --show-error --max-time 20 "https://${AHA_EXPANSION_API_FQDN}/v1/health" > "$health"; then
              if jq -e --arg revision "$GITHUB_SHA" --argjson count "$AHA_EXPANSION_NEW_COUNT" '
                .status == "ok" and
                .service == "aha-nest-api" and
                .version == $revision and
                .runtimeActivated == true and
                .canonicalSync.enabled == true and
                .canonicalSync.profileLimitMode == "protected_allowlist" and
                .canonicalSync.allowedProfileCount == $count and
                .database.configured == true and
                .database.connected == true and
                .database.safeRuntimeRole == true and
                .database.canonicalSchema == "present" and
                .auth.configured == true
              ' "$health" >/dev/null; then
                printf 'AHA_EXPANSION_ACTIVATION_COMMITTED=1\n' >> "$GITHUB_ENV"
                echo "AHA canonical production pilot expansion activation: COMMITTED_ADD_ONE_PROFILE"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Expanded production API did not reach the exact same-SHA protected allowlist health contract." >&2
          exit 1

      - name: Write non-identifying expansion activation evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          cat > "$RUNNER_TEMP/evidence/pilot-expansion-activation.json" <<JSON
          {
            "version": "aha_canonical_production_pilot_expansion_activation_v1",
            "status": "pass",
            "activationGitSha": "${GITHUB_SHA}",
            "candidateFingerprintSha256": "${AHA_EXPANSION_CANDIDATE_FINGERPRINT}",
            "sameShaGateRun": "${AHA_EXPANSION_GATE_RUN}",
            "previousLiveRevision": "${AHA_EXPANSION_PREVIOUS_REVISION}",
            "previousAllowedProfileCount": ${AHA_EXPANSION_CURRENT_COUNT},
            "newAllowedProfileCount": ${AHA_EXPANSION_NEW_COUNT},
            "profileAddedOneAtATime": true,
            "runtimeCredentialRotated": false,
            "automaticSyncEnabled": false,
            "loginSyncEnabled": false,
            "backgroundSyncEnabled": false,
            "canonicalDataDeleted": false,
            "candidateIdentityRendered": false
          }
          JSON

      - name: Upload immutable expansion activation evidence
        uses: actions/upload-artifact@v4
        with:
          name: aha-production-pilot-expansion-activation-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence/pilot-expansion-activation.json
          if-no-files-found: error
          retention-days: 90

      - name: Restore the previous API allowlist if expansion activation is incomplete
        if: always()
        shell: bash
        run: |
          set +e
          if [[ "${AHA_EXPANSION_ACTIVATION_COMMITTED:-0}" == '1' ]]; then
            echo "Expansion activation committed; incomplete-activation API rollback skipped."
            exit 0
          fi
          if [[ "${AHA_EXPANSION_API_TOUCHED:-0}" != '1' ]]; then
            echo "Expanded API was never touched; candidate data, if bootstrapped, remains inaccessible and retained."
            exit 0
          fi

          params=(
            location="$AHA_AZURE_LOCATION"
            containerAppName="$AHA_PRODUCTION_CONTAINER_APP"
            containerAppsEnvironmentName="$AHA_EXPANSION_CAE_NAME"
            managedIdentityName="$AHA_EXPANSION_RUNTIME_IDENTITY_NAME"
            acrName="$AHA_EXPANSION_ACR_NAME"
            keyVaultName="$AHA_EXPANSION_RUNTIME_KEYVAULT"
            image="$AHA_EXPANSION_PREVIOUS_IMAGE"
            deployRevision="$AHA_EXPANSION_PREVIOUS_REVISION"
            databaseUrlSecretUri="$AHA_EXPANSION_DATABASE_SECRET_URI"
            databaseCaSecretUri="$AHA_EXPANSION_DATABASE_CA_SECRET_URI"
            auditSaltSecretUri="$AHA_EXPANSION_AUDIT_SALT_SECRET_URI"
            pilotProfileIdSecretUri="$AHA_EXPANSION_LEGACY_PILOT_SECRET_URI"
            canonicalSyncEnabled=true
            runtimeActivated=true
            applicationInsightsConnectionString="$AHA_EXPANSION_APPINSIGHTS"
          )
          if [[ -n "${AHA_EXPANSION_PREVIOUS_ALLOWLIST_SECRET_URI:-}" ]]; then
            params+=(allowedProfileIdsSecretUri="$AHA_EXPANSION_PREVIOUS_ALLOWLIST_SECRET_URI")
          fi

          az deployment group create \
            --resource-group "$AHA_PRODUCTION_RESOURCE_GROUP" \
            --name "aha-production-pilot-expand-api-restore-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --template-file infra/azure/production/app.bicep \
            --parameters "${params[@]}" \
            --only-show-errors >/dev/null || {
              echo "Incomplete expansion activation could not restore the previous API allowlist." >&2
              exit 1
            }

          health="$RUNNER_TEMP/expansion-activation-restored-health.json"
          restored=0
          for attempt in {1..60}; do
            if curl --fail --silent --show-error --max-time 20 "https://${AHA_EXPANSION_API_FQDN}/v1/health" > "$health"; then
              if jq -e --arg revision "$AHA_EXPANSION_PREVIOUS_REVISION" --argjson count "$AHA_EXPANSION_CURRENT_COUNT" '
                .status == "ok" and
                .version == $revision and
                .runtimeActivated == true and
                .canonicalSync.enabled == true and
                .canonicalSync.allowedProfileCount == $count and
                .database.connected == true and
                .database.safeRuntimeRole == true
              ' "$health" >/dev/null; then
                restored=1
                break
              fi
            fi
            sleep 10
          done
          [[ "$restored" == '1' ]] || { echo "Previous protected API allowlist was not restored after incomplete expansion activation." >&2; exit 1; }
          echo "AHA canonical production pilot expansion activation: ROLLED_BACK_API_ALLOWLIST_ONLY_DATA_RETAINED"

      - name: Cleanup short-lived expansion activation resources
        if: always()
        shell: bash
        run: |
          set +e
          if [[ "${AHA_EXPANSION_AZURE_READY:-0}" != '1' ]]; then exit 0; fi
          if [[ -n "${AHA_EXPANSION_CONTROL_JOB:-}" ]]; then
            az containerapp job delete \
              --name "$AHA_EXPANSION_CONTROL_JOB" \
              --resource-group "$AHA_PRODUCTION_RESOURCE_GROUP" \
              --yes --only-show-errors >/dev/null 2>&1 || true
          fi
          if [[ -n "${AHA_EXPANSION_CANDIDATE_SECRET:-}" && -n "${AHA_EXPANSION_OPS_KEYVAULT:-}" ]]; then
            az keyvault secret delete \
              --vault-name "$AHA_EXPANSION_OPS_KEYVAULT" \
              --name "$AHA_EXPANSION_CANDIDATE_SECRET" \
              --only-show-errors >/dev/null 2>&1 || true
          fi
