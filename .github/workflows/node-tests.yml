name: AHA Node tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  node-tests:
    name: Node test suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Temporary branch-level diagnostics for PR #793. The connector cannot
      # expose raw npm-test stdout, so alphabetic chunks identify the remaining
      # failing standalone test from Actions step metadata. Remove before merge.
      - name: Diagnose suite chunk 001-060
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find tests -maxdepth 1 -type f \( -name '*.test.cjs' -o -name '*.test.mjs' -o -name '*.cjs' \) ! -name 'aha-python-engine-smoke.test.cjs' | sort)
          for file in "${files[@]:0:60}"; do echo "RUN $file"; node "$file"; done

      - name: Diagnose suite chunk 061-120
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find tests -maxdepth 1 -type f \( -name '*.test.cjs' -o -name '*.test.mjs' -o -name '*.cjs' \) ! -name 'aha-python-engine-smoke.test.cjs' | sort)
          for file in "${files[@]:60:60}"; do echo "RUN $file"; node "$file"; done

      - name: Diagnose suite chunk 121-180
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find tests -maxdepth 1 -type f \( -name '*.test.cjs' -o -name '*.test.mjs' -o -name '*.cjs' \) ! -name 'aha-python-engine-smoke.test.cjs' | sort)
          for file in "${files[@]:120:60}"; do echo "RUN $file"; node "$file"; done

      - name: Diagnose suite chunk 181+
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find tests -maxdepth 1 -type f \( -name '*.test.cjs' -o -name '*.test.mjs' -o -name '*.cjs' \) ! -name 'aha-python-engine-smoke.test.cjs' | sort)
          for file in "${files[@]:180}"; do echo "RUN $file"; node "$file"; done

      - name: Run deterministic Node test suite
        run: npm test
