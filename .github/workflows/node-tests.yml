name: AHA Node tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  node-tests:
    name: Node test suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Temporary diagnostics for PR #793. Remaining failure is in files 191-200.
      - name: Diagnose suite chunk 191-195
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find tests -maxdepth 1 -type f \( -name '*.test.cjs' -o -name '*.test.mjs' -o -name '*.cjs' \) ! -name 'aha-python-engine-smoke.test.cjs' | sort)
          for file in "${files[@]:190:5}"; do echo "RUN $file"; node "$file"; done

      - name: Diagnose suite chunk 196-200
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find tests -maxdepth 1 -type f \( -name '*.test.cjs' -o -name '*.test.mjs' -o -name '*.cjs' \) ! -name 'aha-python-engine-smoke.test.cjs' | sort)
          for file in "${files[@]:195:5}"; do echo "RUN $file"; node "$file"; done

      - name: Run deterministic Node test suite
        run: npm test
