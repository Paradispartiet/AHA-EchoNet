name: AHA canonical sync hosted staging rehearsal

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Skriv RUN_AHA_CANONICAL_SYNC_HOSTED_STAGING_REHEARSAL for å kjøre ekte NestJS ↔ PostgreSQL staging-sync"
        required: true
        type: string

permissions:
  contents: read

jobs:
  canonical-sync-hosted-staging:
    name: Canonical sync hosted staging HTTP rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: aha-postgresql-staging

    env:
      AHA_CANONICAL_SYNC_HOSTED_STAGING_CONFIRMATION: ${{ inputs.confirmation }}
      AHA_STAGING_PROJECT_REF: sstuzwppsheivczyqrim
      AHA_STAGING_ADMIN_DATABASE_URL: ${{ secrets.AHA_STAGING_ADMIN_DATABASE_URL }}
      AHA_AUTH_PROVIDER: supabase
      AHA_AUDIT_HASH_SALT: hosted-staging-e2e-audit-salt-not-for-production-2026
      AHA_STAGING_SYNC_WORKSPACE_ID: aha-staging-sync-e2e-workspace-v1
      AHA_STAGING_SYNC_API_BASE_URL: http://127.0.0.1:3100
      AHA_ALLOWED_ORIGINS: http://127.0.0.1:4173
      AHA_DATABASE_ENABLED: "true"
      AHA_DATABASE_SSL_MODE: verify-full
      AHA_CANONICAL_SYNC_ENABLED: "true"
      AHA_LOCAL_IMPORT_ENABLED: "false"
      NODE_ENV: development
      PORT: "3100"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate exact staging confirmation and admin DB secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$AHA_CANONICAL_SYNC_HOSTED_STAGING_CONFIRMATION" != "RUN_AHA_CANONICAL_SYNC_HOSTED_STAGING_REHEARSAL" ]]; then
            echo "Exact hosted canonical-sync staging confirmation is required." >&2
            exit 1
          fi
          if [[ -z "${AHA_STAGING_ADMIN_DATABASE_URL:-}" ]]; then
            echo "Missing required staging setting: AHA_STAGING_ADMIN_DATABASE_URL" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/api/package-lock.json

      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Provision run-scoped least-privilege AHA runtime role
        shell: bash
        run: bash scripts/aha-canonical-sync-hosted-staging-runtime-role.sh create

      - name: Re-run read-only hosted PostgreSQL safety preflight
        shell: bash
        env:
          AHA_HOSTED_STAGING_CONFIRMATION: RUN_AHA_HOSTED_STAGING_PREFLIGHT
        run: bash scripts/aha-postgresql-hosted-staging-preflight.sh

      - name: Generate ephemeral signed staging JWT and JWKS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aha-canonical-sync-auth"
          node scripts/aha-canonical-sync-hosted-staging-auth-fixture.cjs \
            generate \
            "$RUNNER_TEMP/aha-canonical-sync-auth" \
            "$GITHUB_ENV"

      - name: Prepare dedicated sync fixture and least-privilege grants
        shell: bash
        run: bash scripts/aha-canonical-sync-hosted-staging-prepare.sh

      - name: Install and build NestJS API
        working-directory: backend/api
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Start ephemeral JWKS server
        shell: bash
        run: |
          set -euo pipefail
          node scripts/aha-canonical-sync-hosted-staging-auth-fixture.cjs \
            serve \
            "$AHA_STAGING_JWKS_FILE" \
            > "$RUNNER_TEMP/aha-canonical-sync-staging-jwks.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/aha-canonical-sync-staging-jwks.pid"
          for attempt in {1..20}; do
            if curl --silent --show-error --fail http://127.0.0.1:3210/health >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          echo "Ephemeral JWKS server did not become healthy." >&2
          exit 1

      - name: Start NestJS locally against hosted AHA Staging
        working-directory: backend/api
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AHA_STAGING_RUNTIME_DATABASE_URL:-}" ]]; then
            echo "Ephemeral AHA runtime DSN is unavailable." >&2
            exit 1
          fi
          export AHA_DATABASE_URL="$AHA_STAGING_RUNTIME_DATABASE_URL"
          node dist/main.js > "$RUNNER_TEMP/aha-canonical-sync-staging-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/aha-canonical-sync-staging-api.pid"

      - name: Run real canonical sync HTTP rehearsal
        shell: bash
        env:
          AHA_STAGING_SYNC_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/aha-canonical-sync-hosted-staging-e2e.cjs

      - name: Stop staging processes
        if: always()
        shell: bash
        run: |
          for file in \
            "$RUNNER_TEMP/aha-canonical-sync-staging-api.pid" \
            "$RUNNER_TEMP/aha-canonical-sync-staging-jwks.pid"
          do
            if [[ -f "$file" ]]; then
              pid="$(cat "$file")"
              if [[ "$pid" =~ ^[0-9]+$ ]]; then
                kill "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
              fi
            fi
          done

      - name: Drop run-scoped AHA runtime role
        if: always()
        shell: bash
        run: bash scripts/aha-canonical-sync-hosted-staging-runtime-role.sh drop

      - name: Show sanitized API tail on failure
        if: failure()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/aha-canonical-sync-staging-api.log" ]]; then
            tail -n 80 "$RUNNER_TEMP/aha-canonical-sync-staging-api.log" \
              | sed -E 's#postgres(ql)?://[^[:space:]]+#<redacted-dsn>#g' \
              | sed -E 's#Bearer[[:space:]]+[A-Za-z0-9._~-]+#Bearer <redacted>#g'
          fi
