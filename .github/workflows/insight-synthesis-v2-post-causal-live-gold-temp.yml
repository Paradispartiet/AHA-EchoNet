name: Insight Synthesis V2 post-causal live gold temp

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/insight-synthesis-v2-post-causal-live-gold-temp.cjs
      - .github/workflows/insight-synthesis-v2-post-causal-live-gold-temp.yml

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Measure post-causal deployed V2
        run: node scripts/insight-synthesis-v2-post-causal-live-gold-temp.cjs
      - name: Upload post-causal measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: insight-synthesis-v2-post-causal-live-gold
          path: v2-post-causal-live-results/*.json
          if-no-files-found: error
          retention-days: 2
