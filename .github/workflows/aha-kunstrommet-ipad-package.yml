name: Kunstrommet isolated iPad package preflight
on:
  pull_request:
    paths:
      - 'tools/kunstrommet-sam-pilot/**'
      - 'js/ahaKunstrommetV2.js'
      - 'kunstrommet.html'
      - 'css/aha-kunstrommet-v2.css'
      - '.github/workflows/aha-kunstrommet-ipad-package.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stage pinned public test resources
        env:
          KR_PILOT_DIR: ${{ runner.temp }}/kr-model
        run: bash tools/kunstrommet-sam-pilot/stage.sh
      - name: Build isolated package and check asset sizes
        env:
          KR_PILOT_DIR: ${{ runner.temp }}/kr-model
          KR_IPAD_DIR: ${{ runner.temp }}/kr-ipad
        run: node tools/kunstrommet-sam-pilot/build-ipad-package.mjs
      - name: Install locked browser test dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Actual packaged editor inference (no injected flags)
        env:
          KR_PILOT_DIR: ${{ runner.temp }}/kr-model
          KR_IPAD_DIR: ${{ runner.temp }}/kr-ipad
        run: node tools/kunstrommet-sam-pilot/editor-smoke.mjs
      - name: Collect exact runtime notice evidence
        env:
          KR_PILOT_DIR: ${{ runner.temp }}/kr-model
          KR_NOTICE_DIR: ${{ runner.temp }}/kr-notice-review
        run: node tools/kunstrommet-sam-pilot/audit-distribution-notices.mjs
