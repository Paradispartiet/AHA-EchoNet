name: AHA Politics Fagverk corpus audit

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/build-history-go-fagverk-corpus.mjs"
      - "tests/aha-politics-fagverk-corpus-builder.test.cjs"
      - "tests/aha-politics-fagverk-reviewed-artifact.test.cjs"
      - ".github/workflows/aha-politics-fagverk-corpus-audit.yml"
      - "docs/AHA_POLITICS_FAGVERK_AUDIT_V1.md"
      - "data/integrations/candidates/history-go-fagverk-politikk.candidate.v1.json"
      - "data/integrations/candidates/history-go-fagverk-politikk.candidate-audit.v1.json"
      - "data/integrations/review/history-go-fagverk-politikk.audit.v1.json"
      - "data/integrations/review/history-go-fagverk-politikk.audit-report.v1.json"
      - "data/integrations/review/history-go-fagverk-subject-content-baseline.v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-politics-corpus:
    name: Build and audit reviewed Politics chapters
    runs-on: ubuntu-latest

    steps:
      - name: Checkout AHA-EchoNet
        uses: actions/checkout@v5
        with:
          path: aha

      - name: Resolve reviewed History Go source
        id: source
        working-directory: aha
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const candidate = require('./data/integrations/candidates/history-go-fagverk-politikk.candidate.v1.json');
          if (!candidate.source_ref) throw new Error('Politics candidate lacks source_ref.');
          console.log(`commit=${candidate.source_ref}`);
          console.log(`expected_count=${candidate.entries.length}`);
          NODE

      - name: Checkout reviewed History Go source
        uses: actions/checkout@v5
        with:
          repository: Paradispartiet/History-Go
          ref: ${{ steps.source.outputs.commit }}
          path: history-go
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build Politics corpus and collision audit
        working-directory: aha
        run: |
          node scripts/build-history-go-fagverk-corpus.mjs \
            --history-go-root ../history-go \
            --subject politikk \
            --expected-count "${{ steps.source.outputs.expected_count }}" \
            --output artifacts/history-go-fagverk-politikk.audit.v1.json \
            --audit-output artifacts/history-go-fagverk-politikk.audit-report.v1.json

      - name: Verify candidate, artifact contract and checked-in parity
        working-directory: aha
        env:
          EXPECTED_SOURCE_REF: ${{ steps.source.outputs.commit }}
          EXPECTED_COUNT: ${{ steps.source.outputs.expected_count }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const generatedCorpusPath = 'artifacts/history-go-fagverk-politikk.audit.v1.json';
          const generatedAuditPath = 'artifacts/history-go-fagverk-politikk.audit-report.v1.json';
          const checkedCorpusPath = 'data/integrations/review/history-go-fagverk-politikk.audit.v1.json';
          const checkedAuditPath = 'data/integrations/review/history-go-fagverk-politikk.audit-report.v1.json';
          const candidatePath = 'data/integrations/candidates/history-go-fagverk-politikk.candidate.v1.json';
          const candidateAuditPath = 'data/integrations/candidates/history-go-fagverk-politikk.candidate-audit.v1.json';
          const corpus = JSON.parse(fs.readFileSync(generatedCorpusPath, 'utf8'));
          const audit = JSON.parse(fs.readFileSync(generatedAuditPath, 'utf8'));
          const candidate = JSON.parse(fs.readFileSync(candidatePath, 'utf8'));
          const candidateAudit = JSON.parse(fs.readFileSync(candidateAuditPath, 'utf8'));
          const expectedCount = Number(process.env.EXPECTED_COUNT);
          if (corpus.source_ref !== process.env.EXPECTED_SOURCE_REF) throw new Error(`Unexpected History Go source_ref: ${corpus.source_ref}`);
          if (corpus.subject_filter !== 'politikk') throw new Error('Corpus is not Politics-scoped.');
          if (corpus.entries.length !== expectedCount) throw new Error(`Expected ${expectedCount} entries, got ${corpus.entries.length}.`);
          if (corpus.entries.some((entry) => entry.subject_id !== 'politikk')) throw new Error('Non-Politics entry leaked into corpus.');
          if (corpus.entries.some((entry) => entry.provenance?.module_file_count !== 3 || entry.module_source_paths?.length !== 3)) throw new Error('Every Politics chapter must include all three registered module files.');
          if (corpus.entries.some((entry) => !entry.support_terms?.length)) throw new Error('Every Politics entry must contain module-derived support terms.');
          if (!audit.gate?.passed) throw new Error(`Coverage gate failed: ${(audit.gate?.errors || []).join(' ')}`);
          if (audit.coverage?.registered !== expectedCount || audit.coverage?.materialized !== expectedCount) throw new Error('Politics registry coverage differs from the reviewed candidate.');
          if (audit.chapters.some((chapter) => chapter.module_file_count !== 3 || !chapter.support_term_count)) throw new Error('Audit lacks full module depth for one or more chapters.');
          if (audit.activation_recommendation !== 'review_required_before_runtime_activation') throw new Error('Audit must remain review-gated before runtime activation.');
          const normalizeCandidate = (value) => {
            const copy = JSON.parse(JSON.stringify(value));
            delete copy.lifecycle_stage;
            delete copy.approval_required;
            delete copy.runtime_activation_allowed;
            return copy;
          };
          if (JSON.stringify(normalizeCandidate(candidate)) !== JSON.stringify(corpus)) throw new Error('Reviewed Politics candidate differs from its source rebuild.');
          if (JSON.stringify(normalizeCandidate(candidateAudit)) !== JSON.stringify(audit)) throw new Error('Reviewed Politics candidate audit differs from its source rebuild.');
          for (const [generatedPath, checkedPath] of [[generatedCorpusPath, checkedCorpusPath], [generatedAuditPath, checkedAuditPath]]) {
            if (!fs.existsSync(checkedPath)) throw new Error(`Missing checked-in review artifact: ${checkedPath}`);
            if (!fs.readFileSync(generatedPath).equals(fs.readFileSync(checkedPath))) throw new Error(`Checked-in review artifact is stale: ${checkedPath}`);
          }
          console.log(`Verified reviewed Politics corpus: ${corpus.entries.length} chapters; ${audit.term_collision_summary.high_risk} high-risk terms require review.`);
          NODE

      - name: Upload Politics audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aha-politics-fagverk-audit
          path: |
            aha/artifacts/history-go-fagverk-politikk.audit.v1.json
            aha/artifacts/history-go-fagverk-politikk.audit-report.v1.json
          if-no-files-found: error
          retention-days: 14
