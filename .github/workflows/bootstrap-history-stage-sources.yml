name: Bootstrap History review source staging

on:
  push:
    branches:
      - review/history-fagverk-v1

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: review/history-fagverk-v1
      - name: Extract source archive from bootstrap workflow
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import re
          import tarfile
          from pathlib import Path

          workflow = Path('.github/workflows/bootstrap-history-review-sources.yml').read_text(encoding='utf-8')
          chunks = re.findall(r"printf '%s' '([^']+)' (?:>|>>) /tmp/history-review-sources\.b64", workflow)
          if len(chunks) != 2:
              raise SystemExit(f'Expected two archive chunks, found {len(chunks)}.')
          payload = base64.b64decode(''.join(chunks))
          digest = hashlib.sha256(payload).hexdigest()
          expected = '02cf9c115f1210cebf7bcbb248eb502fb5dffc9dfbea42a3d8ff953ec44c8122'
          if digest != expected:
              raise SystemExit(f'Archive digest mismatch: {digest}')
          archive = Path('/tmp/history-review-sources.tar.gz')
          archive.write_bytes(payload)
          with tarfile.open(archive, 'r:gz') as handle:
              handle.extractall('.')
          PY

      - name: Validate source syntax and JSON
        run: |
          node --check scripts/lib/history-fagverk-scoring.mjs
          node --check scripts/build-history-fagverk-term-policy.mjs
          node --check scripts/build-history-fagverk-expansion-review.mjs
          node --check scripts/evaluate-history-fagverk-policy.mjs
          node --check scripts/compare-history-fixture-corrections.mjs
          node -e "for (const p of ['data/evaluation/aha-history-fagverk-evaluation-matrix.v1.json','data/evaluation/aha-history-fixture-corrections.v1.json','data/integrations/review/history-go-fagverk-subject-approval-registry.v1.json']) JSON.parse(require('fs').readFileSync(p,'utf8'))"

      - name: Commit review sources only
        run: |
          git add \
            scripts/lib/history-fagverk-scoring.mjs \
            scripts/build-history-fagverk-term-policy.mjs \
            scripts/build-history-fagverk-expansion-review.mjs \
            scripts/evaluate-history-fagverk-policy.mjs \
            scripts/compare-history-fixture-corrections.mjs \
            data/evaluation/aha-history-fagverk-evaluation-matrix.v1.json \
            data/evaluation/aha-history-fixture-corrections.v1.json \
            data/integrations/review/history-go-fagverk-subject-approval-registry.v1.json \
            tests/aha-history-fagverk-review.test.cjs \
            .github/workflows/aha-history-fagverk-review.yml \
            docs/AHA_HISTORY_FAGVERK_REVIEW_V1.md
          if git diff --cached --quiet; then
            echo 'History review sources are already staged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Stage inspectable History Fagverk review sources'
          git push origin HEAD:review/history-fagverk-v1
