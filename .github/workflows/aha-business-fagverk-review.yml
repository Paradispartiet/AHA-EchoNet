name: AHA Business Fagverk review

on:
  pull_request:
    paths:
      - "scripts/lib/business-fagverk-scoring.mjs"
      - "scripts/build-business-fagverk-term-policy.mjs"
      - "scripts/build-business-fagverk-expansion-review.mjs"
      - "scripts/evaluate-business-fagverk-policy.mjs"
      - "scripts/compare-business-fixture-corrections.mjs"
      - "data/integrations/review/history-go-fagverk-naeringsliv.policy-config.v1.json"
      - "tests/aha-business-fagverk-review.test.cjs"
      - "tests/aha-fagverk-subject-approvals.test.cjs"
      - "data/evaluation/aha-business-fagverk-evaluation-matrix.v1.json"
      - "data/evaluation/aha-business-fagverk-evaluation-report.v1.json"
      - "data/evaluation/aha-business-fixture-corrections.v1.json"
      - "data/evaluation/aha-business-fixture-correction-report.v1.json"
      - "data/integrations/candidates/history-go-fagverk-naeringsliv.candidate.v1.json"
      - "data/integrations/candidates/history-go-fagverk-naeringsliv.candidate-audit.v1.json"
      - "data/integrations/review/history-go-fagverk-naeringsliv.*.v1.json"
      - "data/integrations/review/history-go-fagverk-subject-approval-registry.v1.json"
      - "data/integrations/approvals/history-go-fagverk-naeringsliv.approved.v1.json"
      - "data/integrations/history-go-fagverk-release.approved.json"
      - "data/integrations/history-go-fagverk-release.runtime-active.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-business-review:
    name: Rebuild complete Business review package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Rebuild Business review evidence
        run: |
          node scripts/build-business-fagverk-term-policy.mjs
          node scripts/evaluate-business-fagverk-policy.mjs
          node scripts/compare-business-fixture-corrections.mjs
          node tests/aha-business-fagverk-review.test.cjs

      - name: Upload Business review evidence
        uses: actions/upload-artifact@v4
        with:
          name: aha-business-fagverk-review
          path: |
            data/evaluation/aha-business-fagverk-evaluation-report.v1.json
            data/evaluation/aha-business-fixture-correction-report.v1.json
            data/integrations/review/history-go-fagverk-naeringsliv.term-policy.v1.json
          if-no-files-found: error
          retention-days: 14

      - name: Materialize reviewed Business artifacts on review branch
        if: github.event_name == 'pull_request' && github.head_ref == 'review/naeringsliv-fagverk-3-16-0-20260916'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/evaluation/aha-business-fagverk-evaluation-report.v1.json \
            data/evaluation/aha-business-fixture-correction-report.v1.json \
            data/integrations/review/history-go-fagverk-naeringsliv.term-policy.v1.json
          if git diff --cached --quiet; then
            echo "Business review artifacts already materialized."
          else
            git commit -m "Materialize Næringsliv 3.16.0 review artifacts"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Verify checked-in review parity and runtime isolation
        run: |
          git diff --exit-code -- \
            data/evaluation/aha-business-fagverk-evaluation-report.v1.json \
            data/evaluation/aha-business-fixture-correction-report.v1.json \
            data/integrations/review/history-go-fagverk-naeringsliv.term-policy.v1.json
          git diff --exit-code -- \
            data/integrations/approvals/history-go-fagverk-naeringsliv.approved.v1.json \
            data/integrations/history-go-fagverk-release.approved.json \
            data/integrations/history-go-fagverk-release.runtime-active.json \
            data/integrations/runtime/history-go-fagverk-naeringsliv.corpus.v1.json \
            data/integrations/runtime/history-go-fagverk-naeringsliv.policy.v1.json
