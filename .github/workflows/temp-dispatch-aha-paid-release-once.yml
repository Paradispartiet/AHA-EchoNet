name: TEMP dispatch AHA paid release once

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.head_ref == 'agent/v2-paid-release-dispatch-once'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch paid release on canonical main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body='{"ref":"main","inputs":{"live_mode":"release","live_cost_ack":"RUN_AHA_LIVE_RELEASE"}}'
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/aha-projection-product-browser-evaluation-v2.yml/dispatches" \
            -d "${body}"
          echo "Paid release dispatch accepted."
