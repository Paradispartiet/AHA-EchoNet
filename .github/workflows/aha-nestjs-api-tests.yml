name: AHA NestJS API foundation

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/api/**"
      - "tests/aha-nestjs-api-foundation.test.cjs"
      - ".github/workflows/aha-nestjs-api-tests.yml"
  push:
    branches:
      - main
    paths:
      - "backend/api/**"
      - "tests/aha-nestjs-api-foundation.test.cjs"
      - ".github/workflows/aha-nestjs-api-tests.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  api-foundation:
    name: NestJS API build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api

    steps:
      - name: Checkout repository branch head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generate initial lockfile when absent
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi

      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build strict TypeScript service
        run: npm run build

      - name: Run NestJS foundation tests
        run: node --test test/*.test.mjs

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: aha-nestjs-api-package-lock
          path: backend/api/package-lock.json
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated lockfile to PR branch once
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [ -z "$(git status --porcelain -- backend/api/package-lock.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/api/package-lock.json
          git commit -m "Lock NestJS API dependencies"
          git push origin "HEAD:${HEAD_BRANCH}"
