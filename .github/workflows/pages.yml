name: Deploy AHA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stamp exact frontend revision
        run: >-
          sed -i
          "s#global.AHA_FRONTEND_BUILD_SHA = global.AHA_FRONTEND_BUILD_SHA || \"local\"; // AHA_FRONTEND_REVISION_STAMP#global.AHA_FRONTEND_BUILD_SHA = \"$GITHUB_SHA\"; // AHA_FRONTEND_REVISION_STAMP#"
          js/ahaChatInsightPipeline.js

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy exact artifact
        id: deployment
        uses: actions/deploy-pages@v4
