name: Bootstrap Politics Fagverk v2 review

on:
  push:
    branches:
      - review/politics-fagverk-v2-drift

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[skip politics bootstrap]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AHA review branch
        uses: actions/checkout@v5
        with:
          ref: review/politics-fagverk-v2-drift
          fetch-depth: 0

      - name: Resolve observed History Go source
        id: source
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const observed = require('./data/integrations/history-go-fagverk-release.observed.json');
          const candidate = require('./data/integrations/candidates/history-go-fagverk-politikk.candidate.v1.json');
          if (candidate.source_ref !== observed.source_commit) throw new Error('Politics candidate is not bound to the observed release.');
          console.log(`commit=${observed.source_commit}`);
          console.log(`expected_count=${candidate.entries.length}`);
          NODE

      - name: Checkout observed History Go source
        uses: actions/checkout@v5
        with:
          repository: Paradispartiet/History-Go
          ref: ${{ steps.source.outputs.commit }}
          path: history-go
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Rebuild Politics review corpus and audit
        run: |
          node scripts/build-history-go-fagverk-corpus.mjs \
            --history-go-root history-go \
            --subject politikk \
            --expected-count "${{ steps.source.outputs.expected_count }}" \
            --output data/integrations/review/history-go-fagverk-politikk.audit.v1.json \
            --audit-output data/integrations/review/history-go-fagverk-politikk.audit-report.v1.json

      - name: Rebuild Politics policy and evaluation gates
        run: |
          node scripts/build-politics-fagverk-term-policy.mjs
          node scripts/evaluate-politics-fagverk-policy.mjs
          node scripts/compare-politics-fixture-corrections.mjs
          node scripts/build-politics-fagverk-release-drift.mjs

      - name: Verify materialized review boundary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const observed = require('./data/integrations/history-go-fagverk-release.observed.json');
          const candidate = require('./data/integrations/candidates/history-go-fagverk-politikk.candidate.v1.json');
          const corpus = require('./data/integrations/review/history-go-fagverk-politikk.audit.v1.json');
          const audit = require('./data/integrations/review/history-go-fagverk-politikk.audit-report.v1.json');
          const policy = require('./data/integrations/review/history-go-fagverk-politikk.term-policy.v1.json');
          const evaluation = require('./data/evaluation/aha-politics-fagverk-evaluation-report.v1.json');
          const corrections = require('./data/evaluation/aha-politics-fixture-correction-report.v1.json');
          const drift = require('./data/integrations/review/history-go-fagverk-politikk.release-drift.v1.json');
          const approved = require('./data/integrations/history-go-fagverk-release.approved.json');
          const active = require('./data/integrations/history-go-fagverk-release.runtime-active.json');
          if (corpus.source_ref !== observed.source_commit || corpus.source_ref !== candidate.source_ref) throw new Error('Review corpus source mismatch.');
          if (corpus.content_sha256 !== candidate.content_sha256) throw new Error('Review corpus digest mismatch.');
          if (!audit.gate?.passed) throw new Error('Politics audit gate failed.');
          if (policy.source_ref !== candidate.source_ref || policy.approval_required !== true || policy.runtime_activation_allowed !== false) throw new Error('Politics policy boundary failed.');
          if (evaluation.status !== 'passed_review_gate' || evaluation.summary?.passed !== 34 || evaluation.summary?.failed !== 0) throw new Error('Politics evaluation gate failed.');
          if (corrections.status !== 'passed_correction_gate' || corrections.summary?.passed !== 16 || corrections.summary?.failed !== 0) throw new Error('Politics correction gate failed.');
          if (drift.status !== 'source_rebased_no_semantic_drift' || drift.runtime_activation_allowed !== false) throw new Error('Politics null-drift gate failed.');
          if (approved.approved_source_commit === observed.source_commit || active.active_source_commit === observed.source_commit) throw new Error('Observed release must not become approved or active during review materialization.');
          const runtime = fs.readFileSync('backend/aha_engine/app/engine/fagverk_grounding.py', 'utf8');
          if (runtime.includes('data/integrations/review') || runtime.includes('data/integrations/candidates')) throw new Error('Review data leaked into runtime.');
          NODE

      - name: Commit materialized review artifacts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            data/integrations/review/history-go-fagverk-politikk.audit.v1.json \
            data/integrations/review/history-go-fagverk-politikk.audit-report.v1.json \
            data/integrations/review/history-go-fagverk-politikk.term-policy.v1.json \
            data/integrations/review/history-go-fagverk-politikk.release-drift.v1.json \
            data/evaluation/aha-politics-fagverk-evaluation-report.v1.json \
            data/evaluation/aha-politics-fixture-correction-report.v1.json
          if git diff --cached --quiet; then
            echo "Politics review artifacts already current."
          else
            git commit -m "Materialize Politics Fagverk v2 review [skip politics bootstrap]"
            git push origin HEAD:review/politics-fagverk-v2-drift
          fi
