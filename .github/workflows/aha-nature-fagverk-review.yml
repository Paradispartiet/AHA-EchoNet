name: AHA Nature Fagverk review

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/lib/nature-fagverk-scoring.mjs"
      - "scripts/build-nature-fagverk-term-policy.mjs"
      - "scripts/build-nature-fagverk-expansion-review.mjs"
      - "scripts/evaluate-nature-fagverk-policy.mjs"
      - "scripts/compare-nature-fixture-corrections.mjs"
      - "tests/aha-nature-fagverk-review.test.cjs"
      - "data/evaluation/aha-nature-fagverk-evaluation-matrix.v1.json"
      - "data/evaluation/aha-nature-fagverk-evaluation-report.v1.json"
      - "data/evaluation/aha-nature-fixture-corrections.v1.json"
      - "data/evaluation/aha-nature-fixture-correction-report.v1.json"
      - "data/integrations/candidates/history-go-fagverk-natur.candidate.v1.json"
      - "data/integrations/candidates/history-go-fagverk-natur.candidate-audit.v1.json"
      - "data/integrations/review/history-go-fagverk-natur.*.v1.json"
      - "data/integrations/review/history-go-fagverk-subject-approval-registry.v1.json"
      - "data/integrations/approvals/history-go-fagverk-natur.approved.v1.json"
      - "data/integrations/history-go-fagverk-release.approved.json"
      - "data/integrations/history-go-fagverk-release.runtime-active.json"
      - ".github/workflows/aha-nature-fagverk-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-nature-review:
    name: Rebuild complete Nature review package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Rebuild complete Nature review evidence
        run: |
          node scripts/build-nature-fagverk-term-policy.mjs
          node scripts/build-nature-fagverk-expansion-review.mjs
          node scripts/evaluate-nature-fagverk-policy.mjs
          node scripts/compare-nature-fixture-corrections.mjs
          node scripts/build-history-go-fagverk-subject-approvals.mjs --subject natur
          node tests/aha-nature-fagverk-review.test.cjs

      - name: Verify checked-in parity and runtime isolation
        run: |
          git diff --exit-code -- \
            data/evaluation/aha-nature-fagverk-evaluation-report.v1.json \
            data/evaluation/aha-nature-fixture-correction-report.v1.json \
            data/integrations/approvals/history-go-fagverk-natur.approved.v1.json \
            data/integrations/review/history-go-fagverk-natur.expansion-review.v1.json \
            data/integrations/review/history-go-fagverk-natur.term-policy.v1.json
          git diff --exit-code -- \
            data/integrations/history-go-fagverk-release.approved.json \
            data/integrations/history-go-fagverk-release.runtime-active.json

      - name: Upload Nature review evidence
        uses: actions/upload-artifact@v4
        with:
          name: aha-nature-fagverk-review
          path: |
            data/evaluation/aha-nature-fagverk-evaluation-report.v1.json
            data/evaluation/aha-nature-fixture-correction-report.v1.json
            data/integrations/approvals/history-go-fagverk-natur.approved.v1.json
            data/integrations/review/history-go-fagverk-natur.expansion-review.v1.json
            data/integrations/review/history-go-fagverk-natur.term-policy.v1.json
          if-no-files-found: error
          retention-days: 14
