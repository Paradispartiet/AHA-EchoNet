name: Bootstrap Politics Fagverk v2 runtime

on:
  push:
    branches:
      - activation/politics-fagverk-v2-runtime

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout activation branch
        uses: actions/checkout@v5
        with:
          ref: activation/politics-fagverk-v2-runtime

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Materialize approved runtime artifacts
        run: node scripts/build-history-go-fagverk-runtime-activation.mjs

      - name: Verify write scope and activation contract
        run: |
          node tests/aha-fagverk-runtime-activation.test.cjs
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            data/integrations/history-go-fagverk-release.approved.json
            data/integrations/history-go-fagverk-release.runtime-active.json
            data/integrations/runtime/history-go-fagverk-politikk.corpus.v1.json
            data/integrations/runtime/history-go-fagverk-politikk.policy.v1.json
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected materialization diff:\n%s\n' "${changed[*]}"
            exit 1
          fi
          git diff --exit-code -- data/integrations/history-go-fagverk-corpus.v1.json

      - name: Commit materialized runtime artifacts
        run: |
          if git diff --quiet; then
            echo "Runtime artifacts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/integrations/history-go-fagverk-release.approved.json \
            data/integrations/history-go-fagverk-release.runtime-active.json \
            data/integrations/runtime/history-go-fagverk-politikk.corpus.v1.json \
            data/integrations/runtime/history-go-fagverk-politikk.policy.v1.json
          git commit -m "Materialize Politics Fagverk v2 runtime"
          git push origin HEAD:activation/politics-fagverk-v2-runtime
