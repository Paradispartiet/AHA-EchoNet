name: AHA History Fagverk review

on:
  pull_request:
    paths:
      - "scripts/lib/history-fagverk-scoring.mjs"
      - "scripts/build-history-fagverk-term-policy.mjs"
      - "scripts/build-history-fagverk-expansion-review.mjs"
      - "scripts/evaluate-history-fagverk-policy.mjs"
      - "scripts/compare-history-fixture-corrections.mjs"
      - "tests/aha-history-fagverk-review.test.cjs"
      - "data/evaluation/aha-history-fagverk-evaluation-matrix.v1.json"
      - "data/evaluation/aha-history-fagverk-evaluation-report.v1.json"
      - "data/evaluation/aha-history-fixture-corrections.v1.json"
      - "data/evaluation/aha-history-fixture-correction-report.v1.json"
      - "data/integrations/candidates/history-go-fagverk-historie.candidate.v1.json"
      - "data/integrations/candidates/history-go-fagverk-historie.candidate-audit.v1.json"
      - "data/integrations/review/history-go-fagverk-historie.*.v1.json"
      - "data/integrations/review/history-go-fagverk-subject-approval-registry.v1.json"
      - "data/integrations/approvals/history-go-fagverk-historie.approved.v1.json"
      - "data/integrations/history-go-fagverk-release.approved.json"
      - "data/integrations/history-go-fagverk-release.runtime-active.json"
      - ".github/workflows/aha-history-fagverk-review.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-history-review:
    name: Rebuild complete History review package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Rebuild complete History review evidence
        run: |
          node scripts/build-history-fagverk-term-policy.mjs
          node scripts/evaluate-history-fagverk-policy.mjs
          node scripts/compare-history-fixture-corrections.mjs
          node tests/aha-history-fagverk-review.test.cjs

      - name: Upload History review evidence
        uses: actions/upload-artifact@v4
        with:
          name: aha-history-fagverk-review
          path: |
            data/evaluation/aha-history-fagverk-evaluation-report.v1.json
            data/evaluation/aha-history-fixture-correction-report.v1.json
            data/integrations/review/history-go-fagverk-historie.term-policy.v1.json
          if-no-files-found: error
          retention-days: 14

      - name: Materialize reviewed History artifacts on review branch
        if: github.event_name == 'pull_request' && github.head_ref == 'review/historie-fagverk-3-16-0-20260916'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/evaluation/aha-history-fagverk-evaluation-report.v1.json \
            data/evaluation/aha-history-fixture-correction-report.v1.json \
            data/integrations/review/history-go-fagverk-historie.term-policy.v1.json
          if git diff --cached --quiet; then
            echo "History review artifacts already materialized."
          else
            git commit -m "Materialize History 3.16.0 review artifacts"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Verify checked-in review parity and runtime isolation
        run: |
          git diff --exit-code -- \
            data/evaluation/aha-history-fagverk-evaluation-report.v1.json \
            data/evaluation/aha-history-fixture-correction-report.v1.json \
            data/integrations/review/history-go-fagverk-historie.term-policy.v1.json
          git diff --exit-code -- \
            data/integrations/approvals/history-go-fagverk-historie.approved.v1.json \
            data/integrations/history-go-fagverk-release.approved.json \
            data/integrations/history-go-fagverk-release.runtime-active.json \
            data/integrations/runtime/history-go-fagverk-historie.corpus.v1.json \
            data/integrations/runtime/history-go-fagverk-historie.policy.v1.json
