name: AHA Politics fixture corrections

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/compare-politics-fixture-corrections.mjs"
      - "scripts/lib/politics-fagverk-scoring.mjs"
      - "scripts/build-politics-fagverk-term-policy.mjs"
      - "data/integrations/review/history-go-fagverk-politikk.term-policy.v1.json"
      - "data/evaluation/aha-politics-fixture-corrections.v1.json"
      - "data/evaluation/aha-politics-fixture-correction-report.v1.json"
      - "tests/aha-politics-fixture-corrections.test.cjs"
      - "docs/AHA_POLITICS_FIXTURE_CORRECTIONS_V1.md"
      - ".github/workflows/aha-politics-fixture-corrections.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-corrections:
    name: Compare legacy fixtures with Politics corrections
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Preserve checked-in correction report
        run: cp data/evaluation/aha-politics-fixture-correction-report.v1.json /tmp/politics-correction-report.checked.json
      - name: Rebuild correction comparison report
        run: node scripts/compare-politics-fixture-corrections.mjs
      - name: Verify 8-of-8 correction candidate and parity
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const reportPath = 'data/evaluation/aha-politics-fixture-correction-report.v1.json';
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const expected = { total: 8, passed: 8, failed: 0, exact_legacy_baselines: 6, qualitative_targets: 2, validation_errors: 0 };
          for (const [key, value] of Object.entries(expected)) if (report.summary?.[key] !== value) throw new Error(`Unexpected correction ${key}`);
          if (report.summary?.comparisons?.correct !== 8 || Object.keys(report.summary.comparisons).length !== 1) throw new Error(`Unexpected comparison split: ${JSON.stringify(report.summary.comparisons)}`);
          if (report.version !== '1.1.0' || report.policy_version !== '1.1.0' || report.status !== 'passed_correction_gate' || report.runtime_activation_allowed !== false) throw new Error('Unexpected correction boundary.');
          if (!fs.readFileSync(reportPath).equals(fs.readFileSync('/tmp/politics-correction-report.checked.json'))) throw new Error('Checked-in correction report is stale.');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: aha-politics-fixture-corrections
          path: data/evaluation/aha-politics-fixture-correction-report.v1.json
          retention-days: 14
