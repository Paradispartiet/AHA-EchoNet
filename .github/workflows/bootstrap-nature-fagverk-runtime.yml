name: Bootstrap Nature Fagverk runtime activation

on:
  push:
    branches: [activation/natur-fagverk-v1-runtime]
    paths:
      - ".github/workflows/bootstrap-nature-fagverk-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: activation/natur-fagverk-v1-runtime
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Nature runtime source changes
        run: python scripts/bootstrap-nature-fagverk-runtime.py

      - name: Materialize Nature runtime artifacts
        run: node scripts/build-history-go-fagverk-runtime-activation.mjs

      - name: Validate Node runtime contract
        run: |
          node tests/aha-fagverk-runtime-activation.test.cjs
          node tests/aha-fagverk-subject-approvals.test.cjs

      - name: Install Python dependencies
        working-directory: backend/aha_engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Python runtime and cross-subject behavior
        working-directory: backend/aha_engine
        run: python -m pytest tests/test_fagverk_grounding.py tests/test_history_fagverk_runtime.py tests/test_nature_fagverk_runtime.py

      - name: Verify exact activation scope
        env:
          ALLOWED_JSON: '[".github/workflows/aha-fagverk-runtime-activation.yml",".github/workflows/bootstrap-nature-fagverk-runtime.yml","backend/aha_engine/app/engine/fagverk_grounding.py","backend/aha_engine/tests/test_fagverk_grounding.py","backend/aha_engine/tests/test_nature_fagverk_runtime.py","data/integrations/history-go-fagverk-release.approved.json","data/integrations/history-go-fagverk-release.runtime-active.json","data/integrations/runtime/history-go-fagverk-natur.corpus.v1.json","data/integrations/runtime/history-go-fagverk-natur.policy.v1.json","data/integrations/runtime/history-go-fagverk-runtime-registry.v1.json","docs/AHA_NATURE_FAGVERK_RUNTIME_V1.md","scripts/bootstrap-nature-fagverk-runtime.py","scripts/build-history-go-fagverk-runtime-activation.mjs","tests/aha-fagverk-runtime-activation.test.cjs"]'
        run: |
          rm .github/workflows/bootstrap-nature-fagverk-runtime.yml
          rm scripts/bootstrap-nature-fagverk-runtime.py
          node - <<'NODE'
          const { execFileSync } = require("child_process");
          const allowed = new Set(JSON.parse(process.env.ALLOWED_JSON));
          const status = execFileSync("git", ["status", "--porcelain"], { encoding: "utf8" });
          const actual = status.trimEnd().split(/\n/).filter(Boolean).map((line) => line.slice(3));
          const unexpected = actual.filter((file) => !allowed.has(file));
          const missing = [...allowed].filter((file) => !actual.includes(file));
          if (unexpected.length || missing.length) {
            console.error({ unexpected, missing, actual });
            process.exit(1);
          }
          console.log(`Nature runtime activation scope verified: ${actual.length} files.`);
          NODE

      - name: Commit Nature runtime activation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Activate complete Nature Fagverk runtime"
          git push origin HEAD:activation/natur-fagverk-v1-runtime
