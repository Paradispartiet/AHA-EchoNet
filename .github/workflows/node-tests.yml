name: AHA Node tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  node-tests:
    name: Node test suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Temporary branch-level diagnostics for PR #793. The remaining failure is
      # inside files 181-210. Remove these split steps before merge.
      - name: Diagnose suite chunk 181-190
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find tests -maxdepth 1 -type f \( -name '*.test.cjs' -o -name '*.test.mjs' -o -name '*.cjs' \) ! -name 'aha-python-engine-smoke.test.cjs' | sort)
          for file in "${files[@]:180:10}"; do echo "RUN $file"; node "$file"; done

      - name: Diagnose suite chunk 191-200
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find tests -maxdepth 1 -type f \( -name '*.test.cjs' -o -name '*.test.mjs' -o -name '*.cjs' \) ! -name 'aha-python-engine-smoke.test.cjs' | sort)
          for file in "${files[@]:190:10}"; do echo "RUN $file"; node "$file"; done

      - name: Diagnose suite chunk 201-210
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find tests -maxdepth 1 -type f \( -name '*.test.cjs' -o -name '*.test.mjs' -o -name '*.cjs' \) ! -name 'aha-python-engine-smoke.test.cjs' | sort)
          for file in "${files[@]:200:10}"; do echo "RUN $file"; node "$file"; done

      - name: Run deterministic Node test suite
        run: npm test
