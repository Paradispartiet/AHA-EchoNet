name: AHA DB-03 backup smoke test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/aha-db03-*-backup*.yml'
      - '.github/workflows/aha-db03-backup-smoke.yml'
      - 'scripts/aha-db03-backup-github.sh'
      - 'scripts/aha-db03-verify-ipad.sh'
      - 'tests/aha-db03-backup-*.sh'
      - 'tests/aha-db03-*.test.cjs'

permissions:
  contents: read

jobs:
  smoke:
    name: Encrypt and restore synthetic PostgreSQL data
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age jq
      - name: Test safety gates and an isolated restore
        run: |
          node tests/aha-db03-backup-github-manual.test.cjs
          node tests/aha-db03-verify-ipad.test.cjs
          bash tests/aha-db03-backup-smoke.sh
