name: Kunstrommet V2 checks

on:
  pull_request:
    paths:
      - 'kunstrommet-v2.html'
      - 'kunstrommet.html'
      - 'js/ahaKunstrommetV2.js'
      - 'css/aha-kunstrommet-v2.css'
      - 'tests/aha-kunstrommet-v2-contract.test.cjs'
      - 'tests/browser/aha-kunstrommet-v2.spec.cjs'
      - '.github/workflows/kunstrommet-v2.yml'
  workflow_dispatch:

jobs:
  node-contract:
    name: Local-only editor contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: node --check js/ahaKunstrommetV2.js
      - run: node tests/aha-kunstrommet-v2-contract.test.cjs

  browser:
    name: V2 browser – Chromium and iPad WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/browser/aha-kunstrommet-v2.spec.cjs --config=playwright.config.cjs
      - name: Test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kunstrommet-v2-playwright
          path: test-results/
          retention-days: 7
