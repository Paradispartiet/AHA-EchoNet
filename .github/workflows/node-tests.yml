name: AHA Node tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  node-tests:
    name: Node test suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run deterministic Node test suite
        run: npm test


      - name: Diagnose current-code reprojection of archived PR 894 evidence
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/v2-semantic-role-reprojection-proof'
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_ARTIFACT_ID: "9491725428"
        run: |
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARCHIVE_ARTIFACT_ID}/zip" \
            -o /tmp/aha-review-archive.zip
          unzip -p /tmp/aha-review-archive.zip aha-projection-product-live-browser-evaluation-v2.json > /tmp/aha-live-review.json
          node scripts/diagnose-aha-current-review-reprojection.cjs /tmp/aha-live-review.json
