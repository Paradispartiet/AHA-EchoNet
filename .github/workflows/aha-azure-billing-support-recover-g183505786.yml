name: AHA Azure billing support recovery

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/aha-azure-billing-support-recover-g183505786.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  recover-ticket:
    name: Recover Azure billing support ticket G183505786
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: aha-canonical-production-infra

    steps:
      - name: Azure OIDC login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Read accepted billing support ticket
        shell: bash
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          ticket_name="aha-unexpected-invoice-g183505786"
          ticket_url="https://management.azure.com/subscriptions/$AZURE_SUBSCRIPTION_ID/providers/Microsoft.Support/supportTickets/$ticket_name?api-version=2024-04-01"
          ticket="$RUNNER_TEMP/ticket.json"

          for attempt in {1..24}; do
            if az rest --method get --url "$ticket_url" --only-show-errors > "$ticket" 2>/dev/null; then
              ticket_id="$(jq -r '.properties.supportTicketId // empty' "$ticket")"
              status="$(jq -r '.properties.status // empty' "$ticket")"
              if [[ -n "$ticket_id" ]]; then
                echo "Azure billing support ticket: $ticket_id ($status)"
                {
                  echo "### Azure billing support ticket"
                  echo ""
                  echo "- Invoice: **G183505786**"
                  echo "- Support ticket: **$ticket_id**"
                  echo "- Status: **$status**"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            sleep 5
          done

          echo "The accepted support request has not materialized as a readable ticket." >&2
          exit 1
