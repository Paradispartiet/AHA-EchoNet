<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <title>Sources / Ingest Audit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/aha-chat.css" />
  <link rel="stylesheet" href="css/aha-dashboard.css" />
  <link rel="stylesheet" href="css/aha-sources.css" />
  <link rel="stylesheet" href="css/aha-system-surfaces.css" />
  <link rel="stylesheet" href="css/aha-global-nav.css" />
</head>
<body>
  <a class="aha-skip-link" href="#sources-main">Hopp til hovedinnhold</a>
  <div id="aha-global-nav"></div>
  <main id="sources-main" class="aha-dashboard aha-shell-wide aha-system-surface aha-sources-page" tabindex="-1">
    <section class="aha-panel aha-module-shell aha-system-hero">
      <header class="aha-module-shell-header">
        <div>
          <p class="eyebrow">AHA System</p>
          <h1>Sources / Ingest Audit</h1>
          <p class="aha-module-purpose">Lokal oversikt over source events og ingest-resultater. Dette aktiverer ikke sync, deling eller EchoNet.</p>
        </div>
      </header>
    </section>
    <section class="aha-panel aha-system-status-panel" aria-labelledby="sources-summary-title"><h2 id="sources-summary-title">Summary</h2><div id="sources-summary"></div></section>
    <section class="aha-panel aha-system-secondary-panel" aria-labelledby="sources-filter-title"><h2 id="sources-filter-title">Filter</h2><div id="sources-filters"></div></section>
    <section class="aha-panel aha-system-list-panel" aria-labelledby="sources-events-title"><h2 id="sources-events-title">Source events</h2><div id="sources-events"></div></section>
    <section class="aha-panel aha-system-secondary-panel" aria-labelledby="sources-links-title"><h2 id="sources-links-title">Insight-linking / audit</h2><div id="sources-insight-links"></div></section>
  </main>
  <script src="js/ahaModuleApi.js"></script>
  <script src="js/ahaSources.js"></script>
  <script src="js/ahaSourcesAudit.js"></script>
  <script src="js/ahaProvenanceSurface.js"></script>
  <script src="js/ahaModules.js"></script>
  <script src="js/ahaGlobalNav.js"></script>
</body>
</html>
