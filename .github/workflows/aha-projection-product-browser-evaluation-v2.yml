name: AHA projection product browser evaluation v2

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      live_mode:
        description: "Paid model verification mode"
        required: true
        default: offline
        type: choice
        options:
          - offline
          - smoke
          - release
      live_cost_ack:
        description: "For smoke enter RUN_AHA_LIVE_SMOKE; for release enter RUN_AHA_LIVE_RELEASE"
        required: false
        default: ""
        type: string

jobs:
  browser-evaluation:
    name: Browser corpus and iPad WebKit gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Classify browser verification scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          REQUESTED_MODE: ${{ inputs.live_mode }}
        run: |
          mode="offline"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then mode="${REQUESTED_MODE:-offline}"; fi
          if [[ "$mode" != "offline" && "$GIT_REF" != "refs/heads/main" ]]; then
            echo "Paid model verification is allowed only from the deployed main branch." >&2
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "wait_for_backend=$([[ "$mode" == "offline" ]] && echo 0 || echo 1)" >> "$GITHUB_OUTPUT"
          echo "Automatic pull-request and push runs are model-call free; paid modes require explicit workflow dispatch."
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Plan and authorize live model budget
        id: budget
        env:
          AHA_LIVE_PRODUCT_MODE: ${{ steps.scope.outputs.mode }}
          AHA_LIVE_COST_ACK: ${{ inputs.live_cost_ack }}
          AHA_LIVE_MODEL_NAME: gpt-4.1-mini
        run: node scripts/plan-aha-live-model-budget.mjs
      - run: npm ci
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Wait for exact backend deployment
        if: steps.scope.outputs.wait_for_backend == '1'
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          HEALTH_URL: https://aha-agent-7a3y.onrender.com/api/aha-agent/health
        run: |
          for attempt in $(seq 1 80); do
            deployed_sha="$(curl --fail --silent --show-error --max-time 20 "$HEALTH_URL" | jq -r '.runtime.backend_build_sha // empty' || true)"
            if [[ "$deployed_sha" == "$EXPECTED_SHA" ]]; then
              echo "Render is serving the exact main SHA: $EXPECTED_SHA"
              exit 0
            fi
            echo "Waiting for Render deployment ($attempt/80): ${deployed_sha:-unavailable}"
            sleep 15
          done
          echo "Render did not deploy the exact main SHA within 20 minutes." >&2
          exit 1
      - name: Run real browser product evaluation
        run: npm run test:projection-products:browser
        env:
          AHA_LIVE_PRODUCT_MODE: ${{ steps.budget.outputs.mode }}
          AHA_LIVE_MAX_CHAT_REQUESTS: ${{ steps.budget.outputs.max_chat_requests }}
          AHA_LIVE_MAX_SYNTHESIS_REQUESTS: ${{ steps.budget.outputs.max_synthesis_requests }}
          AHA_LIVE_SYNTHESIS_ATTEMPT_LIMIT: ${{ steps.budget.outputs.synthesis_attempt_limit }}
          AHA_LIVE_MAX_MODEL_CALLS: ${{ steps.budget.outputs.max_model_calls }}
          AHA_LIVE_BUDGET_ID: ${{ github.run_id }}:${{ github.run_attempt }}:${{ steps.budget.outputs.mode }}
      - name: Upload browser evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aha-projection-product-browser-evaluation-v2
          path: |
            cost-evidence/
            test-results/
          if-no-files-found: warn
