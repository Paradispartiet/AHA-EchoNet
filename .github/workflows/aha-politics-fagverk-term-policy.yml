name: AHA Politics Fagverk term policy

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/build-politics-fagverk-term-policy.mjs"
      - "scripts/evaluate-politics-fagverk-policy.mjs"
      - "data/evaluation/aha-politics-fagverk-evaluation-matrix.v1.json"
      - ".github/workflows/aha-politics-fagverk-term-policy.yml"
      - "docs/AHA_POLITICS_FAGVERK_TERM_POLICY_V1.md"
      - "tests/aha-politics-fagverk-term-policy.test.cjs"
      - "data/integrations/review/history-go-fagverk-politikk.term-policy.v1.json"
      - "data/evaluation/aha-politics-fagverk-evaluation-report.v1.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  politics-term-policy:
    name: Build Politics term policy and evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout AHA-EchoNet head branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build review-only Politics term policy
        run: node scripts/build-politics-fagverk-term-policy.mjs

      - name: Evaluate Politics policy
        run: node scripts/evaluate-politics-fagverk-policy.mjs

      - name: Verify generated review contract
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const policy = JSON.parse(fs.readFileSync('data/integrations/review/history-go-fagverk-politikk.term-policy.v1.json', 'utf8'));
          const report = JSON.parse(fs.readFileSync('data/evaluation/aha-politics-fagverk-evaluation-report.v1.json', 'utf8'));
          const expectedPolicy = { total: 143, non_scoring: 84, down_weight: 55, context_only: 4 };
          for (const [key, expected] of Object.entries(expectedPolicy)) {
            if (policy.summary?.[key] !== expected) throw new Error(`Unexpected policy summary ${key}: ${policy.summary?.[key]} (expected ${expected})`);
          }
          if (policy.activation_allowed !== false || policy.status !== 'review_policy_not_runtime_active') throw new Error('Term policy must remain review-only.');
          const expectedReport = { total: 34, passed: 34, failed: 0, positive: 13, confusion: 13, ambiguity: 8, chapters_covered: 13, evidence_errors: 0 };
          for (const [key, expected] of Object.entries(expectedReport)) {
            if (report.summary?.[key] !== expected) throw new Error(`Unexpected evaluation summary ${key}: ${report.summary?.[key]} (expected ${expected})`);
          }
          if (report.status !== 'passed_review_gate' || report.runtime_activation_allowed !== false) throw new Error('Evaluation report must remain review-only.');
          console.log(`Verified Politics term policy: ${policy.summary.total} collisions; evaluation ${report.summary.passed}/${report.summary.total}.`);
          NODE

      - name: Materialize generated review files on the PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/integrations/review/history-go-fagverk-politikk.term-policy.v1.json \
            data/evaluation/aha-politics-fagverk-evaluation-report.v1.json
          if git diff --cached --quiet; then
            echo "Generated Politics policy and evaluation already match the branch."
            exit 0
          fi
          git commit -m "Materialize Politics term policy and evaluation report"
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Upload Politics policy artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aha-politics-fagverk-term-policy
          path: |
            data/integrations/review/history-go-fagverk-politikk.term-policy.v1.json
            data/evaluation/aha-politics-fagverk-evaluation-report.v1.json
          if-no-files-found: error
          retention-days: 14
