<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <title>AHA Notes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/aha-chat.css" />
  <link rel="stylesheet" href="css/aha-dashboard.css" />
  <link rel="stylesheet" href="css/aha-notes.css" />
  <link rel="stylesheet" href="css/aha-personal-surfaces.css" />
  <link rel="stylesheet" href="css/aha-global-nav.css" />
</head>
<body>
  <div id="aha-global-nav"></div>
  <main class="aha-dashboard aha-shell-reading aha-personal-page aha-notes-page">
    <section class="aha-panel aha-module-shell aha-personal-header">
      <header class="aha-module-shell-header">
        <div>
          <p class="eyebrow">AHA Modul</p>
          <h1>AHA Notes</h1>
          <p class="aha-module-purpose">Skriv, samle og finn igjen egne notater og lengre tekster.</p>
          <p class="aha-personal-trust">Privat og lokal · Tekst kan analyseres av AHA</p>
        </div>
      </header>
      <div class="aha-module-actions">
        <a class="aha-tile-btn aha-tile-btn-primary" href="index.html">Tilbake til AHA Home</a>
      </div>
    </section>

    <section class="aha-panel aha-personal-compose">
      <div class="aha-personal-compose-head"><p class="eyebrow">Ny</p><h2>Nytt notat</h2></div>
      <form id="note-form" class="module-form">
        <input id="note-title" type="text" placeholder="Tittel" />
        <textarea id="note-text" placeholder="Skriv notat …"></textarea>
        <button type="submit">Lagre notat</button>
      </form>
    </section>

    <section class="aha-panel aha-personal-collection">
      <h2>Lagrede notater</h2>
      <div id="notes-list" class="module-list"></div>
    </section>
  </main>

  <script src="js/ahaModuleApi.js"></script>
  <script src="js/insightsChamber.js"></script>
  <script src="js/metaInsightsEngine.js"></script>
  <script src="js/theoryClustersLoader.js"></script>
  <script src="js/ahaFieldProfiles.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/ahaConfig.js"></script>
  <script src="js/ahaDb.js"></script>
  <script src="js/ahaAuth.js"></script>
  <script src="js/ahaRepository.js"></script>
  <script src="js/ahaChamberSync.js"></script>
  <script src="js/ahaSources.js"></script>
  <script src="js/emnerLoader.js"></script>
  <script src="js/ahaEmneMatcher.js"></script>
  <script src="js/ahaEmbeddings.js"></script>
  <script src="js/ahaIngest.js"></script>
  <script src="js/ahaContracts.js"></script>
  <script src="js/ahaNotes.js"></script>
  <script src="js/ahaPersonalMaterialStatus.js"></script>
<script src="js/ahaModules.js"></script>
<script src="js/ahaGlobalNav.js"></script>
</body>
</html>
