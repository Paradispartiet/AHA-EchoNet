name: AHA Musikk Python patch temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/aha-musikk-python-patch-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - name: Extend shared Python inventory guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/aha_engine/tests/test_fagverk_grounding.py')
          text = p.read_text()
          old = 'assert set(manifest["active_subjects"]) == {"by", "historie", "kunst", "naeringsliv", "natur", "politikk", "subkultur"}'
          new = 'assert set(manifest["active_subjects"]) == {"by", "historie", "kunst", "musikk", "naeringsliv", "natur", "politikk", "subkultur"}'
          if text.count(old) != 1:
              raise SystemExit(f'expected one inventory assertion, found {text.count(old)}')
          p.write_text(text.replace(old, new))
          PY
      - name: Commit patch to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/aha_engine/tests/test_fagverk_grounding.py
          git diff --cached --quiet && exit 0
          git commit -m 'Extend shared Python runtime inventory to Musikk'
          git push origin HEAD:${{ github.head_ref }}
