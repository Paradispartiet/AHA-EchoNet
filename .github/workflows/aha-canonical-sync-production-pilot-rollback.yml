name: AHA canonical sync production pilot rollback

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Skriv RUN_AHA_CANONICAL_PRODUCTION_PILOT_ROLLBACK for database-first cutoff av production-piloten"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: aha-canonical-production-pilot-control
  cancel-in-progress: false

jobs:
  rollback-production-pilot:
    name: Cut off canonical production pilot database-first
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: aha-canonical-production-infra

    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AHA_AZURE_LOCATION: ${{ vars.AHA_PRODUCTION_AZURE_LOCATION || 'westeurope' }}
      AHA_PRODUCTION_RESOURCE_GROUP: ${{ vars.AHA_PRODUCTION_RESOURCE_GROUP || 'rg-aha-canonical-prod' }}
      AHA_PRODUCTION_CONTAINER_APP: aha-canonical-api-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Require main and exact emergency rollback confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo "Production pilot rollback only runs from main." >&2
            exit 1
          fi
          if [[ "$CONFIRMATION" != 'RUN_AHA_CANONICAL_PRODUCTION_PILOT_ROLLBACK' ]]; then
            echo "Exact production pilot rollback confirmation is required." >&2
            exit 1
          fi

      - name: Azure OIDC login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare Container Apps tooling
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Resolve immutable cutoff image and readiness credential
        shell: bash
        run: |
          set -euo pipefail
          app_json="$RUNNER_TEMP/pilot-rollback-app.json"
          az containerapp show \
            --resource-group "$AHA_PRODUCTION_RESOURCE_GROUP" \
            --name "$AHA_PRODUCTION_CONTAINER_APP" \
            -o json --only-show-errors > "$app_json"

          fqdn="$(jq -r '.properties.configuration.ingress.fqdn // empty' "$app_json")"
          deploy_revision="$(jq -r '[.properties.template.containers[0].env[] | select(.name=="AHA_API_VERSION") | .value][0] // empty' "$app_json")"
          cae_id="$(jq -r '.properties.environmentId // empty' "$app_json")"
          runtime_vault_url="$(jq -r '[.properties.configuration.secrets[] | select(.name=="database-url") | .keyVaultUrl][0] // empty' "$app_json")"
          if [[ -z "$fqdn" || ! "$deploy_revision" =~ ^[0-9a-f]{40}$ || -z "$cae_id" || -z "$runtime_vault_url" ]]; then
            echo "Production pilot rollback could not resolve live immutable runtime state." >&2
            exit 1
          fi

          cae_name="${cae_id##*/}"
          runtime_vault="$(AHA_VAULT_URL="$runtime_vault_url" python3 - <<'PY'
import os
from urllib.parse import urlparse
host = urlparse(os.environ['AHA_VAULT_URL']).hostname or ''
if not host.endswith('.vault.azure.net'):
    raise SystemExit(2)
print(host.split('.')[0], end='')
PY
)"

          acr_json="$(az acr list --resource-group "$AHA_PRODUCTION_RESOURCE_GROUP" -o json --only-show-errors)"
          if [[ "$(jq 'length' <<<"$acr_json")" != '1' ]]; then
            echo "Production pilot rollback requires exactly one ACR." >&2
            exit 1
          fi
          acr_name="$(jq -r '.[0].name' <<<"$acr_json")"
          acr_login="$(jq -r '.[0].loginServer' <<<"$acr_json")"
          az acr repository show \
            --name "$acr_name" \
            --image "aha-canonical-db-init:${deploy_revision}" \
            --only-show-errors >/dev/null

          ops_vaults="$(az keyvault list \
            --resource-group "$AHA_PRODUCTION_RESOURCE_GROUP" \
            --query "[?tags.credentialScope=='migration-operations-only']" \
            -o json --only-show-errors)"
          if [[ "$(jq 'length' <<<"$ops_vaults")" != '1' ]]; then
            echo "Production pilot rollback requires exactly one operations-only Key Vault." >&2
            exit 1
          fi
          ops_vault="$(jq -r '.[0].name' <<<"$ops_vaults")"
          ops_vault_uri="$(jq -r '.[0].properties.vaultUri' <<<"$ops_vaults")"

          migration_identities="$(az identity list \
            --resource-group "$AHA_PRODUCTION_RESOURCE_GROUP" \
            --query "[?ends_with(name, '-migration-id')]" \
            -o json --only-show-errors)"
          if [[ "$(jq 'length' <<<"$migration_identities")" != '1' ]]; then
            echo "Production pilot rollback requires exactly one migration identity." >&2
            exit 1
          fi
          migration_identity_name="$(jq -r '.[0].name' <<<"$migration_identities")"

          admin_dsn="$(az keyvault secret show \
            --vault-name "$ops_vault" \
            --name aha-production-admin-database-url \
            --query value -o tsv --only-show-errors)"
          readiness_password="$(az keyvault secret show \
            --vault-name "$ops_vault" \
            --name aha-production-readiness-password \
            --query value -o tsv --only-show-errors)"
          printf '::add-mask::%s\n' "$admin_dsn"
          printf '::add-mask::%s\n' "$readiness_password"

          readiness_dsn="$(AHA_ADMIN_DSN="$admin_dsn" AHA_READINESS_PASSWORD="$readiness_password" python3 - <<'PY'
import os
from urllib.parse import parse_qsl, quote, urlencode, urlparse, urlunparse
parsed = urlparse(os.environ['AHA_ADMIN_DSN'])
if parsed.scheme not in {'postgres', 'postgresql'} or not parsed.hostname:
    raise SystemExit(2)
host = parsed.hostname.lower()
if 'sstuzwppsheivczyqrim' in host or 'wshmybqyksrwkawqleiz' in host:
    raise SystemExit(3)
netloc = f"{quote('aha_canonical_production_readiness', safe='')}:{quote(os.environ['AHA_READINESS_PASSWORD'], safe='')}@{host}"
if parsed.port:
    netloc += f":{parsed.port}"
blocked = {'sslmode','sslcert','sslkey','sslrootcert'}
query = urlencode([(k,v) for k,v in parse_qsl(parsed.query, keep_blank_values=True) if k.lower() not in blocked])
print(urlunparse((parsed.scheme, netloc, parsed.path, parsed.params, query, '')), end='')
PY
)"
          printf '::add-mask::%s\n' "$readiness_dsn"
          runtime_vault_uri="$(az keyvault show --name "$runtime_vault" --query properties.vaultUri -o tsv --only-show-errors)"

          {
            printf 'AHA_PILOT_ROLLBACK_FQDN=%s\n' "$fqdn"
            printf 'AHA_PILOT_ROLLBACK_REVISION=%s\n' "$deploy_revision"
            printf 'AHA_PILOT_ROLLBACK_CAE_NAME=%s\n' "$cae_name"
            printf 'AHA_PILOT_ROLLBACK_RUNTIME_KEYVAULT=%s\n' "$runtime_vault"
            printf 'AHA_PILOT_ROLLBACK_RUNTIME_KEYVAULT_URI=%s\n' "$runtime_vault_uri"
            printf 'AHA_PILOT_ROLLBACK_OPS_KEYVAULT_URI=%s\n' "$ops_vault_uri"
            printf 'AHA_PILOT_ROLLBACK_MIGRATION_IDENTITY_NAME=%s\n' "$migration_identity_name"
            printf 'AHA_PILOT_ROLLBACK_ACR_NAME=%s\n' "$acr_name"
            printf 'AHA_PILOT_ROLLBACK_DB_IMAGE=%s/aha-canonical-db-init:%s\n' "$acr_login" "$deploy_revision"
            printf 'AHA_PILOT_ROLLBACK_READINESS_DSN=%s\n' "$readiness_dsn"
          } >> "$GITHUB_ENV"

      - name: Cut database access first and terminate active pilot sessions
        shell: bash
        run: |
          set -euo pipefail
          job_name="aha-cutoff-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az deployment group create \
            --resource-group "$AHA_PRODUCTION_RESOURCE_GROUP" \
            --name "aha-pilot-cutoff-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --template-file infra/azure/production/db-init-job.bicep \
            --parameters \
              location="$AHA_AZURE_LOCATION" \
              jobName="$job_name" \
              containerAppsEnvironmentName="$AHA_PILOT_ROLLBACK_CAE_NAME" \
              managedIdentityName="$AHA_PILOT_ROLLBACK_MIGRATION_IDENTITY_NAME" \
              acrName="$AHA_PILOT_ROLLBACK_ACR_NAME" \
              image="$AHA_PILOT_ROLLBACK_DB_IMAGE" \
              adminDatabaseUrlSecretUri="${AHA_PILOT_ROLLBACK_OPS_KEYVAULT_URI}secrets/aha-production-admin-database-url" \
              databaseCaSecretUri="${AHA_PILOT_ROLLBACK_OPS_KEYVAULT_URI}secrets/aha-production-database-ca" \
              mode=deactivate_pilot \
            --only-show-errors >/dev/null
          printf 'AHA_PILOT_ROLLBACK_JOB=%s\n' "$job_name" >> "$GITHUB_ENV"

          execution="$(az containerapp job start \
            --name "$job_name" \
            --resource-group "$AHA_PRODUCTION_RESOURCE_GROUP" \
            --query name -o tsv --only-show-errors)"
          if [[ -z "$execution" ]]; then
            echo "Production pilot cutoff did not return an execution name." >&2
            exit 1
          fi
          for attempt in {1..90}; do
            status="$(az containerapp job execution show \
              --name "$job_name" \
              --resource-group "$AHA_PRODUCTION_RESOURCE_GROUP" \
              --job-execution-name "$execution" \
              --query properties.status -o tsv --only-show-errors 2>/dev/null || true)"
            if [[ "$status" == 'Succeeded' ]]; then
              echo "AHA production pilot database cutoff: NOLOGIN_ZERO_SESSIONS"
              break
            fi
            if [[ "$status" == 'Failed' ]]; then
              echo "Production pilot database cutoff failed; API state will not be changed." >&2
              exit 1
            fi
            if [[ "$attempt" == 90 ]]; then
              echo "Timed out waiting for production pilot database cutoff." >&2
              exit 1
            fi
            sleep 10
          done

      - name: Restore readiness database identity only after database cutoff
        shell: bash
        run: |
          set -euo pipefail
          az keyvault secret set \
            --vault-name "$AHA_PILOT_ROLLBACK_RUNTIME_KEYVAULT" \
            --name aha-production-database-url \
            --value "$AHA_PILOT_ROLLBACK_READINESS_DSN" \
            --only-show-errors >/dev/null

      - name: Disable canonical sync and pilot runtime without changing the immutable API image
        shell: bash
        run: |
          set -euo pipefail
          az containerapp update \
            --resource-group "$AHA_PRODUCTION_RESOURCE_GROUP" \
            --name "$AHA_PRODUCTION_CONTAINER_APP" \
            --set-env-vars \
              AHA_RUNTIME_ACTIVATED=false \
              AHA_CANONICAL_SYNC_ENABLED=false \
              AHA_LOCAL_IMPORT_ENABLED=false \
            --remove-env-vars AHA_CANONICAL_SYNC_PILOT_PROFILE_ID \
            --only-show-errors >/dev/null

      - name: Verify safe sync-disabled production health after cutoff
        shell: bash
        run: |
          set -euo pipefail
          health="$RUNNER_TEMP/pilot-cutoff-health.json"
          for attempt in {1..60}; do
            if curl --fail --silent --show-error --max-time 20 "https://${AHA_PILOT_ROLLBACK_FQDN}/v1/health" > "$health"; then
              if jq -e '
                .status == "ok" and
                .service == "aha-nest-api" and
                .runtimeActivated == false and
                .canonicalSync.enabled == false and
                .database.configured == true and
                .database.connected == true and
                .database.safeRuntimeRole == true and
                .database.canonicalSchema == "present"
              ' "$health" >/dev/null; then
                echo "AHA canonical production pilot rollback: PASS_DATABASE_FIRST"
                echo "Canonical sync: DISABLED"
                echo "Pilot data retained for forward-fix or verified restore; no destructive deletion performed."
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Production pilot cutoff did not restore safe health." >&2
          exit 1

      - name: Cleanup short-lived cutoff job
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${AHA_PILOT_ROLLBACK_JOB:-}" ]]; then
            az containerapp job delete \
              --name "$AHA_PILOT_ROLLBACK_JOB" \
              --resource-group "$AHA_PRODUCTION_RESOURCE_GROUP" \
              --yes --only-show-errors >/dev/null 2>&1 || true
          fi
