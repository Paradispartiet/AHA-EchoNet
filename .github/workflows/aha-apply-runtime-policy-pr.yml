name: Materialize AHA runtime policy patch

on:
  pull_request:
    branches:
      - fix/fagverk-authoritative-analysis-sources

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'trigger/materialize-aha-runtime-policy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fagverk-authoritative-analysis-sources
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run embedded architecture patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/aha-apply-runtime-knowledge-policy.yml').read_text()
          start_marker = '      - name: Apply architecture patch\n        shell: bash\n        run: |\n'
          end_marker = '      - name: Syntax checks\n'
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-runtime-policy.sh').write_text('set -euo pipefail\n' + block)
          PY
          bash /tmp/apply-runtime-policy.sh
      - name: Align regression contracts with source-grounded architecture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          fagtekst_path = Path('tests/aha-fagtekst-export-regression.test.cjs')
          fagtekst = fagtekst_path.read_text()
          old = """  'pentekosté',\n  'Kristendom',\n  'Kirkehistorie',\n  'Det nye testamentet',\n  'Det gamle testamentet'\n"""
          new = """  'pentekosté',\n  'Det nye testamentet'\n"""
          if fagtekst.count(old) != 1:
              raise SystemExit('expected legacy Pinse-template expectation block exactly once')
          fagtekst_path.write_text(fagtekst.replace(old, new, 1))

          geo_path = Path('tests/aha-geopolitics-consistency.test.cjs')
          geo = geo_path.read_text()
          old_status = "assert.ok(staleMd.includes('topicConsistency.status: invalid_topic_mismatch'));"
          new_status = "assert.ok(staleMd.includes('topicConsistency.status: invalid_semantic_topic_mismatch'));"
          if geo.count(old_status) != 1:
              raise SystemExit('expected old geopolitics topic status assertion exactly once')
          geo_path.write_text(geo.replace(old_status, new_status, 1))
          PY
      - name: Verify patch
        run: |
          node --check js/ahaChat.js
          node --check js/ahaChatSignals.js
          node --check js/ahaChatExport.js
          node --check tests/aha-runtime-knowledge-policy.test.cjs
          node --check tests/aha-fagtekst-export-regression.test.cjs
          node --check tests/aha-geopolitics-consistency.test.cjs
          npm test
      - name: Commit materialized code only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/aha-apply-runtime-knowledge-policy.yml .github/workflows/aha-apply-runtime-policy-pr.yml
          git add js/ahaChat.js js/ahaChatSignals.js js/ahaChatExport.js tests/aha-runtime-knowledge-policy.test.cjs tests/aha-fagtekst-export-regression.test.cjs tests/aha-geopolitics-consistency.test.cjs
          git commit -m "fix: make Fagverk authoritative for document analysis"
          git push origin HEAD:fix/fagverk-authoritative-analysis-sources
