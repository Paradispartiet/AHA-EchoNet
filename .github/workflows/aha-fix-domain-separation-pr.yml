name: Fix AHA domain and Fagverk routing separation

on:
  pull_request:
    branches:
      - fix/fagverk-authoritative-analysis-sources
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/fagverk-authoritative-analysis-sources
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Separate semantic domain from Fagverk routing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('js/ahaChat.js')
          text = path.read_text()
          old = '    const domain = policyAcademic ? "fagverk_routed_academic" : detectAutoAnalysisDomain(sourceText || "", safePayload || {});'
          new = '    const domain = detectAutoAnalysisDomain(sourceText || "", safePayload || {});'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one policy domain assignment, got {count}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install Node dependencies
        run: npm ci
      - name: Install Python Engine dependencies
        working-directory: backend/aha_engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify Node suite
        run: npm test
      - name: Verify Python Engine suite
        working-directory: backend/aha_engine
        run: python -m pytest
      - name: Verify JS/Python comparison gate
        run: npm run check:aha-engine-comparison
      - name: Commit verified runtime fix and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/aha-fix-domain-separation-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/ahaChat.js .github/workflows/aha-fix-domain-separation-pr.yml
          git diff --cached --check
          git commit -m "Fix semantic domain and Fagverk routing separation"
          git push origin HEAD:fix/fagverk-authoritative-analysis-sources
