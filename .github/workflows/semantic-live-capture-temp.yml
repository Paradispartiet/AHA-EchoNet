name: Semantic live capture temp

on:
  push:
    branches:
      - feat/semantic-live-reviewed-gold-v1
    paths:
      - .github/workflows/semantic-live-capture-temp.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/semantic-live-capture-temp.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Capture replacement production semantic model case
        shell: bash
        run: |
          set -u -o pipefail
          endpoint='https://aha-agent-7a3y.onrender.com/api/aha-agent/semantic-document'
          mkdir -p semantic-live-capture
          id='standardization_flexibility_live_v1'
          text='Et prosjekt brukte én felles mal for alle rapporter. Det gjorde sammenligning enklere, men tvang også svært ulike saker inn i samme struktur. Da malen fikk noen faste felt og noen valgfrie felt, beholdt rapportene en felles kjerne samtidig som de kunne tilpasses saken.'
          payload="$(jq -n --arg text "$text" --arg source_event_id "$id" '{text:$text,format:"aha_semantic_model_output_v1",context:{source_event_id:$source_event_id,source_type:"text",language:"no"}}')"

          for attempt in 1 2 3 4 5; do
            raw="semantic-live-capture/${id}.attempt-${attempt}.raw.json"
            out="semantic-live-capture/${id}.json"
            http_code="$(curl --silent --show-error --max-time 90 \
              -H 'Content-Type: application/json' \
              -X POST "$endpoint" \
              --data "$payload" \
              --output "$raw" \
              --write-out '%{http_code}' || true)"
            echo "${id} attempt=${attempt} http=${http_code}"
            if [ "$http_code" = "200" ] && jq -e '.ok == true and .schema == "aha_semantic_model_contract_v1" and .analysis.schema == "aha_semantic_model_output_v1"' "$raw" >/dev/null 2>&1; then
              jq -n \
                --arg id "$id" \
                --arg text "$text" \
                --arg captured_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --arg attempt "$attempt" \
                --slurpfile response "$raw" \
                '{id:$id,source_text:$text,captured_at:$captured_at,successful_attempt:($attempt|tonumber),response:$response[0]}' > "$out"
              echo "===== ${id} SUCCESS ====="
              jq -c . "$out"
              find semantic-live-capture -name "${id}.attempt-*.raw.json" -delete
              exit 0
            fi
            if [ -s "$raw" ]; then
              jq -c '{ok,error,validation_errors,policy}' "$raw" 2>/dev/null || cat "$raw"
            fi
            sleep 2
          done

          echo "===== ${id} FAILED ====="
          exit 0

      - name: Upload production capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-live-capture
          path: semantic-live-capture/*.json
          if-no-files-found: warn
          retention-days: 1
