name: AHA NestJS API foundation

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/api/**"
      - "tests/aha-nestjs-api-foundation.test.cjs"
      - ".github/workflows/aha-nestjs-api-tests.yml"
  push:
    branches:
      - main
    paths:
      - "backend/api/**"
      - "tests/aha-nestjs-api-foundation.test.cjs"
      - ".github/workflows/aha-nestjs-api-tests.yml"
  workflow_dispatch:

jobs:
  api-foundation:
    name: NestJS API build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/api/package-lock.json

      - name: Generate initial lockfile when absent
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi

      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build strict TypeScript service
        run: npm run build

      - name: Run NestJS foundation tests
        run: node --test test/*.test.mjs

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: aha-nestjs-api-package-lock
          path: backend/api/package-lock.json
          if-no-files-found: error
          retention-days: 7
